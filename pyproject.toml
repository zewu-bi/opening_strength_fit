[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "opening-strength-fit"
version = "0.1.0"
description = "A-share opening-stage signal research pipeline."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "boto3",
  "clickhouse-connect",
  "lightgbm",
  "matplotlib",
  "numpy",
  "pandas",
  "pyarrow",
  "requests",
  "scikit-learn",
  "tqdm",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "ruff",
]

[project.scripts]
osf-analyze-capacity-acceptance = "opening_strength_fit.cli.analyze_capacity_acceptance:main"
osf-analyze-pool-internal-top100 = "opening_strength_fit.cli.analyze_pool_internal_top100:main"
osf-analyze-realistic-acceptance = "opening_strength_fit.cli.analyze_realistic_acceptance:main"
osf-audit-capacity = "opening_strength_fit.cli.audit_capacity:main"
osf-audit-experiments = "opening_strength_fit.cli.audit_experiments:main"
osf-audit-exposure = "opening_strength_fit.cli.audit_exposure:main"
osf-audit-feature-dependence = "opening_strength_fit.cli.audit_feature_dependence:main"
osf-audit-feature-hygiene = "opening_strength_fit.cli.audit_feature_hygiene:main"
osf-build-labeled-cache = "opening_strength_fit.cli.build_labeled_cache:main"
osf-build-exposure-input = "opening_strength_fit.cli.build_exposure_input:main"
osf-build-next-close-labels = "opening_strength_fit.cli.build_next_close_labels:main"
osf-build-target-label-cache = "opening_strength_fit.cli.build_target_label_cache:main"
osf-check-project-contracts = "opening_strength_fit.cli.project_contracts:main"
osf-compare-opening-results = "opening_strength_fit.cli.compare_opening_results:main"
osf-plot-optimization-direction-comparison = "opening_strength_fit.cli.plot_optimization_direction_comparison:main"
osf-plot-rolling-validation-tradeoff = "opening_strength_fit.cli.plot_rolling_validation_tradeoff:main"
osf-plot-signal-baseline-panels = "opening_strength_fit.cli.plot_signal_baseline_panels:main"
osf-plot-weekly-pool-internal = "opening_strength_fit.cli.plot_weekly_pool_internal:main"
osf-plot-weekly-pool-internal-cumulative = "opening_strength_fit.cli.plot_weekly_pool_internal_cumulative:main"
osf-probe-clickhouse-data = "opening_strength_fit.cli.probe_clickhouse_data:main"
osf-render-k8s-job = "opening_strength_fit.cli.render_k8s_job:main"
osf-rolling-job-status = "opening_strength_fit.cli.rolling_job_status:main"
osf-run-alpha-conditioned-rolling-validation = "opening_strength_fit.cli.run_alpha_conditioned_rolling_validation:main"
osf-run-alpha-horizon-decay = "opening_strength_fit.cli.run_alpha_horizon_decay:main"
osf-run-experiment = "opening_strength_fit.cli.run_experiment:main"
osf-run-gap-risk-attribution = "opening_strength_fit.cli.run_gap_risk_attribution:main"
osf-run-learned-risk-layer = "opening_strength_fit.cli.run_learned_risk_layer:main"
osf-run-score-risk-sweep = "opening_strength_fit.cli.run_score_risk_sweep:main"
osf-run-score-tail-guards = "opening_strength_fit.cli.run_score_tail_guards:main"
osf-summarize-opening-results = "opening_strength_fit.cli.summarize_opening_results:main"
osf-sync-experiment-artifacts = "opening_strength_fit.cli.sync_experiment_artifacts:main"
osf-train = "opening_strength_fit.cli.run_experiment:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["opening_strength_fit"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017"]
