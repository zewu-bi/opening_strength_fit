[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "opening-strength-fit"
version = "0.1.0"
description = "A-share opening-stage signal research pipeline."
readme = "README.md"
requires-python = ">=3.12"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
  "numpy",
  "pandas",
  "pyarrow",
  "scikit-learn",
]

[project.optional-dependencies]
data = [
  "boto3",
  "clickhouse-connect",
  "requests",
]
models = [
  "lightgbm",
]
plots = [
  "matplotlib",
]
dev = [
  "boto3",
  "clickhouse-connect",
  "lightgbm",
  "matplotlib",
  "pytest",
  "pytest-cov",
  "requests",
  "ruff",
]
cluster = [
  "boto3",
  "clickhouse-connect",
  "hfcli",
  "lightgbm",
  "matplotlib",
  "requests",
]

[project.scripts]
osf = "opening_strength_fit.cli:main"
osf-analyze-capacity-acceptance = "opening_strength_fit.commands.capacity_acceptance_analysis:main"
osf-analyze-pool-internal-top100 = "opening_strength_fit.commands.pool_internal_analysis:main"
osf-analyze-realistic-acceptance = "opening_strength_fit.commands.realistic_acceptance_analysis:main"
osf-ask-level-attribution = "opening_strength_fit.commands.ask_level_attribution:main"
osf-audit-capacity = "opening_strength_fit.commands.capacity_audit:main"
osf-audit-experiments = "opening_strength_fit.commands.experiment_audit:main"
osf-audit-exposure = "opening_strength_fit.commands.exposure_audit:main"
osf-audit-feature-dependence = "opening_strength_fit.commands.feature_dependence_audit:main"
osf-audit-feature-hygiene = "opening_strength_fit.commands.feature_hygiene_audit:main"
osf-audit-strategy-acceptance = "opening_strength_fit.commands.strategy_acceptance:main"
osf-audit-storage = "opening_strength_fit.commands.storage_audit:main"
osf-build-labeled-cache = "opening_strength_fit.commands.labeled_cache_build:main"
osf-build-long-horizon-labels = "opening_strength_fit.commands.long_horizon_labels:main"
osf-build-long-label-raw-source = "opening_strength_fit.commands.long_label_raw_source:main"
osf-build-exposure-input = "opening_strength_fit.commands.exposure_input_build:main"
osf-build-next-close-labels = "opening_strength_fit.commands.next_close_label_cache:main"
osf-build-raw-source-cache = "opening_strength_fit.commands.raw_source_cache:main"
osf-build-short-labels = "opening_strength_fit.commands.short_label_cache:main"
osf-build-target-label-cache = "opening_strength_fit.commands.target_label_cache:main"
osf-build-training-datasets = "opening_strength_fit.commands.training_dataset_build:main"
osf-split-horizon-labels = "opening_strength_fit.commands.horizon_label_split:main"
osf-split-long-horizon-labels = "opening_strength_fit.commands.long_horizon_label_split:main"
osf-check-project-contracts = "opening_strength_fit.commands.project_contracts:main"
osf-compare-opening-results = "opening_strength_fit.commands.result_comparison:main"
osf-extract-execution-context = "opening_strength_fit.commands.execution_context:main"
osf-plot-optimization-direction-comparison = "opening_strength_fit.commands.optimization_direction_comparison:main"
osf-plot-rolling-validation-tradeoff = "opening_strength_fit.commands.rolling_tradeoff_plot:main"
osf-plot-signal-baseline-panels = "opening_strength_fit.commands.signal_baseline_panels:main"
osf-plot-weekly-pool-internal = "opening_strength_fit.commands.weekly_pool_internal_plots:main"
osf-plot-weekly-pool-internal-cumulative = "opening_strength_fit.commands.weekly_pool_internal_cumulative_plot:main"
osf-probe-clickhouse-data = "opening_strength_fit.commands.clickhouse_probe:main"
osf-render-k8s-job = "opening_strength_fit.commands.k8s_rendering:main"
osf-rolling-job-status = "opening_strength_fit.commands.rolling_status:main"
osf-run-alpha-conditioned-rolling-validation = "opening_strength_fit.commands.alpha_conditioned_rolling_validation:main"
osf-run-alpha-horizon-decay = "opening_strength_fit.commands.horizon_decay:main"
osf-run-experiment = "opening_strength_fit.commands.experiment_run:main"
osf-run-gap-risk-attribution = "opening_strength_fit.commands.gap_risk_attribution:main"
osf-run-learned-risk-layer = "opening_strength_fit.commands.learned_risk_layer:main"
osf-run-score-risk-sweep = "opening_strength_fit.commands.score_risk_sweep:main"
osf-run-score-tail-guards = "opening_strength_fit.commands.score_tail_guards:main"
osf-summarize-opening-results = "opening_strength_fit.commands.opening_result_summary:main"
osf-sync-experiment-artifacts = "opening_strength_fit.commands.artifact_sync:main"
osf-train = "opening_strength_fit.commands.experiment_run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["opening_strength_fit"]

[tool.coverage.report]
fail_under = 55
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["experiments/archive"]

[tool.ruff.lint]
select = ["B", "C901", "E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017"]
