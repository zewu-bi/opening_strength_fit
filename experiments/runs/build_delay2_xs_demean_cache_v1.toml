[run]
id = "build_delay2_xs_demean_cache_v1"
kind = "cache_transform"
description = "Build a derived delay2 labeled cache with cross-sectional demean target_label while preserving raw label for evaluation."
status = "completed"

[target_cache]
input_path = "/mnt/output/opening_strength_fit/cache/opening_1y_next_month_delay2_labeled.parquet"
output_path = "/mnt/output/opening_strength_fit/cache/opening_1y_next_month_delay2_xs_demean_labeled.parquet"
mode = "demean"
group_cols = ["date", "decision_target_timestamp"]
label_col = "label"
target_col = "target_label"
raw_label_col = "label_raw"
min_group_size = 50

[data]
source = "labeled_pvc"
labeled_path = "/mnt/output/opening_strength_fit/cache/opening_1y_next_month_delay2_labeled.parquet"

[output]
local_dir = "output/legacy/analysis/build_delay2_xs_demean_cache_v1"
k8s_dir = "/mnt/output/opening_strength_fit/cache_builds/build_delay2_xs_demean_cache_v1"

[k8s]
namespace = "bizewu"
image_pull_secret = "highfort"
pvc = "bizewu-private-data"
mount_path = "/mnt/output"

[k8s.node_selector]
"kubernetes.io/hostname" = "node8"

[k8s.resources]
cpu_request = "4"
cpu_limit = "8"
memory_request = "96Gi"
memory_limit = "160Gi"
