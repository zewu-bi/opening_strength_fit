[run]
id = "build_delay2_2021_conservative_cap_cache_v1"
kind = "labeled_cache"
description = "Build the 2021 conservative delay2 cache from the legacy coverage semantics, with unique exchange-timestamp ticks, indicative-auction transforms, and strict T-1 market-cap/share enrichment; no freshness or cross-section readiness validity gates."
status = "completed"

[data]
source = "clickhouse"
start_date = "2021-01-01"
end_date = "2021-12-31"
tick_path = ""
input_kind = "raw_ticks"
feature_limit = 0
tick_timestamp_deduplication = "latest_local_timestamp"

[cache]
enabled = true
read = true
write = true
require_manifest = true
schema_version = "delay2_base_labeled_v3_conservative_mcap_lag1_unique_ticks"
path = "/mnt/output/opening_strength_fit/cache/opening_2019_2025_label_v2_tick2_unique_base_mcap_lag1/opening_2021_label_v2_tick2_unique_base_mcap_lag1.parquet"
lock_timeout_seconds = 21600

[clickhouse]
host = "ch.db.prod.highfortfunds.com"
port = 8123
table = "stock.tick"
start_offset_us = 33300000000
end_offset_us = 35100000000

[daily_market_reference]
enabled = true
table = "stock.daily_bar_jy"
lag_sessions = 1
market_cap_unit_multiplier = 10000.0
share_unit_multiplier = 10000.0

[universe]
enabled = true
symbol_regex = "^(?:(?:00|30)\\d{4}\\.SZ|(?:60|68)\\d{4}\\.SH)$"
symbols_file = ""

[sample]
start_time = "09:30:00"
end_time = "09:40:00"
mode = "decision_points"
decision_times = ["09:30:00", "09:31:00", "09:32:00", "09:33:00", "09:34:00", "09:35:00", "09:36:00", "09:37:00", "09:38:00", "09:39:00", "09:40:00"]
decision_max_lag_seconds = 5

[labels]
buy_price_col = "ask_price_1"
volume_col = "volume"
turnover_col = "turnover"
hold_seconds = 60
sell_window_seconds = 60
volume_unit_multiplier = 1.0
fee_bps = 0.0
entry_tick_delay = 2

[features]
include_preopen = true
preopen_price_mode = "indicative_quote_v2"
preopen_match_time = "09:25:00"

[filters]
tradable_statuses = ["T0", "20", "TRADE"]

[window]
mode = "chronological"
train_start_date = "2021-01-01"
test_start_date = "2021-12-01"
test_end_date = "2021-12-31"
train_fraction = 0.8

[evaluation]
score_bins = 10
bucket_mode = "cross_section"
selection_mode = "cross_section"
ic_mode = "cross_section"
top_n = 100

[output]
local_dir = "output/artifacts/cache_builds/build_delay2_2021_conservative_cap_cache_v1"
k8s_dir = "/mnt/output/opening_strength_fit/cache_builds/build_delay2_2021_conservative_cap_cache_v1"

[k8s]
namespace = "bizewu"
job_name = "os-cache-cons-cap-2021"
image_pull_secret = "highfort"
pvc = "bizewu-private-data"
mount_path = "/mnt/output"
clickhouse_secret = "opening-strength-clickhouse"
helper_image = "registry.corp.highfortfunds.com/bizewu/opening-strength-fit:20260716-conservative-cache-v1"
avoid_nodes = ["node7", "node8"]

[k8s.resources]
cpu_request = "8"
cpu_limit = "16"
memory_request = "256Gi"
memory_limit = "512Gi"
