[run]
id = "build_delay2_2022_next_close_labels_v1"
kind = "next_close_label_cache"
description = "Fetch 2022 ClickHouse next-close labels for delay2 base labeled cache v2 decision rows."
status = "queued"

[next_close_labels]
input_path = "/mnt/output/opening_strength_fit/cache/opening_10y_201501_202412_delay2_base_labeled_v2/opening_2022_delay2_base_labeled_v2.parquet"
output_path = "/mnt/output/opening_strength_fit/cache/opening_10y_201501_202412_delay2_next_close_labels_v1/opening_2022_next_close_labels_v1.parquet"
buy_price_col = "buy_price"
decision_times = [
  "09:31:00",
  "09:32:00",
  "09:33:00",
  "09:34:00",
  "09:35:00",
  "09:36:00",
  "09:37:00",
  "09:38:00",
  "09:39:00",
  "09:40:00",
]
close_offset_us = 54000000000
close_lookback_seconds = 1800
calendar_days_after = 14
fee_bps = 0.0

[clickhouse]
host = "ch.db.prod.highfortfunds.com"
port = 8123
table = "stock.tick"

[output]
local_dir = "output/local/build_delay2_2022_next_close_labels_v1"
k8s_dir = "/mnt/output/opening_strength_fit/cache_builds/build_delay2_2022_next_close_labels_v1"

[k8s]
namespace = "bizewu"
image_pull_secret = "highfort"
pvc = "bizewu-private-data"
mount_path = "/mnt/output"
clickhouse_secret = "opening-strength-clickhouse"
helper_image = "registry.corp.highfortfunds.com/bizewu/opening-strength-fit:opening-strength-fit-20260604-next-close-v1"

[k8s.node_selector]
"kubernetes.io/hostname" = "node8"

[k8s.resources]
cpu_request = "4"
cpu_limit = "8"
memory_request = "64Gi"
memory_limit = "128Gi"
