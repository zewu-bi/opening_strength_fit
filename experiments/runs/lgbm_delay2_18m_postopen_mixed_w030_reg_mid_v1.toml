[run]
id = "lgbm_delay2_18m_postopen_mixed_w030_reg_mid_v1"
kind = "exploration"
description = "w030 mixed-label rolling with medium LightGBM sampling/regularization; full postopen v2 feature set."
status = "completed"

[data]
source = "labeled_pvc"
labeled_path = "/mnt/output/opening_strength_fit/cache/opening_18m_202008_202201_delay2_mixed_w030_labeled.parquet"
tick_path = ""
input_kind = "labeled"
feature_limit = 0

[universe]
enabled = true
symbol_regex = "^(?:(?:00|30)\\d{4}\\.SZ|(?:60|68)\\d{4}\\.SH)$"
symbols_file = ""

[sample]
start_time = "09:31:00"
end_time = "09:40:00"
mode = "decision_points"
decision_times = [
  "09:31:00",
  "09:32:00",
  "09:33:00",
  "09:34:00",
  "09:35:00",
  "09:36:00",
  "09:37:00",
  "09:38:00",
  "09:39:00",
  "09:40:00",
]
decision_max_lag_seconds = 5

[labels]
buy_price_col = "ask_price_1"
volume_col = "volume"
turnover_col = "turnover"
hold_seconds = 60
sell_window_seconds = 60
volume_unit_multiplier = 1.0
fee_bps = 0.0
entry_tick_delay = 2

[features]
include_preopen = true
include_postopen_decision = true
postopen_decision_windows = [1, 3, 5]
include_postopen_v2 = true
postopen_v2_windows = [1, 2, 3, 5]
postopen_v2_depth_levels = [3, 5, 10]

[filters]
tradable_statuses = ["T0", "20", "TRADE"]

[window]
mode = "rolling_monthly"
train_months = 12
test_start_month = "2021-08"
test_end_month = "2022-01"

[model]
name = "lightgbm"
target_col = "target_label"
device_type = "cpu"
n_estimators = 400
learning_rate = 0.025
num_leaves = 47
max_depth = -1
min_child_samples = 400
subsample = 0.85
colsample_bytree = 0.85
reg_alpha = 0.02
reg_lambda = 2.0
random_state = 7
n_jobs = 8
max_bin = 63

[evaluation]
score_bins = 10
bucket_mode = "cross_section"
selection_mode = "cross_section"
ic_mode = "cross_section"
top_n = 100

[output]
local_dir = "output/legacy/analysis/lgbm_delay2_18m_postopen_mixed_w030_reg_mid_v1"
k8s_dir = "/mnt/output/opening_strength_fit/runs/models/lightgbm/lgbm_delay2_18m_postopen_mixed_w030_reg_mid_v1"

[k8s]
namespace = "bizewu"
image_pull_secret = "highfort"
pvc = "bizewu-private-data"
mount_path = "/mnt/output"
clickhouse_secret = "opening-strength-clickhouse"
helper_image = "registry.corp.highfortfunds.com/bizewu/opening-strength-fit:20260602-mixed-label-v1"
wait_for_paths = ["/mnt/output/opening_strength_fit/cache/opening_18m_202008_202201_delay2_mixed_w030_labeled.parquet"]
wait_for_path_timeout_seconds = 43200
wait_for_path_interval_seconds = 120
shard_parallelism = 1

[k8s.resources]
cpu_request = "8"
cpu_limit = "16"
memory_request = "192Gi"
memory_limit = "256Gi"
