[run]
id = "build_delay2_18m_mixed_w030_target_v1"
kind = "cache_transform"
description = "Build an 18-month delay2 labeled cache with mixed target_label = zscore(short label) + 0.30 * zscore(next-close label)."
status = "completed"

[target_cache]
input_path = "/mnt/output/opening_strength_fit/cache/opening_18m_202008_202201_delay2_labeled.parquet"
output_path = "/mnt/output/opening_strength_fit/cache/opening_18m_202008_202201_delay2_mixed_w030_labeled.parquet"
mode = "mixed"
group_cols = ["date", "decision_target_timestamp"]
label_col = "label"
target_col = "target_label"
raw_label_col = "label_raw"
min_group_size = 50
long_label_input = "/mnt/output/opening_strength_fit/runs/analyses/alpha-conditioned-rolling-validation/rolling_alpha_conditioned_top100_validation_v1/clickhouse_next_close_labels.parquet"
long_label_col = "alpha_return_next_close"
long_label_weight = 0.30
short_label_transform = "zscore"
long_label_transform = "zscore"

[data]
source = "labeled_pvc"
labeled_path = "/mnt/output/opening_strength_fit/cache/opening_18m_202008_202201_delay2_labeled.parquet"

[output]
local_dir = "output/legacy/analysis/build_delay2_18m_mixed_w030_target_v1"
k8s_dir = "/mnt/output/opening_strength_fit/cache_builds/build_delay2_18m_mixed_w030_target_v1"

[k8s]
namespace = "bizewu"
image_pull_secret = "highfort"
pvc = "bizewu-private-data"
mount_path = "/mnt/output"
helper_image = "registry.corp.highfortfunds.com/bizewu/opening-strength-fit:20260602-mixed-label-v1"

[k8s.node_selector]
"kubernetes.io/hostname" = "node8"

[k8s.resources]
cpu_request = "8"
cpu_limit = "16"
memory_request = "256Gi"
memory_limit = "384Gi"
