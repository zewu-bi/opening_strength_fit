[run]
id = "nn_ds350_label15_36m_grouped_gated_v2_mse_max30_v1"
kind = "exploration"
description = "Isolated convergence run for all fifteen ds350 labels: max 30 epochs with patience 3; preserves the max-10 baseline."
status = "completed"

[data]
source = "labeled_pvc"
input_kind = "labeled"
downcast_float32 = true
trusted_model_ready_split = true
expected_feature_count = 350
label_columns = ["label_short", "label_next_close", "target_label"]
short_label_column = "label_short"

[universe]
enabled = false
symbol_regex = "^(?:(?:00|30)\\d{4}\\.SZ|(?:60|68)\\d{4}\\.SH)$"
symbols_file = ""

[features]
feature_value_transform = "none"

[window]
mode = "rolling_monthly"
train_months = 36
test_months = 6
test_stride_months = 6
test_start_month = "2022-01"
test_end_month = "2025-12"

[model]
name = "torch_mlp"
target_col = "target_label"
architecture = "grouped_gated_v2"
hidden_layers = [768, 512, 256, 128]
group_embedding_dim = 32
fusion_dim = 256
block_hidden_dim = 512
num_blocks = 2
transformer_heads = 4
activation = "gelu"
dropout = 0.10
batch_size = 32768
predict_batch_size = 131072
learning_rate = 0.00025
weight_decay = 0.0001
max_epochs = 30
validation_fraction = 0.01
validation_max_rows = 250000
early_stopping_patience = 3
loss = "mse"
device = "cuda"
random_state = 31
num_workers = 0
training_tensor_storage = "cuda_resident"
cuda_resident_reserve_gib = 12.0
gate_diagnostics_max_rows = 200000

[model.group_embedding_dims]
preopen_auction = 16
limit_price_state = 16
book_depth_level = 48
book_shape_spread_gap = 48
book_imbalance_pressure = 32
trade_activity = 32
trade_price_impact = 32
postopen_price_path = 48
postopen_liquidity_change = 32
historical_surprise = 48
path_shape_confirmation = 48
other = 24

[evaluation]
score_bins = 10
bucket_mode = "cross_section"
selection_mode = "cross_section"
ic_mode = "cross_section"
top_n = 100

[output]
local_dir = "output/artifacts/nn/nn_ds350_label15_36m_grouped_gated_v2_mse_max30_v1"
k8s_dir = "/mnt/output/opening_strength_fit/nn/nn_ds350_label15_36m_grouped_gated_v2_mse_max30_v1"
write_split_artifacts = true

[k8s]
namespace = "bizewu"
job_name = "os-nn-ds350-label15-m30-v1"
image_pull_secret = "highfort"
pvc = "bizewu-private-data"
mount_path = "/mnt/output"
helper_image = "registry.corp.highfortfunds.com/bizewu/opening-strength-fit@sha256:8eb66ef731709af980fa7e047ccb59748c0ed8f4ed36aa3460ee9b1f4a9fe0b6"
avoid_nodes = ["node6", "node7", "node8", "node12", "node17", "node19", "node20", "node22", "node24", "node25", "node26", "node27", "node28"]
shard_parallelism = 8

[k8s.node_selector]
has_gpu = "true"

[k8s.required_node_label_values]
gpu_model = ["A100-80", "H100-80", "H20"]

[k8s.resources]
cpu_request = "8"
cpu_limit = "16"
memory_request = "256Gi"
memory_limit = "384Gi"
gpu_limit = 1

