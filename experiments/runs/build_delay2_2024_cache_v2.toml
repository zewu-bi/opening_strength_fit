[run]
id = "build_delay2_2024_cache_v2"
kind = "labeled_cache"
description = "Rebuild the 2024 shard into the 2015-2024 09:30-09:40 delay2 base labeled cache v2."
status = "queued"

[data]
source = "clickhouse"
start_date = "2024-01-01"
end_date = "2024-12-31"
tick_path = ""
input_kind = "raw_ticks"
feature_limit = 0

[cache]
enabled = true
read = true
write = true
schema_version = "delay2_base_labeled_v2"
path = "/mnt/output/opening_strength_fit/cache/opening_10y_201501_202412_delay2_base_labeled_v2/opening_2024_delay2_base_labeled_v2.parquet"
lock_timeout_seconds = 21600

[clickhouse]
host = "ch.db.prod.highfortfunds.com"
port = 8123
table = "stock.tick"
start_offset_us = 33300000000
end_offset_us = 35100000000

[universe]
enabled = true
symbol_regex = "^(?:(?:00|30)\\d{4}\\.SZ|(?:60|68)\\d{4}\\.SH)$"
symbols_file = ""

[sample]
start_time = "09:30:00"
end_time = "09:40:00"
mode = "decision_points"
decision_times = [
  "09:30:00",
  "09:31:00",
  "09:32:00",
  "09:33:00",
  "09:34:00",
  "09:35:00",
  "09:36:00",
  "09:37:00",
  "09:38:00",
  "09:39:00",
  "09:40:00",
]
decision_max_lag_seconds = 5

[labels]
buy_price_col = "ask_price_1"
volume_col = "volume"
turnover_col = "turnover"
hold_seconds = 60
sell_window_seconds = 60
volume_unit_multiplier = 1.0
fee_bps = 0.0
entry_tick_delay = 2

[features]
include_preopen = true

[filters]
tradable_statuses = ["T0", "20", "TRADE"]

[window]
mode = "chronological"
train_start_date = "2024-01-01"
test_start_date = "2024-12-01"
test_end_date = "2024-12-31"
train_fraction = 0.8

[evaluation]
score_bins = 10
bucket_mode = "cross_section"
selection_mode = "cross_section"
ic_mode = "cross_section"
top_n = 100

[output]
local_dir = "output/local/build_delay2_2024_cache_v2"
k8s_dir = "/mnt/output/opening_strength_fit/build_delay2_2024_cache_v2"

[k8s]
namespace = "bizewu"
image_pull_secret = "highfort"
pvc = "bizewu-private-data"
mount_path = "/mnt/output"
clickhouse_secret = "opening-strength-clickhouse"
helper_image = "registry.corp.highfortfunds.com/bizewu/opening-strength-fit:opening-strength-fit-20260603-cache-v2"

[k8s.node_selector]
"kubernetes.io/hostname" = "node9"

[k8s.resources]
cpu_request = "8"
cpu_limit = "16"
memory_request = "256Gi"
memory_limit = "512Gi"
