[run]
id = "guard_shrunk_target_075_v1"
kind = "exploration"
description = "Delay2 LightGBM 09:31-09:40 post-open v2 trained on guard-shrunk target_label with 75% dirty positive-excess penalty, evaluated on raw 60s label."
status = "completed"

[data]
source = "labeled_pvc"
labeled_path = "/mnt/output/opening_strength_fit/cache/opening_1y_next_month_delay2_guard_shrunk_target_075_v1_labeled.parquet"
tick_path = ""
input_kind = "labeled"
feature_limit = 0

[universe]
enabled = true
symbol_regex = "^(?:(?:00|30)\\d{4}\\.SZ|(?:60|68)\\d{4}\\.SH)$"
symbols_file = ""

[sample]
start_time = "09:31:00"
end_time = "09:40:00"
mode = "decision_points"
decision_times = [
  "09:31:00",
  "09:32:00",
  "09:33:00",
  "09:34:00",
  "09:35:00",
  "09:36:00",
  "09:37:00",
  "09:38:00",
  "09:39:00",
  "09:40:00",
]
decision_max_lag_seconds = 5

[labels]
buy_price_col = "ask_price_1"
volume_col = "volume"
turnover_col = "turnover"
hold_seconds = 60
sell_window_seconds = 60
volume_unit_multiplier = 1.0
fee_bps = 0.0
entry_tick_delay = 2

[features]
include_preopen = true
include_postopen_decision = true
postopen_decision_windows = [1, 3, 5]
include_postopen_v2 = true
postopen_v2_windows = [1, 2, 3, 5]
postopen_v2_depth_levels = [3, 5, 10]

[filters]
tradable_statuses = ["T0", "20", "TRADE"]

[window]
mode = "chronological"
train_start_date = "2021-01-01"
test_start_date = "2022-01-01"
test_end_date = "2022-01-31"
train_fraction = 0.8

[model]
name = "lightgbm"
target_col = "target_label"
device_type = "cpu"
n_estimators = 300
learning_rate = 0.03
num_leaves = 63
max_depth = -1
min_child_samples = 200
subsample = 1.0
colsample_bytree = 1.0
reg_alpha = 0.0
reg_lambda = 0.0
random_state = 7
n_jobs = 8
max_bin = 63

[evaluation]
score_bins = 10
bucket_mode = "cross_section"
selection_mode = "cross_section"
ic_mode = "cross_section"
top_n = 100

[output]
local_dir = "output/legacy/analysis/guard_shrunk_target_075_v1"
k8s_dir = "/mnt/output/opening_strength_fit/runs/models/lightgbm/guard_shrunk_target_075_v1"

[k8s]
namespace = "bizewu"
image_pull_secret = "highfort"
pvc = "bizewu-private-data"
mount_path = "/mnt/output"
clickhouse_secret = "opening-strength-clickhouse"
helper_image = "registry.corp.highfortfunds.com/bizewu/opening-strength-fit:20260528-guard-shrunk-target-v1"

[k8s.node_selector]
"kubernetes.io/hostname" = "node8"

[k8s.resources]
cpu_request = "8"
cpu_limit = "16"
memory_request = "192Gi"
memory_limit = "256Gi"
