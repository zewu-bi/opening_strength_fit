[run]
id = "rolling_alpha_conditioned_top100_validation_v1"
kind = "alpha_conditioned_rolling_validation"
description = "Six-month rolling validation of Top100 alpha-conditioned risk penalties on the 2020-08 to 2022-01 delay2 cache."
status = "completed"

[data]
source = "labeled_pvc"
labeled_path = "/mnt/output/opening_strength_fit/cache/opening_18m_202008_202201_delay2_labeled.parquet"
tick_path = ""
input_kind = "labeled"
feature_limit = 0

[universe]
enabled = true
symbol_regex = "^(?:(?:00|30)\\d{4}\\.SZ|(?:60|68)\\d{4}\\.SH)$"
symbols_file = ""

[sample]
start_time = "09:31:00"
end_time = "09:40:00"
mode = "decision_points"
decision_times = [
  "09:31:00",
  "09:32:00",
  "09:33:00",
  "09:34:00",
  "09:35:00",
  "09:36:00",
  "09:37:00",
  "09:38:00",
  "09:39:00",
  "09:40:00",
]
decision_max_lag_seconds = 5

[features]
include_preopen = true
include_postopen_decision = true
postopen_decision_windows = [1, 3, 5]
include_postopen_v2 = true
postopen_v2_windows = [1, 2, 3, 5]
postopen_v2_depth_levels = [3, 5, 10]

[filters]
tradable_statuses = ["T0", "20", "TRADE"]

[window]
mode = "rolling_monthly"
train_months = 12
test_start_month = "2021-08"
test_end_month = "2022-01"

[risk_layer]
candidate_alpha_rank_min = 0.80
gap_next_rank_max = 0.50
binary_next_rank_max = 0.40
non_candidate_weight = 0.05
candidate_weight = 1.0
calendar_days_after = 10
close_offset_us = 54000000000
close_lookback_seconds = 1800
next_close_label_input = "/mnt/output/opening_strength_fit/rolling_alpha_conditioned_top100_validation_v1/clickhouse_next_close_labels.parquet"

[clickhouse]
host = "ch.db.prod.highfortfunds.com"
port = 8123
table = "stock.tick"

[alpha_conditioning]
device_type = "cpu"
n_estimators = 300
learning_rate = 0.03
num_leaves = 63
max_depth = -1
min_child_samples = 200
subsample = 1.0
colsample_bytree = 1.0
reg_alpha = 0.0
reg_lambda = 0.0
random_state = 1007
n_jobs = 8
max_bin = 63

[gap_model]
device_type = "cpu"
n_estimators = 300
learning_rate = 0.03
num_leaves = 63
max_depth = -1
min_child_samples = 200
subsample = 1.0
colsample_bytree = 1.0
reg_alpha = 0.0
reg_lambda = 0.0
random_state = 43
n_jobs = 8
max_bin = 63

[binary_model]
device_type = "cpu"
n_estimators = 300
learning_rate = 0.03
num_leaves = 63
max_depth = -1
min_child_samples = 200
subsample = 1.0
colsample_bytree = 1.0
reg_alpha = 0.0
reg_lambda = 0.0
random_state = 44
n_jobs = 8
max_bin = 63

[model]
name = "lightgbm"
device_type = "cpu"
n_estimators = 300
learning_rate = 0.03
num_leaves = 63
max_depth = -1
min_child_samples = 200
subsample = 1.0
colsample_bytree = 1.0
reg_alpha = 0.0
reg_lambda = 0.0
random_state = 7
n_jobs = 8
max_bin = 63

[score]
top_n = 100

[[score.variants]]
variant = "alpha_rank"
risk_model = ""
penalty = 0.0
candidate_alpha_rank_min = 0.0

[[score.variants]]
variant = "gap_penalty_030_p80"
risk_model = "gap"
penalty = 0.30
candidate_alpha_rank_min = 0.80

[[score.variants]]
variant = "gap_penalty_035_p80"
risk_model = "gap"
penalty = 0.35
candidate_alpha_rank_min = 0.80

[[score.variants]]
variant = "gap_penalty_030_p90"
risk_model = "gap"
penalty = 0.30
candidate_alpha_rank_min = 0.90

[[score.variants]]
variant = "binary_penalty_035_p80"
risk_model = "binary"
penalty = 0.35
candidate_alpha_rank_min = 0.80

[output]
local_dir = "output/local/rolling_alpha_conditioned_top100_validation_v1"
k8s_dir = "/mnt/output/opening_strength_fit/rolling_alpha_conditioned_top100_validation_v1"

[k8s]
namespace = "bizewu"
image_pull_secret = "highfort"
pvc = "bizewu-private-data"
mount_path = "/mnt/output"
clickhouse_secret = "opening-strength-clickhouse"
helper_image = "registry.corp.highfortfunds.com/bizewu/opening-strength-fit:opening-strength-fit-20260529-alpha-conditioned-risk-v2"

[k8s.node_selector]
"kubernetes.io/hostname" = "node8"

[k8s.resources]
cpu_request = "8"
cpu_limit = "16"
memory_request = "192Gi"
memory_limit = "256Gi"
