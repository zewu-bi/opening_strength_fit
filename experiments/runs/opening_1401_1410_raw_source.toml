[run]
id = "opening_1401_1410_raw_source"
kind = "raw_source_cache"
description = "Label-free and feature-free raw source cache for 14:01:00-14:10:00 training samples."
status = "completed"

[raw_source]
output_root = "/mnt/output/opening_strength_fit/cache/opening_1401_1410_raw_source"
years = [2019, 2020, 2021, 2022, 2023, 2024, 2025]
tick_table = "stock.tick"
daily_table = "stock.daily_bar_jy"
symbol_regex = "^(?:(?:00|30)\\d{4}\\.SZ|(?:60|68)\\d{4}\\.SH)$"
# Keep the pre-open state and the local 13:50-14:20 feature/label window.
# The latest 5m VWAP label ends at 14:16:06, leaving a 234-second tail buffer.
tick_windows = [[33300000000, 33930000000], [49800000000, 51600000000]]
decision_end_offset_us = 51000000000
entry_delay_seconds = 6
short_label_horizons_seconds = [60, 180, 300]
short_label_sell_window_seconds = 60
context_before_days = 31
context_after_days = 14
close_start_offset_us = 52200000000
close_end_offset_us = 54000000000

[k8s]
namespace = "bizewu"
job_name = "os-raw-source-w1401-1410"
pvc = "bizewu-private-data"
mount_path = "/mnt/output"
image_pull_secret = "highfort"
clickhouse_secret = "opening-strength-clickhouse"
helper_image = "registry.corp.highfortfunds.com/bizewu/opening-strength-fit:20260731-raw-source-42ec6bdd"
avoid_nodes = ["node7", "node8"]
shard_parallelism = 2
active_deadline_seconds = 259200
backoff_limit = 2
spread_across_nodes = true
render_mode = "indexed"
render_sha256 = "07057bf35f4471321174a3caa8acb80839153a43c4a56cecdf342a6a9bfc9fbe"

[k8s.resources]
cpu_request = "2"
cpu_limit = "8"
memory_request = "8Gi"
memory_limit = "24Gi"
