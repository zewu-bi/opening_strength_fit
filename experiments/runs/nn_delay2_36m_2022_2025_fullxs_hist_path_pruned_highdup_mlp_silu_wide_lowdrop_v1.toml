[run]
id = "nn_delay2_36m_2022_2025_fullxs_hist_path_pruned_highdup_mlp_silu_wide_lowdrop_v1"
kind = "exploration"
description = "GPU PyTorch wide low-dropout SiLU MLP over 2022-2025 on 328 hist_path_pruned_highdup features; tests smooth activation and less dropout against wide_huber."
status = "completed"

[data]
source = "labeled_pvc"
labeled_path = "/mnt/output/opening_strength_fit/cache/opening_2013_2025_label_v1_tick2_physical_mixed_w030"
tick_path = ""
input_kind = "labeled"
feature_limit = 0
downcast_float32 = true

[universe]
enabled = true
symbol_regex = "^(?:(?:00|30)\\d{4}\\.SZ|(?:60|68)\\d{4}\\.SH)$"
symbols_file = ""

[sample]
start_time = "09:31:00"
end_time = "09:40:00"
mode = "decision_points"
decision_times = ["09:31:00", "09:32:00", "09:33:00", "09:34:00", "09:35:00", "09:36:00", "09:37:00", "09:38:00", "09:39:00", "09:40:00"]
decision_max_lag_seconds = 5

[labels]
buy_price_col = "ask_price_1"
volume_col = "volume"
turnover_col = "turnover"
hold_seconds = 60
sell_window_seconds = 60
volume_unit_multiplier = 1.0
fee_bps = 0.0
entry_tick_delay = 2

[features]
include_preopen = true
include_postopen_decision = true
postopen_decision_windows = [1, 3, 5]
include_postopen_v2 = true
postopen_v2_windows = [1, 2, 3, 5]
postopen_v2_depth_levels = [3, 5, 10]
include_historical_same_minute_surprise = true
historical_surprise_windows = [20, 60]
historical_surprise_min_periods = 10
historical_surprise_modes = ["zscore", "ratio"]
historical_surprise_columns = ["volume_diff_1t", "volume_diff_3t", "turnover_diff_1t", "turnover_diff_3t", "spread_bps", "ask_depth_10", "bid_depth_10", "depth_imbalance_1", "depth_imbalance_10", "return_vs_open", "return_vs_prev_close", "trade_vwap_1t", "postopen_v2_trade_vwap_vs_ask1_1t_bps", "postopen_v2_trade_turnover_to_depth_notional_1t", "postopen_v2_spread_compression_1m"]
historical_surprise_prefix = "hist_surprise_"
include_path_shape_confirmation = true
path_shape_windows = [2, 3, 5]
path_shape_prefix = "path_shape_"
drop_feature_columns = [
  "volume",
  "turnover",
  "iopv",
  "hist_surprise_ask_depth_10_20d_ratio",
  "hist_surprise_ask_depth_10_60d_ratio",
  "hist_surprise_ask_depth_10_60d_zscore",
  "hist_surprise_bid_depth_10_20d_ratio",
  "hist_surprise_bid_depth_10_20d_zscore",
  "hist_surprise_bid_depth_10_60d_ratio",
  "hist_surprise_depth_imbalance_10_20d_zscore",
  "hist_surprise_depth_imbalance_1_20d_zscore",
  "hist_surprise_postopen_v2_trade_turnover_to_depth_notional_1t_20d_ratio",
  "hist_surprise_postopen_v2_trade_turnover_to_depth_notional_1t_60d_ratio",
  "hist_surprise_postopen_v2_trade_vwap_vs_ask1_1t_bps_20d_zscore",
  "hist_surprise_turnover_diff_1t_20d_ratio",
  "hist_surprise_turnover_diff_1t_20d_zscore",
  "hist_surprise_turnover_diff_1t_60d_ratio",
  "hist_surprise_turnover_diff_1t_60d_zscore",
  "hist_surprise_turnover_diff_3t_20d_ratio",
  "hist_surprise_turnover_diff_3t_20d_zscore",
  "hist_surprise_turnover_diff_3t_60d_ratio",
  "hist_surprise_turnover_diff_3t_60d_zscore",
  "hist_surprise_volume_diff_1t_20d_ratio",
  "hist_surprise_volume_diff_1t_60d_ratio",
  "hist_surprise_volume_diff_3t_20d_ratio",
  "hist_surprise_volume_diff_3t_60d_ratio",
  "path_shape_return_accel_1m_vs_2m",
  "path_shape_return_accel_1m_vs_5m",
  "path_shape_spread_widen_after_upmove",
]
include_feature_columns = ["exch_time_offset_us", "trade_num", "ask_price_1", "bid_price_1", "mid_price", "spread_abs", "spread_bps", "ask1_to_limit_up_bps", "return_vs_prev_close", "return_vs_open", "total_ask_volume", "total_bid_volume", "total_ask_count", "total_bid_count", "avg_ask_price", "avg_bid_price"]
include_feature_prefixes = ["preopen_", "ask_volume_", "bid_volume_", "ask_count_", "bid_count_", "ask_depth_", "bid_depth_", "depth_imbalance_", "ask_gap_", "bid_gap_", "volume_diff_", "turnover_diff_", "trade_vwap_", "return_", "postopen_v2_trade_vwap_vs_", "postopen_v2_trade_turnover_to_depth_notional_", "postopen_v2_trade_volume_to_ask_depth10_", "postopen_v2_trade_volume_to_bid_depth10_", "postopen_v2_mid_price_from_open_", "postopen_v2_ask_price_1_from_open_", "postopen_v2_bid_price_1_from_open_", "postopen_v2_depth_imbalance_", "postopen_v2_ask_depth_", "postopen_v2_bid_depth_", "postopen_v2_depth_concentration_", "postopen_v2_ask1_share_depth_", "postopen_v2_bid1_share_depth_", "postopen_v2_ask_gap_curve_", "postopen_v2_bid_gap_curve_", "postopen_v2_ask_gap_max_", "postopen_v2_bid_gap_max_", "postopen_v2_spread_compression_", "postopen_v2_spread_bps_from_open_", "postopen_v2_ask1_queue_replenish_vs_trade_", "postopen_v2_bid1_queue_replenish_vs_trade_", "hist_surprise_", "path_shape_"]
include_feature_regexes = ["^postopen_(?!v2_)"]

[filters]
tradable_statuses = ["T0", "20", "TRADE"]

[window]
mode = "rolling_monthly"
train_months = 36
test_months = 6
test_stride_months = 6
test_start_month = "2022-01"
test_end_month = "2025-12"

[model]
name = "torch_mlp"
target_col = "target_label"
hidden_layers = [1024, 768, 384]
activation = "silu"
dropout = 0.08
batch_size = 32768
predict_batch_size = 131072
learning_rate = 0.0002
weight_decay = 0.0002
max_epochs = 10
validation_fraction = 0.01
validation_max_rows = 250000
early_stopping_patience = 2
loss = "mse"
device = "cuda"
random_state = 17
num_workers = 0

[evaluation]
score_bins = 10
bucket_mode = "cross_section"
selection_mode = "cross_section"
ic_mode = "cross_section"
top_n = 100

[output]
local_dir = "output/artifacts/nn/nn_delay2_36m_2022_2025_fullxs_hist_path_pruned_highdup_mlp_silu_wide_lowdrop_v1"
k8s_dir = "/mnt/output/opening_strength_fit/runs/models/nn/nn_delay2_36m_2022_2025_fullxs_hist_path_pruned_highdup_mlp_silu_wide_lowdrop_v1"

[k8s]
namespace = "bizewu"
job_name = "os-nn-2225-silu-wide"
image_pull_secret = "highfort"
pvc = "bizewu-private-data"
mount_path = "/mnt/output"
clickhouse_secret = "opening-strength-clickhouse"
helper_image = "registry.corp.highfortfunds.com/bizewu/opening-strength-fit:20260626-nn-gpu-v2"
avoid_nodes = ["node7", "node8", "node20", "node21"]
wait_for_paths = ["/mnt/output/opening_strength_fit/cache/opening_2013_2025_label_v1_tick2_physical_mixed_w030/opening_2019_label_v1_tick2_physical_mixed_w030.parquet", "/mnt/output/opening_strength_fit/cache/opening_2013_2025_label_v1_tick2_physical_mixed_w030/opening_2020_label_v1_tick2_physical_mixed_w030.parquet", "/mnt/output/opening_strength_fit/cache/opening_2013_2025_label_v1_tick2_physical_mixed_w030/opening_2021_label_v1_tick2_physical_mixed_w030.parquet", "/mnt/output/opening_strength_fit/cache/opening_2013_2025_label_v1_tick2_physical_mixed_w030/opening_2022_label_v1_tick2_physical_mixed_w030.parquet", "/mnt/output/opening_strength_fit/cache/opening_2013_2025_label_v1_tick2_physical_mixed_w030/opening_2023_label_v1_tick2_physical_mixed_w030.parquet", "/mnt/output/opening_strength_fit/cache/opening_2013_2025_label_v1_tick2_physical_mixed_w030/opening_2024_label_v1_tick2_physical_mixed_w030.parquet", "/mnt/output/opening_strength_fit/cache/opening_2013_2025_label_v1_tick2_physical_mixed_w030/opening_2025_label_v1_tick2_physical_mixed_w030.parquet"]
wait_for_path_timeout_seconds = 43200
wait_for_path_interval_seconds = 120
shard_parallelism = 1

[k8s.node_selector]
has_gpu = "true"
mem_per_gpu_tier = "high"

[k8s.resources]
cpu_request = "16"
cpu_limit = "32"
memory_request = "512Gi"
memory_limit = "768Gi"
gpu_limit = 1

[analysis.pool_internal]
enabled = true
job_name = "os-analyze-nn-silu-wide"
variant = "nn_silu_wide_lowdrop"
plot_prefix = "nn_silu_wide_lowdrop"
plot_variant_label = "2022-2025 NN SiLU wide low-dropout"
plot_period = "quarter"
pools = ["universe", "L"]
top_n = 100
