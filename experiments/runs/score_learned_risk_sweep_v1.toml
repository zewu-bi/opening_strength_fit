[run]
id = "score_learned_risk_sweep_v1"
kind = "score_risk_sweep"
description = "Sweep baseline alpha rank minus learned risk model scores, comparing guard-teacher and bad-tail risk layers."
status = "completed"

[risk_sweep]
score_col = "prediction"
risk_score_col = "prediction"
risk_score_transform = "rank"
top_n = 100
start_clock = "09:31"
end_clock = "09:40"
include_alpha_rank = true
include_manual_risk = false
include_hard_gates = false
wait_for_inputs_seconds = 86400
next_close_label_input = "/mnt/output/opening_strength_fit/score_risk_sweep_guard_shrunk_v1/clickhouse_next_close_labels.parquet"

[[risk_sweep.inputs]]
run_id = "lgbm_delay2_postopen_0931_0940_baseline_v1"
prediction_path = "/mnt/output/opening_strength_fit/lgbm_delay2_postopen_0931_0940_baseline_v1/predictions.parquet"

[[risk_sweep.risk_inputs]]
risk_id = "guard_teacher"
prediction_path = "/mnt/output/opening_strength_fit/learned_risk_layer_guard_teacher_v1/predictions.parquet"
score_col = "prediction"
score_transform = "rank"

[[risk_sweep.risk_inputs]]
risk_id = "bad_tail"
prediction_path = "/mnt/output/opening_strength_fit/learned_risk_layer_bad_tail_v1/predictions.parquet"
score_col = "prediction"
score_transform = "rank"

[output]
local_dir = "output/legacy/analysis/score_learned_risk_sweep_v1"
k8s_dir = "/mnt/output/opening_strength_fit/score_learned_risk_sweep_v1"

[k8s]
namespace = "bizewu"
image_pull_secret = "highfort"
pvc = "bizewu-private-data"
mount_path = "/mnt/output"
clickhouse_secret = "opening-strength-clickhouse"
helper_image = "registry.corp.highfortfunds.com/bizewu/opening-strength-fit:20260528-learned-risk-v1"

[k8s.node_selector]
"kubernetes.io/hostname" = "node8"

[k8s.resources]
cpu_request = "4"
cpu_limit = "8"
memory_request = "64Gi"
memory_limit = "128Gi"
