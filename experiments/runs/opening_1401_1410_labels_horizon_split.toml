[run]
id = "opening_1401_1410_labels_horizon_split"
kind = "training_horizon_label_split"
description = "Split the completed 14:01-14:10 combined annual labels into independent 1m, 3m, and 5m training datasets."
status = "completed"

[dataset]
years = [2019, 2020, 2021, 2022, 2023, 2024, 2025]
label_output_root = "/mnt/output/opening_strength_fit/datasets/opening_1401_1410_labels_1m_3m_5m_next_mixed"
horizon_label_output_template = "/mnt/output/opening_strength_fit/datasets/opening_1401_1410_labels_h{horizon_minutes}m_v2"
mixed_next_close_weight = 0.30
mixed_min_group_size = 50
