[run]
id = "opening_0931_0940_raw_source"
kind = "raw_source_cache"
description = "Label-free and feature-free raw source cache for 09:31:00-09:40:00 training samples."
status = "running"

[raw_source]
output_root = "/mnt/output/opening_strength_fit/cache/opening_0931_0940_raw_source"
years = [2019, 2020, 2021, 2022, 2023, 2024, 2025]
tick_table = "stock.tick"
daily_table = "stock.daily_bar_jy"
symbol_regex = "^(?:(?:00|30)\\d{4}\\.SZ|(?:60|68)\\d{4}\\.SH)$"
# 09:15-09:45 covers auction/pre-open state, decision clocks, delayed entry,
# 1-minute labels and 3-minute VWAP labels with a small trailing buffer.
tick_windows = [[33300000000, 35100000000]]
context_before_days = 31
context_after_days = 14
close_start_offset_us = 52200000000
close_end_offset_us = 54000000000

[k8s]
namespace = "bizewu"
job_name = "os-raw-source-w0931-0940"
pvc = "bizewu-private-data"
mount_path = "/mnt/output"
image_pull_secret = "highfort"
clickhouse_secret = "opening-strength-clickhouse"
avoid_nodes = ["node7", "node8"]
shard_parallelism = 2

[k8s.resources]
cpu_request = "2"
cpu_limit = "8"
memory_request = "8Gi"
memory_limit = "24Gi"
