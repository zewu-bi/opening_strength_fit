[run]
id = "build_delay6_clock_state_1101_1110_from_start_cache_v1"
kind = "labeled_cache"
description = "Build the 2019-2025 11:00-11:10 fixed-clock feature cache: 11:00 is the from-start context row and 11:01-11:10 are the ten model decision rows; auction features are reused from the canonical opening cache with strict T-1 market-cap/share enrichment."
status = "superseded"
closed_at = "2026-08-11"
status_reason = "Governance reconciliation: the later ds350 layered-data lineage replaced this unexecuted route."

[data]
source = "clickhouse"
tick_path = ""
input_kind = "raw_ticks"
feature_limit = 0
tick_timestamp_deduplication = "latest_local_timestamp"

[cache]
enabled = true
read = true
write = true
require_manifest = true
schema_version = "label_v5_clock6_state_window_start_auction_reuse_mcap_lag1"
lock_timeout_seconds = 21600

[cache_shards]
years = [2019, 2020, 2021, 2022, 2023, 2024, 2025]
cache_path_template = "/mnt/output/opening_strength_fit/cache/opening_2019_2025_label_v5_clock6_1101_1110_from_start_auction_reuse_mcap_lag1/opening_{year}_label_v5_clock6_1101_1110_from_start_auction_reuse_mcap_lag1.parquet"
reuse_labeled_path_template = "/mnt/output/opening_strength_fit/cache/opening_2019_2025_label_v4_clock6_state_unique_base_mcap_lag1/opening_{year}_label_v4_clock6_state_unique_base_mcap_lag1.parquet"

[clickhouse]
host = "ch.db.prod.highfortfunds.com"
port = 8123
table = "stock.tick"
start_offset_us = 39000000000
end_offset_us = 40340000000

[daily_market_reference]
enabled = true
table = "stock.daily_bar_jy"
lag_sessions = 1
market_cap_unit_multiplier = 10000.0
share_unit_multiplier = 10000.0

[universe]
enabled = true
symbol_regex = "^(?:(?:00|30)\\d{4}\\.SZ|(?:60|68)\\d{4}\\.SH)$"
symbols_file = ""

[sample]
start_time = "11:00:00"
end_time = "11:10:00"
mode = "decision_points"
decision_times = ["11:00:00", "11:01:00", "11:02:00", "11:03:00", "11:04:00", "11:05:00", "11:06:00", "11:07:00", "11:08:00", "11:09:00", "11:10:00"]
decision_max_lag_seconds = 5

[labels]
buy_price_col = "ask_price_1"
volume_col = "volume"
turnover_col = "turnover"
hold_seconds = 60
sell_window_seconds = 60
volume_unit_multiplier = 1.0
fee_bps = 0.0
entry_tick_delay = 2
entry_alignment = "clock_state"
entry_clock_delay_seconds = 6
future_alignment = "clock_state"
require_entry_after_cross_section_ready = true

[features]
include_preopen = false
reuse_feature_prefixes = ["preopen_", "auction_"]
reuse_key_columns = ["date", "symbol"]
reuse_join = "inner"
reuse_require_constant = true
postopen_v2_reference_name = "start"
path_shape_reference_name = "start"

[filters]
tradable_statuses = ["T0", "20", "TRADE"]

[window]
mode = "chronological"
train_fraction = 0.8

[evaluation]
score_bins = 10
bucket_mode = "cross_section"
selection_mode = "cross_section"
ic_mode = "cross_section"
top_n = 100

[output]
local_dir = "output/artifacts/cache_builds/build_delay6_clock_state_1101_1110_from_start_cache_v1"
k8s_dir = "/mnt/output/opening_strength_fit/cache_builds/build_delay6_clock_state_1101_1110_from_start_cache_v1"

[k8s]
namespace = "bizewu"
job_name = "os-cache-clock6-w1101-1110-v1"
image_pull_secret = "highfort"
pvc = "bizewu-private-data"
mount_path = "/mnt/output"
clickhouse_secret = "opening-strength-clickhouse"
helper_image = "registry.corp.highfortfunds.com/bizewu/opening-strength-fit:20260729-clock-window-cache-v1"
avoid_nodes = ["node7", "node8"]
shard_parallelism = 7
backoff_limit = 0
spread_across_nodes = true
render_mode = "indexed"
render_sha256 = "d2915497eb93853d8193be27880554d6c9a610c1d1acae61aa6b748d7bd7d66b"

[k8s.resources]
cpu_request = "8"
cpu_limit = "16"
memory_request = "48Gi"
memory_limit = "256Gi"
