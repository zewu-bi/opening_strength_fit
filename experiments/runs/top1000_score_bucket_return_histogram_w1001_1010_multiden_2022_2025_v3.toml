[run]
id = "top1000_score_bucket_return_histogram_w1001_1010_multiden_2022_2025_v3"
kind = "pool_internal_analysis"
description = "Canonical ten-curve Top1000 score-bucket next-excess return distribution for the 10:01-10:10 multi-denominator window, using only complete Top1000 cross-sections."
status = "completed"

[window]
mode = "rolling_monthly"
test_start_month = "2022-01"
