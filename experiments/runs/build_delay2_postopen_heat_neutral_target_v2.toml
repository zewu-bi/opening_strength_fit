[run]
id = "build_delay2_postopen_heat_neutral_target_v2"
kind = "cache_transform"
description = "Build a derived delay2 labeled cache with a gentler post-open heat-neutral target_label using only short-window momentum and turnover-flow exposures."
status = "completed"

[target_cache]
input_path = "/mnt/output/opening_strength_fit/cache/opening_1y_next_month_delay2_labeled.parquet"
output_path = "/mnt/output/opening_strength_fit/cache/opening_1y_next_month_delay2_postopen_heat_neutral_v2_labeled.parquet"
mode = "heat_neutral"
group_cols = ["date", "decision_target_timestamp"]
label_col = "label"
target_col = "target_label"
raw_label_col = "label_raw"
min_group_size = 50
neutralization_strength = 0.25
neutralization_ridge_alpha = 20.0
neutralization_transform = "rank_centered"
min_neutralize_cols = 4
neutralize_cols = [
  "return_1t",
  "return_3t",
  "return_10t",
  "return_30t",
  "volume_diff_1t",
  "volume_diff_3t",
  "volume_diff_10t",
  "volume_diff_30t",
  "turnover_diff_1t",
  "turnover_diff_3t",
  "turnover_diff_10t",
  "turnover_diff_30t",
  "trade_vwap_1t",
  "trade_vwap_3t",
  "trade_vwap_10t",
  "trade_vwap_30t",
]

[data]
source = "labeled_pvc"
labeled_path = "/mnt/output/opening_strength_fit/cache/opening_1y_next_month_delay2_labeled.parquet"

[output]
local_dir = "output/legacy/analysis/build_delay2_postopen_heat_neutral_target_v2"
k8s_dir = "/mnt/output/opening_strength_fit/cache_builds/build_delay2_postopen_heat_neutral_target_v2"

[k8s]
namespace = "bizewu"
image_pull_secret = "highfort"
pvc = "bizewu-private-data"
mount_path = "/mnt/output"
helper_image = "registry.corp.highfortfunds.com/bizewu/opening-strength-fit:20260528-next-flip-v1"

[k8s.node_selector]
"kubernetes.io/hostname" = "node8"

[k8s.resources]
cpu_request = "4"
cpu_limit = "8"
memory_request = "96Gi"
memory_limit = "160Gi"
