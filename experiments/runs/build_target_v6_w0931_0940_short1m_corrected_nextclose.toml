[run]
id = "build_target_v6_w0931_0940_short1m_corrected_nextclose"
kind = "cache_transform"
description = "Build seven annual v6 mixed-target shards for 09:31:00-09:40:00: short1m short component plus corrected same-window next-close long component."
status = "completed"

[target_cache]
input_path = "/mnt/output/opening_strength_fit/cache/opening_2019_2025_label_v6_decision_clock_state_clock6_unique_base_mcap_lag1/opening_2019_label_v6_decision_clock_state_clock6_unique_base_mcap_lag1.parquet"
output_path = "/mnt/output/opening_strength_fit/cache/opening_2019_2025_target_v6_w0931_0940_short1m_corrected_nextclose/opening_2019_target_v6_w0931_0940_short1m_corrected_nextclose.parquet"
mode = "mixed"
group_cols = ["date", "decision_target_timestamp"]
label_col = "label"
target_col = "target_label"
raw_label_col = "label_raw"
min_group_size = 50
long_label_input = "/mnt/output/opening_strength_fit/cache/opening_2019_2025_next_close_decision_clock_state_clock6_0931_0940/opening_2019_next_close_decision_clock_state_clock6_0931_0940.parquet"
long_label_col = "alpha_return_next_close"
long_label_weight = 0.30
short_label_transform = "zscore"
long_label_transform = "zscore"

[target_cache_shards]
years = [2019, 2020, 2021, 2022, 2023, 2024, 2025]
input_path_template = "/mnt/output/opening_strength_fit/cache/opening_2019_2025_label_v6_decision_clock_state_clock6_unique_base_mcap_lag1/opening_{year}_label_v6_decision_clock_state_clock6_unique_base_mcap_lag1.parquet"
output_path_template = "/mnt/output/opening_strength_fit/cache/opening_2019_2025_target_v6_w0931_0940_short1m_corrected_nextclose/opening_{year}_target_v6_w0931_0940_short1m_corrected_nextclose.parquet"
long_label_input_template = "/mnt/output/opening_strength_fit/cache/opening_2019_2025_next_close_decision_clock_state_clock6_0931_0940/opening_{year}_next_close_decision_clock_state_clock6_0931_0940.parquet"

[data]
source = "labeled_pvc"
labeled_path = "/mnt/output/opening_strength_fit/cache/opening_2019_2025_label_v6_decision_clock_state_clock6_unique_base_mcap_lag1"

[output]
local_dir = "output/artifacts/cache_builds/build_target_v6_w0931_0940_short1m_corrected_nextclose"
k8s_dir = "/mnt/output/opening_strength_fit/cache_builds/build_target_v6_w0931_0940_short1m_corrected_nextclose"

[k8s]
namespace = "bizewu"
job_name = "os-target-v6-0931-0940-short1m"
image_pull_secret = "highfort"
pvc = "bizewu-private-data"
mount_path = "/mnt/output"
helper_image = "registry.corp.highfortfunds.com/bizewu/opening-strength-fit:20260731-corrected-label-matrix"
avoid_nodes = ["node7", "node8"]
shard_parallelism = 7

[k8s.resources]
cpu_request = "8"
cpu_limit = "16"
memory_request = "256Gi"
memory_limit = "512Gi"
