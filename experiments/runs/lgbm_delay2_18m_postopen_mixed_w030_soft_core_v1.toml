[run]
id = "lgbm_delay2_18m_postopen_mixed_w030_soft_core_v1"
kind = "exploration"
description = "w030 mixed-label rolling with soft feature regroup; baseline LightGBM parameters."
status = "completed"

[data]
source = "labeled_pvc"
labeled_path = "/mnt/output/opening_strength_fit/cache/opening_18m_202008_202201_delay2_mixed_w030_labeled.parquet"
tick_path = ""
input_kind = "labeled"
feature_limit = 0

[universe]
enabled = true
symbol_regex = "^(?:(?:00|30)\\d{4}\\.SZ|(?:60|68)\\d{4}\\.SH)$"
symbols_file = ""

[sample]
start_time = "09:31:00"
end_time = "09:40:00"
mode = "decision_points"
decision_times = [
  "09:31:00",
  "09:32:00",
  "09:33:00",
  "09:34:00",
  "09:35:00",
  "09:36:00",
  "09:37:00",
  "09:38:00",
  "09:39:00",
  "09:40:00",
]
decision_max_lag_seconds = 5

[labels]
buy_price_col = "ask_price_1"
volume_col = "volume"
turnover_col = "turnover"
hold_seconds = 60
sell_window_seconds = 60
volume_unit_multiplier = 1.0
fee_bps = 0.0
entry_tick_delay = 2

[features]
include_preopen = true
include_postopen_decision = true
postopen_decision_windows = [1, 3, 5]
include_postopen_v2 = true
postopen_v2_windows = [1, 2, 3, 5]
postopen_v2_depth_levels = [3, 5, 10]
drop_feature_columns = ["volume", "turnover", "iopv"]
include_feature_columns = [
  "exch_time_offset_us",
  "trade_num",
  "ask_price_1",
  "bid_price_1",
  "mid_price",
  "spread_abs",
  "spread_bps",
  "ask1_to_limit_up_bps",
  "return_vs_prev_close",
  "return_vs_open",
  "total_ask_volume",
  "total_bid_volume",
  "total_ask_count",
  "total_bid_count",
  "avg_ask_price",
  "avg_bid_price",
]
include_feature_prefixes = [
  "preopen_",
  "ask_volume_",
  "bid_volume_",
  "ask_count_",
  "bid_count_",
  "ask_depth_",
  "bid_depth_",
  "depth_imbalance_",
  "ask_gap_",
  "bid_gap_",
  "volume_diff_",
  "turnover_diff_",
  "trade_vwap_",
  "return_",
  "postopen_v2_trade_vwap_vs_",
  "postopen_v2_trade_turnover_to_depth_notional_",
  "postopen_v2_trade_volume_to_ask_depth10_",
  "postopen_v2_trade_volume_to_bid_depth10_",
  "postopen_v2_mid_price_from_open_",
  "postopen_v2_ask_price_1_from_open_",
  "postopen_v2_bid_price_1_from_open_",
  "postopen_v2_depth_imbalance_",
  "postopen_v2_ask_depth_",
  "postopen_v2_bid_depth_",
  "postopen_v2_depth_concentration_",
  "postopen_v2_ask1_share_depth_",
  "postopen_v2_bid1_share_depth_",
  "postopen_v2_ask_gap_curve_",
  "postopen_v2_bid_gap_curve_",
  "postopen_v2_ask_gap_max_",
  "postopen_v2_bid_gap_max_",
  "postopen_v2_spread_compression_",
  "postopen_v2_spread_bps_from_open_",
  "postopen_v2_ask1_queue_replenish_vs_trade_",
  "postopen_v2_bid1_queue_replenish_vs_trade_",
]
include_feature_regexes = ["^postopen_(?!v2_)"]

[filters]
tradable_statuses = ["T0", "20", "TRADE"]

[window]
mode = "rolling_monthly"
train_months = 12
test_start_month = "2021-08"
test_end_month = "2022-01"

[model]
name = "lightgbm"
target_col = "target_label"
device_type = "cpu"
n_estimators = 300
learning_rate = 0.03
num_leaves = 63
max_depth = -1
min_child_samples = 200
subsample = 1.0
colsample_bytree = 1.0
reg_alpha = 0.0
reg_lambda = 0.0
random_state = 7
n_jobs = 8
max_bin = 63

[evaluation]
score_bins = 10
bucket_mode = "cross_section"
selection_mode = "cross_section"
ic_mode = "cross_section"
top_n = 100

[output]
local_dir = "output/legacy/analysis/lgbm_delay2_18m_postopen_mixed_w030_soft_core_v1"
k8s_dir = "/mnt/output/opening_strength_fit/lgbm_delay2_18m_postopen_mixed_w030_soft_core_v1"

[k8s]
namespace = "bizewu"
image_pull_secret = "highfort"
pvc = "bizewu-private-data"
mount_path = "/mnt/output"
clickhouse_secret = "opening-strength-clickhouse"
helper_image = "registry.corp.highfortfunds.com/bizewu/opening-strength-fit:20260602-mixed-label-v1"
wait_for_paths = ["/mnt/output/opening_strength_fit/cache/opening_18m_202008_202201_delay2_mixed_w030_labeled.parquet"]
wait_for_path_timeout_seconds = 43200
wait_for_path_interval_seconds = 120
shard_parallelism = 1

[k8s.resources]
cpu_request = "8"
cpu_limit = "16"
memory_request = "192Gi"
memory_limit = "256Gi"
