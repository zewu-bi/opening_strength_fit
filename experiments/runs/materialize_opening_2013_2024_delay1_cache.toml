[run]
id = "materialize_opening_2013_2024_delay1_cache"
kind = "cache"
description = "Materialize the long 2013-2024 delay1 opening labeled cache on the K8s PVC."
status = "running"

[data]
source = "clickhouse"
start_date = "2013-01-01"
end_date = "2024-12-31"

[cache]
dir = "/mnt/output/opening_strength_fit/cache"
delays = [1]
file_template = "opening_2013_2024_delay{delay}_labeled.parquet"
manifest_path = "/mnt/output/opening_strength_fit/cache/opening_2013_2024_delay1_cache_manifest.json"
compression = "snappy"
overwrite = false

[clickhouse]
host = "ch.db.prod.highfortfunds.com"
port = 8123
table = "stock.tick"
start_offset_us = 33300000000
end_offset_us = 35100000000

[universe]
enabled = true
symbol_regex = "^(?:(?:00|30)\\d{4}\\.SZ|(?:60|68)\\d{4}\\.SH)$"
symbols_file = ""

[sample]
start_time = "09:30:00"
end_time = "09:40:00"
mode = "decision_points"
decision_times = [
  "09:30:00",
  "09:31:00",
  "09:32:00",
  "09:33:00",
  "09:34:00",
  "09:35:00",
  "09:36:00",
  "09:37:00",
  "09:38:00",
  "09:39:00",
  "09:40:00",
]
decision_max_lag_seconds = 5

[labels]
buy_price_col = "ask_price_1"
volume_col = "volume"
turnover_col = "turnover"
hold_seconds = 60
sell_window_seconds = 60
volume_unit_multiplier = 1.0
fee_bps = 0.0
entry_tick_delay = 1

[features]
include_preopen = true

[filters]
tradable_statuses = ["T0", "20", "TRADE"]

[output]
local_dir = "output/local/materialize_opening_2013_2024_delay1_cache"
k8s_dir = "/mnt/output/opening_strength_fit/cache"

[k8s]
namespace = "bizewu"
job_name = "opening-strength-materialize-delay1-2013-2024"
image_pull_secret = "highfort"
pvc = "bizewu-private-data"
mount_path = "/mnt/output"
clickhouse_secret = "opening-strength-clickhouse"

[k8s.resources]
cpu_request = "8"
cpu_limit = "16"
memory_request = "96Gi"
memory_limit = "160Gi"
