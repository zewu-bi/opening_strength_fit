[clickhouse]
host = "ch.db.prod.highfortfunds.com"
port = 8123
table = "stock.tick"

[output]
local_dir = "output/artifacts/cache_builds/opening_0931_0940_next_close_clock6_rebuild"
k8s_dir = "/mnt/output/opening_strength_fit/cache_builds/opening_0931_0940_next_close_clock6_rebuild"

[k8s]
namespace = "bizewu"
job_name = "os-nextclose-corrected-w0931-0940"
image_pull_secret = "highfort"
pvc = "bizewu-private-data"
mount_path = "/mnt/output"
clickhouse_secret = "opening-strength-clickhouse"
helper_image = "registry.corp.highfortfunds.com/bizewu/opening-strength-fit:20260730-short3m-label-v1"
