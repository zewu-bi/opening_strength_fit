apiVersion: batch/v1
kind: Job
metadata:
  name: opening-strength-score-alpha-conditioned-top100-sweep-v3-p90
  namespace: bizewu
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: highfort
      volumes:
        - name: opening-strength-output
          persistentVolumeClaim:
            claimName: bizewu-private-data
        - name: top100-sweep-v3-configs
          configMap:
            name: opening-strength-top100-sweep-v3-configs
      nodeSelector:
        kubernetes.io/hostname: "node8"
      containers:
        - name: opening-strength-fit
          image: registry.corp.highfortfunds.com/bizewu/opening-strength-fit:20260529-alpha-conditioned-risk-v2
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: opening-strength-clickhouse
          workingDir: /app/opening_strength_fit
          command:
            - osf-run-score-risk-sweep
            - --config
            - /mnt/config/score_alpha_conditioned_top100_sweep_v3_p90.toml
            - --output-dir
            - /mnt/output/opening_strength_fit/score_alpha_conditioned_top100_sweep_v3_p90
          volumeMounts:
            - name: opening-strength-output
              mountPath: /mnt/output
            - name: top100-sweep-v3-configs
              mountPath: /mnt/config
              readOnly: true
          resources:
            requests:
              cpu: "4"
              memory: 64Gi

            limits:
              cpu: "8"
              memory: 128Gi
