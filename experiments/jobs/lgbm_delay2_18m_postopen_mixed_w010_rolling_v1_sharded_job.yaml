apiVersion: batch/v1
kind: Job
metadata:
  name: opening-strength-lgbm-delay2-18m-postopen-mi-sharded-358fb69d
  namespace: bizewu
spec:
  backoffLimit: 0
  completionMode: Indexed
  completions: 6
  parallelism: 1
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: highfort
      volumes:
        - name: opening-strength-output
          persistentVolumeClaim:
            claimName: bizewu-private-data
      nodeSelector:
        kubernetes.io/hostname: "node8"
      containers:
        - name: opening-strength-fit
          image: registry.corp.highfortfunds.com/bizewu/opening-strength-fit:opening-strength-fit-20260602-mixed-label-v1
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: opening-strength-clickhouse
          workingDir: /app/opening_strength_fit
          env:
            - name: JOB_COMPLETION_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: "metadata.annotations['batch.kubernetes.io/job-completion-index']"
          command:
            - /bin/bash
            - -lc
            - |
              set -euo pipefail

              WAIT_PATH_TIMEOUT_SECONDS=43200
              WAIT_PATH_INTERVAL_SECONDS=120
              WAIT_PATH_STARTED=${SECONDS}
              WAIT_PATHS=("/mnt/output/opening_strength_fit/cache/opening_18m_202008_202201_delay2_mixed_w010_labeled.parquet")
              for WAIT_PATH in "${WAIT_PATHS[@]}"; do
                until [ -f "${WAIT_PATH}" ]; do
                  if [ $((SECONDS - WAIT_PATH_STARTED)) -ge "${WAIT_PATH_TIMEOUT_SECONDS}" ]; then
                    echo "timed out waiting for dependency file: ${WAIT_PATH}" >&2
                    exit 1
                  fi
                  echo "waiting for dependency file: ${WAIT_PATH}"
                  sleep "${WAIT_PATH_INTERVAL_SECONDS}"
                done
                echo "dependency file is ready: ${WAIT_PATH}"
              done
              ROOT=/mnt/output/opening_strength_fit/lgbm_delay2_18m_postopen_mixed_w010_rolling_v1
              mkdir -p "${ROOT}"
              MONTHS=(2021-08 2021-09 2021-10 2021-11 2021-12 2022-01)
              INDEX="${JOB_COMPLETION_INDEX:-}"
              if [ -z "${INDEX}" ]; then
                echo "missing JOB_COMPLETION_INDEX for indexed shard job" >&2
                exit 1
              fi
              if [ "${INDEX}" -lt 0 ] || [ "${INDEX}" -ge "${#MONTHS[@]}" ]; then
                echo "JOB_COMPLETION_INDEX out of range: ${INDEX}" >&2
                exit 1
              fi

              MONTH="${MONTHS[${INDEX}]}"
              OUT="${ROOT}/month_${MONTH}"
              if [ -f "${OUT}/metrics_by_year.csv" ]; then
                echo "month ${MONTH}: metrics already exist, skipping ${OUT}"
                exit 0
              fi

              echo
              echo "running lgbm_delay2_18m_postopen_mixed_w010_rolling_v1 shard month=${MONTH} index=${INDEX}"
              echo "output_dir=${OUT}"

              python scripts/run_experiment.py \
                --config experiments/runs/lgbm_delay2_18m_postopen_mixed_w010_rolling_v1.toml \
                --rolling-monthly \
                --train-months 12 \
                --test-start-month "${MONTH}" \
                --test-end-month "${MONTH}" \
                --output-dir "${OUT}"
          volumeMounts:
            - name: opening-strength-output
              mountPath: /mnt/output
          resources:
            requests:
              cpu: "8"
              memory: 192Gi

            limits:
              cpu: "16"
              memory: 256Gi

