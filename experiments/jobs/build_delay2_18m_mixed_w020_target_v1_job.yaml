apiVersion: batch/v1
kind: Job
metadata:
  name: opening-strength-build-delay2-18m-mixed-w020-target-v1
  namespace: bizewu
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: highfort
      volumes:
        - name: opening-strength-output
          persistentVolumeClaim:
            claimName: bizewu-private-data
        - name: opening-strength-config
          configMap:
            name: opening-strength-mixed-w020-w030-configs
      nodeSelector:
        kubernetes.io/hostname: "node8"
      containers:
        - name: opening-strength-fit
          image: registry.corp.highfortfunds.com/bizewu/opening-strength-fit:20260602-mixed-label-v1
          imagePullPolicy: Always
          workingDir: /app/opening_strength_fit
          command:
            - osf-build-target-label-cache
            - --config
            - /mnt/config/build_delay2_18m_mixed_w020_target_v1.toml
            - --output-dir
            - /mnt/output/opening_strength_fit/cache_builds/build_delay2_18m_mixed_w020_target_v1
          volumeMounts:
            - name: opening-strength-output
              mountPath: /mnt/output
            - name: opening-strength-config
              mountPath: /mnt/config
          resources:
            requests:
              cpu: "8"
              memory: 256Gi

            limits:
              cpu: "16"
              memory: 384Gi
