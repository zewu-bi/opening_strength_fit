apiVersion: batch/v1
kind: Job
metadata:
  name: os-expaud-2225-ggv2-size-ind
  namespace: bizewu
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: highfort
      volumes:
        - name: opening-strength-output
          persistentVolumeClaim:
            claimName: bizewu-private-data
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: NotIn
                  values:
                    - node7
                    - node8
      containers:
        - name: opening-strength-fit
          image: registry.corp.highfortfunds.com/bizewu/opening-strength-fit:20260703-exposure-dgmse-v2
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: xy-fit-ceph-credentials
          workingDir: /app/opening_strength_fit
          command:
            - /bin/bash
            - -lc
            - |
              set -euo pipefail
              WAIT_PATH_TIMEOUT_SECONDS=21600
              WAIT_PATH_INTERVAL_SECONDS=120
              WAIT_PATH_STARTED=${SECONDS}
              WAIT_PATHS=("/mnt/output/opening_strength_fit/runs/models/nn/nn_delay2_36m_2022_2025_fullxs_hist_path_pruned_highdup_grouped_gated_v2_gelu_mse_v1/month_2025-07/_SUCCESS" "/mnt/output/opening_strength_fit/runs/analyses/exposure-input/exposure_input_nn_delay2_36m_2022_2025_fullxs_hist_path_pruned_highdup_grouped_gated_v2_size_industry_v1/exposure_input_trace.json")
              for WAIT_PATH in "${WAIT_PATHS[@]}"; do
                until [ -f "${WAIT_PATH}" ]; do
                  if [ $((SECONDS - WAIT_PATH_STARTED)) -ge "${WAIT_PATH_TIMEOUT_SECONDS}" ]; then
                    echo "timed out waiting for dependency file: ${WAIT_PATH}" >&2
                    exit 1
                  fi
                  echo "waiting for dependency file: ${WAIT_PATH}"
                  sleep "${WAIT_PATH_INTERVAL_SECONDS}"
                done
                echo "dependency file is ready: ${WAIT_PATH}"
              done
              exec osf-audit-exposure \
                --predictions /mnt/output/opening_strength_fit/runs/models/nn/nn_delay2_36m_2022_2025_fullxs_hist_path_pruned_highdup_grouped_gated_v2_gelu_mse_v1 \
                --exposure-input /mnt/output/opening_strength_fit/runs/analyses/exposure-input/exposure_input_nn_delay2_36m_2022_2025_fullxs_hist_path_pruned_highdup_grouped_gated_v2_size_industry_v1/exposure_input.parquet \
                --output-dir /mnt/output/opening_strength_fit/runs/analyses/exposure-audit/exposure_audit_nn_delay2_36m_2022_2025_fullxs_hist_path_pruned_highdup_grouped_gated_v2_size_industry_v1 \
                --run-id exposure_audit_nn_delay2_36m_2022_2025_fullxs_hist_path_pruned_highdup_grouped_gated_v2_size_industry_v1 \
                --variant grouped_gated_v2_size_industry \
                --pool L \
                --pool-date-lag-sessions 0 \
                --score-col prediction \
                --top-n 100 \
                --industry-col industry_sw1 \
                --skip-score-exposure-corr \
                --exposure-col market_cap \
                --exposure-col float_market_cap \
                --exposure-col log_market_cap \
                --exposure-col log_float_market_cap
          volumeMounts:
            - name: opening-strength-output
              mountPath: /mnt/output
          resources:
            requests:
              cpu: "8"
              memory: 128Gi

            limits:
              cpu: "16"
              memory: 256Gi
