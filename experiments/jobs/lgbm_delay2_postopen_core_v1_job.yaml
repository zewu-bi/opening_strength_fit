apiVersion: batch/v1
kind: Job
metadata:
  name: opening-strength-lgbm-delay2-postopen-core-v1
  namespace: bizewu
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: highfort
      volumes:
        - name: opening-strength-output
          persistentVolumeClaim:
            claimName: bizewu-private-data
      nodeSelector:
        kubernetes.io/hostname: "node8"
      containers:
        - name: opening-strength-fit
          image: registry.corp.highfortfunds.com/bizewu/opening-strength-fit:opening-strength-fit-20260528-feature-core-v1
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: opening-strength-clickhouse
          workingDir: /app/opening_strength_fit
          command:
            - python
            - scripts/run_experiment.py
            - --config
            - experiments/runs/lgbm_delay2_postopen_core_v1.toml
            - --output-dir
            - /mnt/output/opening_strength_fit/lgbm_delay2_postopen_core_v1
          volumeMounts:
            - name: opening-strength-output
              mountPath: /mnt/output
          resources:
            requests:
              cpu: "8"
              memory: 192Gi

            limits:
              cpu: "16"
              memory: 256Gi

