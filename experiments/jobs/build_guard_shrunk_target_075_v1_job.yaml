apiVersion: batch/v1
kind: Job
metadata:
  name: opening-strength-build-guard-shrunk-target-075-v1
  namespace: bizewu
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: highfort
      volumes:
        - name: opening-strength-output
          persistentVolumeClaim:
            claimName: bizewu-private-data
      nodeSelector:
        kubernetes.io/hostname: "node8"
      containers:
        - name: opening-strength-fit
          image: registry.corp.highfortfunds.com/bizewu/opening-strength-fit:opening-strength-fit-20260528-guard-shrunk-target-v1
          imagePullPolicy: Always
          workingDir: /app/opening_strength_fit
          command:
            - osf-build-target-label-cache
            - --config
            - experiments/runs/build_guard_shrunk_target_075_v1.toml
            - --output-dir
            - /mnt/output/opening_strength_fit/cache_builds/build_guard_shrunk_target_075_v1
          volumeMounts:
            - name: opening-strength-output
              mountPath: /mnt/output
          resources:
            requests:
              cpu: "4"
              memory: 96Gi

            limits:
              cpu: "8"
              memory: 160Gi

