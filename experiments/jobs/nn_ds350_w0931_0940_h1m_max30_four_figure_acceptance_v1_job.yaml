apiVersion: batch/v1
kind: Job
metadata:
  name: os-ds350-max30-w0931-h1m-fourfig-v1
  namespace: bizewu
spec:
  backoffLimit: 0
  completionMode: Indexed
  completions: 2
  parallelism: 2
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: highfort
      tolerations:
        - key: has_gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      volumes:
        - name: output
          persistentVolumeClaim:
            claimName: bizewu-private-data
        - name: analysis-script
          configMap:
            name: os-top1000-rank-bucket-script-v4
      containers:
        - name: opening-strength-fit
          image: registry.corp.highfortfunds.com/bizewu/opening-strength-fit@sha256:8eb66ef731709af980fa7e047ccb59748c0ed8f4ed36aa3460ee9b1f4a9fe0b6
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: xy-fit-ceph-credentials
          workingDir: /app/opening_strength_fit
          command:
            - /bin/bash
            - -lc
          args:
            - |
              set -euo pipefail
              ROOT=/mnt/output/opening_strength_fit/nn/nn_ds350_label15_36m_grouped_gated_v2_mse_max30_v1
              CASE=w0931_0940_h1m
              OUT="${ROOT}/${CASE}/analysis/four_figure_acceptance_v1"
              COMMON=(
                python /opt/analysis/run_top1000_rank_bucket_diagnostics.py
                --prediction-root "${ROOT}"
                --prediction-next-label-col label_next_close
                --pool-path lml.bzw@ssd/data/pool_L.parquet
                --variant ds350_w0931_0940_h1m_max30
                --run-id "${CASE}"
              )
              mkdir -p "${OUT}"
              if [[ "${JOB_COMPLETION_INDEX}" == "0" ]]; then
                "${COMMON[@]}" --output-dir "${OUT}/top1000_rank" --rank-bucket-only
                touch "${OUT}/_RANK_SUCCESS"
              else
                "${COMMON[@]}" \
                  --output-dir "${OUT}/top1000_distribution" \
                  --top1000-bucket-return-histogram-only \
                  --histogram-bin-width-bps 100
                touch "${OUT}/_DISTRIBUTION_SUCCESS"
              fi
          volumeMounts:
            - name: output
              mountPath: /mnt/output
            - name: analysis-script
              mountPath: /opt/analysis
              readOnly: true
          resources:
            requests:
              cpu: "8"
              memory: 32Gi
            limits:
              cpu: "16"
              memory: 64Gi
