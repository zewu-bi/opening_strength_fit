apiVersion: batch/v1
kind: Job
metadata:
  name: os-lgbm-36m-2018-2024-w030-halfyear
  namespace: bizewu
spec:
  backoffLimit: 0
  completionMode: Indexed
  completions: 14
  parallelism: 7
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: highfort
      volumes:
        - name: opening-strength-output
          persistentVolumeClaim:
            claimName: bizewu-private-data
        - name: opening-strength-halfyear-config
          configMap:
            name: opening-strength-halfyear-config-13y

      containers:
        - name: opening-strength-fit
          image: registry.corp.highfortfunds.com/bizewu/opening-strength-fit:20260605-halfyear-v1
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: opening-strength-clickhouse
          workingDir: /app/opening_strength_fit
          env:
            - name: JOB_COMPLETION_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: "metadata.annotations['batch.kubernetes.io/job-completion-index']"
          command:
            - /bin/bash
            - -lc
            - |
              set -euo pipefail

              WAIT_PATH_TIMEOUT_SECONDS=43200
              WAIT_PATH_INTERVAL_SECONDS=120
              WAIT_PATH_STARTED=${SECONDS}
              WAIT_PATHS=("/mnt/output/opening_strength_fit/cache/opening_13y_201301_202512_delay2_mixed_w030_labeled_v1/opening_2015_delay2_mixed_w030_labeled_v1.parquet" "/mnt/output/opening_strength_fit/cache/opening_13y_201301_202512_delay2_mixed_w030_labeled_v1/opening_2016_delay2_mixed_w030_labeled_v1.parquet" "/mnt/output/opening_strength_fit/cache/opening_13y_201301_202512_delay2_mixed_w030_labeled_v1/opening_2017_delay2_mixed_w030_labeled_v1.parquet" "/mnt/output/opening_strength_fit/cache/opening_13y_201301_202512_delay2_mixed_w030_labeled_v1/opening_2018_delay2_mixed_w030_labeled_v1.parquet" "/mnt/output/opening_strength_fit/cache/opening_13y_201301_202512_delay2_mixed_w030_labeled_v1/opening_2019_delay2_mixed_w030_labeled_v1.parquet" "/mnt/output/opening_strength_fit/cache/opening_13y_201301_202512_delay2_mixed_w030_labeled_v1/opening_2020_delay2_mixed_w030_labeled_v1.parquet" "/mnt/output/opening_strength_fit/cache/opening_13y_201301_202512_delay2_mixed_w030_labeled_v1/opening_2021_delay2_mixed_w030_labeled_v1.parquet" "/mnt/output/opening_strength_fit/cache/opening_13y_201301_202512_delay2_mixed_w030_labeled_v1/opening_2022_delay2_mixed_w030_labeled_v1.parquet" "/mnt/output/opening_strength_fit/cache/opening_13y_201301_202512_delay2_mixed_w030_labeled_v1/opening_2023_delay2_mixed_w030_labeled_v1.parquet" "/mnt/output/opening_strength_fit/cache/opening_13y_201301_202512_delay2_mixed_w030_labeled_v1/opening_2024_delay2_mixed_w030_labeled_v1.parquet")
              for WAIT_PATH in "${WAIT_PATHS[@]}"; do
                until [ -f "${WAIT_PATH}" ]; do
                  if [ $((SECONDS - WAIT_PATH_STARTED)) -ge "${WAIT_PATH_TIMEOUT_SECONDS}" ]; then
                    echo "timed out waiting for dependency file: ${WAIT_PATH}" >&2
                    exit 1
                  fi
                  echo "waiting for dependency file: ${WAIT_PATH}"
                  sleep "${WAIT_PATH_INTERVAL_SECONDS}"
                done
                echo "dependency file is ready: ${WAIT_PATH}"
              done
              ROOT=/mnt/output/opening_strength_fit/lgbm_delay2_36m_visible_mixed_w030_soft_core_reg_light_2018_2024_halfyear_rolling_v1
              mkdir -p "${ROOT}"
              TEST_STARTS=(2018-01 2018-07 2019-01 2019-07 2020-01 2020-07 2021-01 2021-07 2022-01 2022-07 2023-01 2023-07 2024-01 2024-07)
              TEST_ENDS=(2018-06 2018-12 2019-06 2019-12 2020-06 2020-12 2021-06 2021-12 2022-06 2022-12 2023-06 2023-12 2024-06 2024-12)
              INDEX="${JOB_COMPLETION_INDEX:-}"
              if [ -z "${INDEX}" ]; then
                echo "missing JOB_COMPLETION_INDEX for indexed shard job" >&2
                exit 1
              fi
              if [ "${INDEX}" -lt 0 ] || [ "${INDEX}" -ge "${#TEST_STARTS[@]}" ]; then
                echo "JOB_COMPLETION_INDEX out of range: ${INDEX}" >&2
                exit 1
              fi

              TEST_START="${TEST_STARTS[${INDEX}]}"
              TEST_END="${TEST_ENDS[${INDEX}]}"
              OUT="${ROOT}/month_${TEST_START}"
              if [ -f "${OUT}/metrics_by_year.csv" ]; then
                echo "test window ${TEST_START}..${TEST_END}: metrics already exist, skipping ${OUT}"
                exit 0
              fi

              echo
              echo "running lgbm_delay2_36m_visible_mixed_w030_soft_core_reg_light_2018_2024_halfyear_rolling_v1 shard test=${TEST_START}..${TEST_END} index=${INDEX}"
              echo "output_dir=${OUT}"

              osf-train \
                --config /mnt/config/halfyear.toml \
                --rolling-monthly \
                --train-months 36 \
                --test-months 6 \
                --test-stride-months 6 \
                --test-start-month "${TEST_START}" \
                --test-end-month "${TEST_END}" \
                --output-dir "${OUT}"
          volumeMounts:
            - name: opening-strength-output
              mountPath: /mnt/output
            - name: opening-strength-halfyear-config
              mountPath: /mnt/config
              readOnly: true
          resources:
            requests:
              cpu: "8"
              memory: 384Gi

            limits:
              cpu: "16"
              memory: 512Gi
