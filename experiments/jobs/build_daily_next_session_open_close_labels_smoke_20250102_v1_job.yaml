apiVersion: batch/v1
kind: Job
metadata:
  name: os-daily-oc-label-smoke-v2
  namespace: bizewu
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: highfort
      volumes:
        - name: opening-strength-output
          persistentVolumeClaim:
            claimName: bizewu-private-data
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: NotIn
                  values:
                    - node7
                    - node8
      containers:
        - name: opening-strength-fit
          image: registry.corp.highfortfunds.com/bizewu/opening-strength-fit:20260723-daily-oc-label-v2
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: opening-strength-clickhouse
          workingDir: /app/opening_strength_fit
          command:
            - osf-build-daily-return-labels
            - --config
            - experiments/runs/build_daily_next_session_open_close_labels_smoke_20250102_v1.toml
            - --output-dir
            - /mnt/output/opening_strength_fit/cache_builds/build_daily_next_session_open_close_labels_smoke_20250102_v1
          volumeMounts:
            - name: opening-strength-output
              mountPath: /mnt/output
          resources:
            requests:
              cpu: "2"
              memory: 4Gi

            limits:
              cpu: "4"
              memory: 8Gi
