apiVersion: batch/v1
kind: Job
metadata:
  name: opening-strength-gbm-opening-1m-3d
  namespace: bizewu
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: highfort
      volumes:
        - name: opening-strength-output
          persistentVolumeClaim:
            claimName: bizewu-private-data
      containers:
        - name: opening-strength-fit
          image: registry.corp.highfortfunds.com/bizewu/opening-strength-fit:20260520-065011-1m3d
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: opening-strength-clickhouse
          workingDir: /app/opening_strength_fit
          command:
            - osf-train
            - --config
            - experiments/runs/gbm_opening_1m_3d.toml
            - --output-dir
            - /mnt/output/opening_strength_fit/runs/models/gbm/gbm_opening_1m_3d
          volumeMounts:
            - name: opening-strength-output
              mountPath: /mnt/output
          resources:
            requests:
              cpu: "8"
              memory: 64Gi
            limits:
              cpu: "16"
              memory: 96Gi
