apiVersion: batch/v1
kind: Job
metadata:
  name: opening-strength-materialize-delay1-2013-2024
  namespace: bizewu
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: highfort
      volumes:
        - name: opening-strength-output
          persistentVolumeClaim:
            claimName: bizewu-private-data
      containers:
        - name: materialize-labeled-cache
          image: registry.corp.highfortfunds.com/bizewu/opening-strength-fit:opening-strength-fit-20260522-full-delay1-cache-v1
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: opening-strength-clickhouse
          workingDir: /app/opening_strength_fit
          command:
            - python
            - scripts/materialize_labeled_caches.py
            - --config
            - experiments/runs/materialize_opening_2013_2024_delay1_cache.toml
          volumeMounts:
            - name: opening-strength-output
              mountPath: /mnt/output
          resources:
            requests:
              cpu: "8"
              memory: 96Gi
            limits:
              cpu: "16"
              memory: 160Gi
