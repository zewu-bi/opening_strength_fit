apiVersion: batch/v1
kind: Job
metadata:
  name: os-nextclose-clock6-w1001-1010-v1
  namespace: bizewu
  labels:
    app: os-nextclose-clock6-w1001-1010-v1
spec:
  backoffLimit: 0
  completionMode: Indexed
  completions: 7
  parallelism: 7
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: os-nextclose-clock6-w1001-1010-v1
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: highfort
      volumes:
        - name: opening-strength-output
          persistentVolumeClaim:
            claimName: bizewu-private-data
        - name: window-config
          configMap:
            name: os-nextclose-clock6-w1001-1010-config-v1
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - node15
      containers:
        - name: opening-strength-fit
          image: registry.corp.highfortfunds.com/bizewu/opening-strength-fit:20260717-clock-state-delay6-v4
          imagePullPolicy: Always
          workingDir: /app/opening_strength_fit
          envFrom:
            - secretRef:
                name: opening-strength-clickhouse
          env:
            - name: JOB_COMPLETION_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: "metadata.annotations['batch.kubernetes.io/job-completion-index']"
          command:
            - /bin/bash
            - -lc
            - |
              set -euo pipefail
              YEARS=(2019 2020 2021 2022 2023 2024 2025)
              INDEX="${JOB_COMPLETION_INDEX:-}"
              if [ -z "${INDEX}" ] || [ "${INDEX}" -lt 0 ] || [ "${INDEX}" -ge "${#YEARS[@]}" ]; then
                echo "invalid JOB_COMPLETION_INDEX=${INDEX}" >&2
                exit 1
              fi
              YEAR="${YEARS[$INDEX]}"
              INPUT_ROOT="/mnt/output/opening_strength_fit/cache/opening_2019_2025_label_v5_clock6_1001_1010_from_start_auction_reuse_mcap_lag1"
              OUTPUT_ROOT="/mnt/output/opening_strength_fit/cache/opening_2019_2025_next_close_labels_clock6_1001_1010_v1"
              INPUT="${INPUT_ROOT}/opening_${YEAR}_label_v5_clock6_1001_1010_from_start_auction_reuse_mcap_lag1.parquet"
              OUTPUT="${OUTPUT_ROOT}/opening_${YEAR}_next_close_labels_clock6_1001_1010_v1.parquet"
              TRACE_DIR="/mnt/output/opening_strength_fit/cache_builds/build_delay6_clock_state_1001_1010_next_close_labels_v1/year=${YEAR}"
              until [ -f "${INPUT}" ]; do
                echo "waiting for dependency file: ${INPUT}"
                sleep 120
              done
              if [ -f "${OUTPUT}" ]; then
                echo "next-close cache already exists, skipping: ${OUTPUT}"
                exit 0
              fi
              exec osf-build-next-close-labels \
                --config /mnt/window-config/build_delay6_clock_state_1001_1010_next_close_labels_v1.toml \
                --input "${INPUT}" \
                --output "${OUTPUT}" \
                --output-dir "${TRACE_DIR}"
          volumeMounts:
            - name: opening-strength-output
              mountPath: /mnt/output
            - name: window-config
              mountPath: /mnt/window-config
              readOnly: true
          resources:
            requests:
              cpu: "4"
              memory: 64Gi
            limits:
              cpu: "8"
              memory: 128Gi
