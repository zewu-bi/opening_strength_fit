apiVersion: batch/v1
kind: Job
metadata:
  name: opening-strength-lgbm-delay2-postopen-v2
  namespace: bizewu
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: highfort
      volumes:
        - name: opening-strength-output
          persistentVolumeClaim:
            claimName: bizewu-private-data

      containers:
        - name: opening-strength-fit
          image: registry.corp.highfortfunds.com/bizewu/opening-strength-fit:20260527-postopen-v2-oomfix
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: opening-strength-clickhouse
          workingDir: /app/opening_strength_fit
          command:
            - osf-train
            - --config
            - experiments/runs/lgbm_delay2_postopen_v2.toml
            - --output-dir
            - /mnt/output/opening_strength_fit/runs/models/lightgbm/lgbm_delay2_postopen_v2
          volumeMounts:
            - name: opening-strength-output
              mountPath: /mnt/output
          resources:
            requests:
              cpu: "8"
              memory: 192Gi

            limits:
              cpu: "16"
              memory: 256Gi

