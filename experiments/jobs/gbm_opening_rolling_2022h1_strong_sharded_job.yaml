apiVersion: batch/v1
kind: Job
metadata:
  name: opening-strength-gbm-opening-rolling-2022h1-strong-sharded
  namespace: bizewu
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: highfort
      volumes:
        - name: opening-strength-output
          persistentVolumeClaim:
            claimName: bizewu-private-data
      containers:
        - name: opening-strength-fit
          image: registry.corp.highfortfunds.com/bizewu/opening-strength-fit:opening-strength-fit-20260520-overnight-v1
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: opening-strength-clickhouse
          workingDir: /app/opening_strength_fit
          command:
            - /bin/bash
            - -lc
            - |
              set -euo pipefail
              ROOT=/mnt/output/opening_strength_fit/gbm_opening_rolling_2022h1_strong
              mkdir -p "${ROOT}"

              for MONTH in 2022-02 2022-03 2022-04 2022-05 2022-06; do
                OUT="${ROOT}/month_${MONTH}"
                if [ -f "${OUT}/metrics_by_year.csv" ]; then
                  echo "month ${MONTH}: metrics already exist, skipping ${OUT}"
                  continue
                fi

                echo
                echo "running gbm_opening_rolling_2022h1_strong shard month=${MONTH}"
                echo "output_dir=${OUT}"

                python scripts/run_experiment.py \
                  --config experiments/runs/gbm_opening_rolling_2022h1_strong.toml \
                  --rolling-monthly \
                  --train-months 12 \
                  --test-start-month "${MONTH}" \
                  --test-end-month "${MONTH}" \
                  --output-dir "${OUT}"
              done
          volumeMounts:
            - name: opening-strength-output
              mountPath: /mnt/output
          resources:
            requests:
              cpu: "8"
              memory: 32Gi
            limits:
              cpu: "16"
              memory: 64Gi
