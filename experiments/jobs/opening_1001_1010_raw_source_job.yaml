apiVersion: batch/v1
kind: Job
metadata:
  name: os-raw-source-w1001-1010
  namespace: bizewu
  labels:
    app: os-raw-source-w1001-1010
spec:
  activeDeadlineSeconds: 259200
  backoffLimit: 2
  completionMode: Indexed
  completions: 7
  parallelism: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: os-raw-source-w1001-1010
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: highfort
      volumes:
        - name: opening-strength-output
          persistentVolumeClaim:
            claimName: bizewu-private-data
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - node7
                      - node8
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: os-raw-source-w1001-1010
      containers:
        - name: opening-strength-fit
          image: registry.corp.highfortfunds.com/bizewu/opening-strength-fit:20260731-raw-source-2d903614
          imagePullPolicy: Always
          workingDir: /app/opening_strength_fit
          envFrom:
            - secretRef:
                name: opening-strength-clickhouse
          env:
            - name: JOB_COMPLETION_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: "metadata.annotations['batch.kubernetes.io/job-completion-index']"
          command:
            - /bin/bash
            - -lc
            - |
              set -euo pipefail
              YEARS=(2019 2020 2021 2022 2023 2024 2025)
              INDEX="${JOB_COMPLETION_INDEX:-}"
              if [ -z "${INDEX}" ] || [ "${INDEX}" -lt 0 ] || [ "${INDEX}" -ge "${#YEARS[@]}" ]; then
                echo "invalid JOB_COMPLETION_INDEX=${INDEX}" >&2
                exit 1
              fi
              YEAR="${YEARS[$INDEX]}"
              exec osf-build-raw-source-cache \
                --config experiments/runs/opening_1001_1010_raw_source.toml \
                --year "${YEAR}"
          volumeMounts:
            - name: opening-strength-output
              mountPath: /mnt/output
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
            limits:
              cpu: "8"
              memory: 24Gi
