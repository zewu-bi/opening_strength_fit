apiVersion: v1
kind: List
items:
  - &case-job
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: os-nn-ds350-w0931-h1m-v1
      namespace: bizewu
      labels: {app: os-nn-ds350-w0931-h1m-v1, osf-matrix: ds350-label12-v1, osf-window: w0931-0940, osf-case: w0931_0940_h1m}
    spec: &case-spec
      activeDeadlineSeconds: 1209600
      backoffLimit: 8
      completionMode: Indexed
      completions: 8
      parallelism: 8
      suspend: false
      ttlSecondsAfterFinished: 86400
      template: &case-template
        metadata:
          labels: {app: os-nn-ds350-w0931-h1m-v1, osf-matrix: ds350-label12-v1, osf-window: w0931-0940, osf-case: w0931_0940_h1m}
        spec:
          restartPolicy: Never
          imagePullSecrets: [{name: highfort}]
          volumes:
            - name: output
              persistentVolumeClaim: {claimName: bizewu-private-data}
          nodeSelector: {has_gpu: "true"}
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: NotIn
                        values: [node6, node7, node8, node12, node17, node19, node20, node22, node24, node25, node26, node27, node28]
          tolerations:
            - {key: has_gpu, operator: Equal, value: "true", effect: NoSchedule}
          containers:
            - name: trainer
              image: registry.corp.highfortfunds.com/bizewu/opening-strength-fit@sha256:3313ed404c03ad15f228f01ab44982f46b84beac8838749d739302c551be1fc7
              imagePullPolicy: Always
              workingDir: /app/opening_strength_fit
              env:
                - name: JOB_COMPLETION_INDEX
                  valueFrom:
                    fieldRef: {fieldPath: "metadata.annotations['batch.kubernetes.io/job-completion-index']"}
                - name: CASE
                  valueFrom:
                    fieldRef: {fieldPath: "metadata.labels['osf-case']"}
              command: [/bin/bash, -lc]
              args:
                - |
                  set -euo pipefail
                  FEATURE_ROOT="/mnt/output/opening_strength_fit/datasets/opening_0931_0940_features_350"
                  case "${CASE:?missing CASE}" in
                    w0931_0940_h1m) LABEL_DATASET=opening_0931_0940_labels_h1m_v2 ;;
                    w0931_0940_h3m) LABEL_DATASET=opening_0931_0940_labels_h3m_v2 ;;
                    w0931_0940_h10m) LABEL_DATASET=opening_0931_0940_labels_h10m_v1 ;;
                    w0931_0940_h1h) LABEL_DATASET=opening_0931_0940_labels_h1h_v1 ;;
                    w0931_0940_hclose) LABEL_DATASET=opening_0931_0940_labels_hclose_v1 ;;
                    *) echo "unsupported CASE=${CASE}" >&2; exit 2 ;;
                  esac
                  LABEL_ROOT="/mnt/output/opening_strength_fit/datasets/${LABEL_DATASET}"
                  TEST_STARTS=(2022-01 2022-07 2023-01 2023-07 2024-01 2024-07 2025-01 2025-07)
                  TEST_ENDS=(2022-06 2022-12 2023-06 2023-12 2024-06 2024-12 2025-06 2025-12)
                  INDEX="${JOB_COMPLETION_INDEX:?missing JOB_COMPLETION_INDEX}"
                  TEST_START="${TEST_STARTS[${INDEX}]}"
                  TEST_END="${TEST_ENDS[${INDEX}]}"
                  RUN_ID="nn_ds350_${CASE}_36m_grouped_gated_v2_mse_v1"
                  OUT="/mnt/output/opening_strength_fit/nn/nn_ds350_label12_36m_grouped_gated_v2_mse_v1/${CASE}/month_${TEST_START}"

                  for YEAR in 2019 2020 2021 2022 2023 2024 2025; do
                    test -f "${FEATURE_ROOT}/year=${YEAR}/_SUCCESS"
                    test -f "${LABEL_ROOT}/year=${YEAR}/_SUCCESS"
                  done
                  if [ -f "${OUT}/_SUCCESS" ] && [ -f "${OUT}/metrics_by_year.csv" ] && [ -f "${OUT}/predictions.parquet" ]; then
                    echo "output already complete, skipping ${OUT}"
                    exit 0
                  fi

                  exec osf-train \
                    --config experiments/runs/nn_ds350_label12_36m_grouped_gated_v2_mse_v1.toml \
                    --feature-input "${FEATURE_ROOT}" \
                    --label-input "${LABEL_ROOT}" \
                    --run-id "${RUN_ID}" \
                    --rolling-monthly \
                    --train-months 36 \
                    --test-months 6 \
                    --test-stride-months 6 \
                    --test-start-month "${TEST_START}" \
                    --test-end-month "${TEST_END}" \
                    --output-dir "${OUT}"
              volumeMounts: [{name: output, mountPath: /mnt/output}]
              resources:
                requests: {cpu: "16", memory: 256Gi, nvidia.com/gpu: "1"}
                limits: {cpu: "32", memory: 384Gi, nvidia.com/gpu: "1"}

  - <<: *case-job
    metadata:
      name: os-nn-ds350-w0931-h3m-v1
      namespace: bizewu
      labels: {app: os-nn-ds350-w0931-h3m-v1, osf-matrix: ds350-label12-v1, osf-window: w0931-0940, osf-case: w0931_0940_h3m}
    spec:
