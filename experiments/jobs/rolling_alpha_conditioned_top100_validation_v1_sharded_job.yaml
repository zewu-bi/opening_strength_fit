apiVersion: batch/v1
kind: Job
metadata:
  name: opening-strength-rolling-alpha-conditioned-t-sharded-36699656
  namespace: bizewu
spec:
  backoffLimit: 0
  completionMode: Indexed
  completions: 6
  parallelism: 1
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: highfort
      volumes:
        - name: opening-strength-output
          persistentVolumeClaim:
            claimName: bizewu-private-data
      nodeSelector:
        kubernetes.io/hostname: "node8"
      containers:
        - name: opening-strength-fit
          image: registry.corp.highfortfunds.com/bizewu/opening-strength-fit:opening-strength-fit-20260529-next-close-finite-v1
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: opening-strength-clickhouse
          workingDir: /app/opening_strength_fit
          env:
            - name: JOB_COMPLETION_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: "metadata.annotations['batch.kubernetes.io/job-completion-index']"
          command:
            - /bin/bash
            - -lc
            - |
              set -euo pipefail

              ROOT=/mnt/output/opening_strength_fit/rolling_alpha_conditioned_top100_validation_v1
              mkdir -p "${ROOT}"
              MONTHS=(2021-08 2021-09 2021-10 2021-11 2021-12 2022-01)
              INDEX="${JOB_COMPLETION_INDEX:-}"
              if [ -z "${INDEX}" ]; then
                echo "missing JOB_COMPLETION_INDEX for indexed shard job" >&2
                exit 1
              fi
              if [ "${INDEX}" -lt 0 ] || [ "${INDEX}" -ge "${#MONTHS[@]}" ]; then
                echo "JOB_COMPLETION_INDEX out of range: ${INDEX}" >&2
                exit 1
              fi

              MONTH="${MONTHS[${INDEX}]}"
              OUT="${ROOT}/month_${MONTH}"
              if [ -d "${OUT}" ]; then
                echo "month ${MONTH}: removing stale shard output ${OUT}"
                rm -rf "${OUT}"
              fi

              echo
              echo "running rolling_alpha_conditioned_top100_validation_v1 shard month=${MONTH} index=${INDEX}"
              echo "output_dir=${OUT}"

              osf-run-alpha-conditioned-rolling-validation \
                --config experiments/runs/rolling_alpha_conditioned_top100_validation_v1.toml \
                --rolling-monthly \
                --train-months 12 \
                --test-start-month "${MONTH}" \
                --test-end-month "${MONTH}" \
                --output-dir "${OUT}"
          volumeMounts:
            - name: opening-strength-output
              mountPath: /mnt/output
          resources:
            requests:
              cpu: "8"
              memory: 192Gi

            limits:
              cpu: "16"
              memory: 256Gi
