apiVersion: batch/v1
kind: Job
metadata:
  name: opening-strength-ridge-opening-1y-next-month
  namespace: bizewu
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: highfort
      volumes:
        - name: opening-strength-output
          persistentVolumeClaim:
            claimName: bizewu-private-data
      containers:
        - name: opening-strength-fit
          image: registry.corp.highfortfunds.com/bizewu/opening-strength-fit:20260520-overnight-v1
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: opening-strength-clickhouse
          workingDir: /app/opening_strength_fit
          command:
            - osf-train
            - --config
            - experiments/runs/ridge_opening_1y_next_month.toml
            - --output-dir
            - /mnt/output/opening_strength_fit/runs/models/ridge/ridge_opening_1y_next_month
          volumeMounts:
            - name: opening-strength-output
              mountPath: /mnt/output
          resources:
            requests:
              cpu: "8"
              memory: 96Gi
            limits:
              cpu: "16"
              memory: 128Gi
