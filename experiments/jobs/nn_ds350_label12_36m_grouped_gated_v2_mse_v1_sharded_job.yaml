apiVersion: batch/v1
kind: Job
metadata:
  name: os-nn-ds350-label12-v1
  namespace: bizewu
  labels: {app: os-nn-ds350-label12-v1}
spec:
  activeDeadlineSeconds: 1209600
  backoffLimit: 96
  completionMode: Indexed
  completions: 96
  parallelism: 8
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {app: os-nn-ds350-label12-v1}
    spec:
      restartPolicy: Never
      imagePullSecrets: [{name: highfort}]
      volumes:
        - name: output
          persistentVolumeClaim: {claimName: bizewu-private-data}
      nodeSelector: {has_gpu: "true"}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: [node6, node7, node8, node12, node17, node19, node20, node22, node24, node25, node26, node27, node28]
      tolerations:
        - {key: has_gpu, operator: Equal, value: "true", effect: NoSchedule}
      containers:
        - name: trainer
          image: registry.corp.highfortfunds.com/bizewu/opening-strength-fit@sha256:ceb963e59e0a94d3894a6a0030e1ed79cdb62992c5de4c602119f61ee8718d60
          imagePullPolicy: Always
          workingDir: /app/opening_strength_fit
          env:
            - name: JOB_COMPLETION_INDEX
              valueFrom:
                fieldRef: {fieldPath: "metadata.annotations['batch.kubernetes.io/job-completion-index']"}
          command: [/bin/bash, -lc]
          args:
            - |
              set -euo pipefail
              CASES=(
                w0931_0940_h1m w0931_0940_h3m
                w1001_1010_h1m w1001_1010_h3m
                w1401_1410_h1m w1401_1410_h3m
                w0931_0940_h10m w0931_0940_h1h w0931_0940_hclose
                w1001_1010_h10m w1001_1010_h1h w1001_1010_hclose
              )
              FEATURES=(
                opening_0931_0940_features_350 opening_0931_0940_features_350
                opening_1001_1010_features_350 opening_1001_1010_features_350
                opening_1401_1410_features_350 opening_1401_1410_features_350
                opening_0931_0940_features_350 opening_0931_0940_features_350 opening_0931_0940_features_350
                opening_1001_1010_features_350 opening_1001_1010_features_350 opening_1001_1010_features_350
              )
              LABELS=(
                opening_0931_0940_labels_h1m_v2 opening_0931_0940_labels_h3m_v2
                opening_1001_1010_labels_h1m_v2 opening_1001_1010_labels_h3m_v2
                opening_1401_1410_labels_h1m_v2 opening_1401_1410_labels_h3m_v2
                opening_0931_0940_labels_h10m_v1 opening_0931_0940_labels_h1h_v1 opening_0931_0940_labels_hclose_v1
                opening_1001_1010_labels_h10m_v1 opening_1001_1010_labels_h1h_v1 opening_1001_1010_labels_hclose_v1
              )
              TEST_STARTS=(2022-01 2022-07 2023-01 2023-07 2024-01 2024-07 2025-01 2025-07)
              TEST_ENDS=(2022-06 2022-12 2023-06 2023-12 2024-06 2024-12 2025-06 2025-12)

              INDEX="${JOB_COMPLETION_INDEX:?missing JOB_COMPLETION_INDEX}"
              CASE_INDEX=$((INDEX / 8))
              SPLIT_INDEX=$((INDEX % 8))
              CASE="${CASES[${CASE_INDEX}]}"
              FEATURE_ROOT="/mnt/output/opening_strength_fit/datasets/${FEATURES[${CASE_INDEX}]}"
              LABEL_ROOT="/mnt/output/opening_strength_fit/datasets/${LABELS[${CASE_INDEX}]}"
              TEST_START="${TEST_STARTS[${SPLIT_INDEX}]}"
              TEST_END="${TEST_ENDS[${SPLIT_INDEX}]}"
              RUN_ID="nn_ds350_${CASE}_36m_grouped_gated_v2_mse_v1"
              OUT="/mnt/output/opening_strength_fit/nn/nn_ds350_label12_36m_grouped_gated_v2_mse_v1/${CASE}/month_${TEST_START}"

              for YEAR in 2019 2020 2021 2022 2023 2024 2025; do
                for READY in "${FEATURE_ROOT}/year=${YEAR}/_SUCCESS" "${LABEL_ROOT}/year=${YEAR}/_SUCCESS"; do
                  until [ -f "${READY}" ]; do
                    echo "waiting for ${READY}"
                    sleep 120
                  done
                done
              done
              if [ -f "${OUT}/_SUCCESS" ] && [ -f "${OUT}/metrics_by_year.csv" ] && [ -f "${OUT}/predictions.parquet" ]; then
                echo "output already complete, skipping ${OUT}"
                exit 0
              fi

              exec osf-train \
                --config experiments/runs/nn_ds350_label12_36m_grouped_gated_v2_mse_v1.toml \
                --feature-input "${FEATURE_ROOT}" \
                --label-input "${LABEL_ROOT}" \
                --run-id "${RUN_ID}" \
                --rolling-monthly \
                --train-months 36 \
                --test-months 6 \
                --test-stride-months 6 \
                --test-start-month "${TEST_START}" \
                --test-end-month "${TEST_END}" \
                --output-dir "${OUT}"
          volumeMounts: [{name: output, mountPath: /mnt/output}]
          resources:
            requests: {cpu: "16", memory: 384Gi, nvidia.com/gpu: "1"}
            limits: {cpu: "32", memory: 640Gi, nvidia.com/gpu: "1"}
