apiVersion: batch/v1
kind: Job
metadata:
  name: opening-strength-read-lgbm-delay2-postopen-no-preopen-v1
  namespace: bizewu
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: highfort
      volumes:
        - name: opening-strength-output
          persistentVolumeClaim:
            claimName: bizewu-private-data
      containers:
        - name: reader
          image: registry.corp.highfortfunds.com/bizewu/opening-strength-fit:opening-strength-fit-20260527-no-preopen-v1
          imagePullPolicy: Always
          workingDir: /app/opening_strength_fit
          command:
            - python
            - scripts/summarize_opening_results.py
            - --input-dir
            - /mnt/output/opening_strength_fit/lgbm_delay2_postopen_no_preopen_v1
          volumeMounts:
            - name: opening-strength-output
              mountPath: /mnt/output
