# osf-contract: mounted-script-entrypoint
apiVersion: batch/v1
kind: Job
metadata:
  name: os-ds350-four-window-limit-tables-v1
  namespace: bizewu
  labels: {app: os-ds350-four-window-limit-tables-v1, osf-exp: w1101-limit-tables-v1}
spec:
  activeDeadlineSeconds: 172800
  backoffLimit: 1
  suspend: true
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels: {app: os-ds350-four-window-limit-tables-v1, osf-exp: w1101-limit-tables-v1}
    spec:
      restartPolicy: Never
      imagePullSecrets: [{name: highfort}]
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: kubernetes.io/hostname, operator: NotIn, values: [node7, node8]}
      volumes:
        - {name: output, persistentVolumeClaim: {claimName: bizewu-private-data}}
        - {name: scripts, configMap: {name: os-ds350-four-window-limit-tables-code-v1}}
      containers:
        - name: analyzer
          image: registry.corp.highfortfunds.com/bizewu/opening-strength-fit@sha256:8eb66ef731709af980fa7e047ccb59748c0ed8f4ed36aa3460ee9b1f4a9fe0b6
          imagePullPolicy: Always
          workingDir: /app/opening_strength_fit
          envFrom:
            - secretRef: {name: xy-fit-ceph-credentials}
          command: [/bin/bash, -lc]
          args:
            - |
              set -euo pipefail
              exec python /opt/analysis/build_ds350_four_window_limit_tables.py \
                --legacy-analysis-root /mnt/output/opening_strength_fit/analysis \
                --baseline-root /mnt/output/opening_strength_fit/nn/nn_ds350_label15_36m_grouped_gated_v2_mse_max30_v1 \
                --no-limit-root /mnt/output/opening_strength_fit/nn/nn_ds350_w1101_h1m_h3m_train_ordinary_36m_grouped_gated_v2_mse_max30_v1 \
                --dataset-root /mnt/output/opening_strength_fit/datasets \
                --cache-root /mnt/output/opening_strength_fit/cache \
                --pool-reference-raw-root /mnt/output/opening_strength_fit/cache/opening_0931_0940_raw_source \
                --output-dir /mnt/output/opening_strength_fit/analysis/ds350_four_window_limit_tables_v1
          volumeMounts:
            - {name: output, mountPath: /mnt/output}
            - {name: scripts, mountPath: /opt/analysis/build_ds350_clip_tables.py, subPath: build_ds350_clip_tables.py}
            - {name: scripts, mountPath: /opt/analysis/build_ds350_four_window_limit_tables.py, subPath: build_ds350_four_window_limit_tables.py}
          resources:
            requests: {cpu: "8", memory: 192Gi}
            limits: {cpu: "16", memory: 384Gi}
