apiVersion: batch/v1
kind: Job
metadata:
  name: os-nn-ds350-close-loss-2026h1-v1
  namespace: bizewu
  labels: {app: os-nn-ds350-close-loss-2026h1-v1}
spec:
  activeDeadlineSeconds: 604800
  backoffLimit: 2
  completionMode: Indexed
  completions: 2
  parallelism: 2
  ttlSecondsAfterFinished: 172800
  template:
    metadata:
      labels: {app: os-nn-ds350-close-loss-2026h1-v1}
    spec:
      restartPolicy: Never
      imagePullSecrets: [{name: highfort}]
      nodeSelector:
        has_gpu: "true"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: kubernetes.io/hostname, operator: NotIn, values: [node6, node7, node8, node12, node17, node19, node20, node22, node24, node25, node26, node27, node28]}
                  - {key: gpu_model, operator: In, values: [A100-80, H100-80, H20]}
      tolerations:
        - key: has_gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      volumes:
        - name: output
          persistentVolumeClaim: {claimName: bizewu-private-data}
        - name: training-code
          configMap: {name: os-ds350-close-loss-2026h1-code-v1}
      containers:
        - name: trainer
          image: registry.corp.highfortfunds.com/bizewu/opening-strength-fit@sha256:8eb66ef731709af980fa7e047ccb59748c0ed8f4ed36aa3460ee9b1f4a9fe0b6
          imagePullPolicy: Always
          workingDir: /app/opening_strength_fit
          env:
            - name: JOB_COMPLETION_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: "metadata.annotations['batch.kubernetes.io/job-completion-index']"
          command: [/bin/bash, -lc]
          args:
            - |
              set -euo pipefail
              LOSSES=(huber huber_mse_blend)
              RUN_IDS=(
                nn_ds350_w0931_hclose_huber_train2023_2025_test2026h1_purge1_v1
                nn_ds350_w0931_hclose_huber80_mse20_train2023_2025_test2026h1_purge1_v1
              )
              INDEX="${JOB_COMPLETION_INDEX:?missing completion index}"
              LOSS="${LOSSES[${INDEX}]}"
              RUN_ID="${RUN_IDS[${INDEX}]}"
              FEATURE_ROOT=/mnt/output/opening_strength_fit/datasets/opening_0931_0940_features_350
              LABEL_ROOT=/mnt/output/opening_strength_fit/datasets/opening_0931_0940_labels_hclose_v1
              OUT="/mnt/output/opening_strength_fit/nn/holdout/${RUN_ID}"
              CONFIG="/tmp/${RUN_ID}.toml"

              python - <<'PY'
              import torch
              from opening_strength_fit.torch_model.training import _torch_loss
              prediction = torch.tensor([0.0, 2.0])
              target = torch.zeros(2)
              value = _torch_loss(
                  "huber_mse_blend",
                  torch,
                  huber_beta=1.0,
                  mse_blend_weight=0.2,
              )(prediction, target)
              torch.testing.assert_close(value, torch.tensor([0.0, 2.0]))
              print("loss preflight passed")
              PY

              cp experiments/runs/nn_ds350_label15_36m_grouped_gated_v2_mse_max30_v1.toml "${CONFIG}"
              sed -i "s/^loss = .*/loss = \"${LOSS}\"/" "${CONFIG}"
              sed -i '/^loss = /a huber_beta = 1.0\nmse_blend_weight = 0.2' "${CONFIG}"
              sed -i '/^\[window\]$/a purge_train_sessions = 1' "${CONFIG}"
              sed -i '/^\[output\]$/a write_unfiltered_predictions = true' "${CONFIG}"

              exec osf-train \
                --config "${CONFIG}" \
                --feature-input "${FEATURE_ROOT}" \
                --label-input "${LABEL_ROOT}" \
                --run-id "${RUN_ID}" \
                --rolling-monthly \
                --train-months 36 \
                --test-months 6 \
                --test-stride-months 6 \
                --test-start-month 2026-01 \
                --test-end-month 2026-06 \
                --output-dir "${OUT}"
          volumeMounts:
            - {name: output, mountPath: /mnt/output}
            - name: training-code
              mountPath: /usr/local/lib/python3.12/site-packages/opening_strength_fit/training_modeling.py
              subPath: training_modeling.py
            - name: training-code
              mountPath: /usr/local/lib/python3.12/site-packages/opening_strength_fit/torch_model/training.py
              subPath: training.py
          resources:
            requests: {cpu: "8", memory: 256Gi, nvidia.com/gpu: "1"}
            limits: {cpu: "16", memory: 384Gi, nvidia.com/gpu: "1"}
