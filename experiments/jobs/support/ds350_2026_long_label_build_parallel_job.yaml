apiVersion: batch/v1
kind: Job
metadata:
  name: os-long-labels-w0931-0940-2026-v2
  namespace: bizewu
  labels: {app: os-long-labels-w0931-0940-2026-v2}
spec:
  activeDeadlineSeconds: 259200
  backoffLimit: 2
  ttlSecondsAfterFinished: 172800
  template:
    metadata:
      labels: {app: os-long-labels-w0931-0940-2026-v2}
    spec:
      restartPolicy: Never
      imagePullSecrets: [{name: highfort}]
      volumes:
        - name: output
          persistentVolumeClaim: {claimName: bizewu-private-data}
        - name: build-code
          configMap:
            name: os-ds350-2026-long-label-build-code-v1
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: kubernetes.io/hostname, operator: NotIn, values: [node7, node8]}
      containers:
        - name: builder
          image: registry.corp.highfortfunds.com/bizewu/opening-strength-fit@sha256:f04ef3ab7372000162e1b92bf86e96f5f6e0e36f15c163d75c9a3c1cc554ab09
          imagePullPolicy: Always
          workingDir: /app/opening_strength_fit
          command: [/bin/bash, -lc]
          args:
            - |
              set -euo pipefail
              CONFIG=/tmp/opening_0931_0940_labels_10m_1h_close_2026.toml
              cp experiments/runs/opening_0931_0940_labels_10m_1h_close.toml "${CONFIG}"
              sed -E -i 's/^years = \[.*\]/years = [2026]/' "${CONFIG}"
              exec osf-build-long-horizon-labels \
                --config "${CONFIG}" \
                --year 2026 \
                --start-date 2026-01-01 \
                --end-date 2026-06-30 \
                --workers 6 \
                --overwrite
          volumeMounts:
            - {name: output, mountPath: /mnt/output}
            - {name: build-code, mountPath: /usr/local/lib/python3.12/site-packages/opening_strength_fit/commands/long_horizon_labels.py, subPath: long_horizon_labels.py}
          resources:
            requests: {cpu: "8", memory: 64Gi}
            limits: {cpu: "24", memory: 192Gi}
