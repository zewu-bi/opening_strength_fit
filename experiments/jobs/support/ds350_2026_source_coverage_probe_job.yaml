apiVersion: batch/v1
kind: Job
metadata:
  name: os-ds350-2026-source-probe-v1
  namespace: bizewu
  labels:
    app: os-ds350-2026-source-probe-v1
spec:
  activeDeadlineSeconds: 7200
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: os-ds350-2026-source-probe-v1
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: highfort
      containers:
        - name: probe
          image: registry.corp.highfortfunds.com/bizewu/opening-strength-fit:20260731-raw-source-42ec6bdd
          imagePullPolicy: Always
          workingDir: /app/opening_strength_fit
          envFrom:
            - secretRef:
                name: opening-strength-clickhouse
          command:
            - /bin/bash
            - -lc
            - |
              set -euo pipefail
              osf-probe-clickhouse-data \
                --table stock.tick \
                --start-date 2026-01-01 \
                --end-date 2026-07-15 \
                --a-share-only \
                --start-time 09:15 \
                --end-time 09:50 \
                --date-layout
              osf-probe-clickhouse-data \
                --table stock.tick \
                --start-date 2026-01-01 \
                --end-date 2026-07-15 \
                --a-share-only \
                --start-time 14:30 \
                --end-time 15:00 \
                --date-layout
              python - <<'PY'
              import os

              from opening_strength_fit.clickhouse_ticks import get_tick_client
              from opening_strength_fit.universe import DEFAULT_A_SHARE_SYMBOL_REGEX

              client = get_tick_client(
                  username=os.environ["CLICKHOUSE_USER"],
                  password=os.environ["CLICKHOUSE_PASSWORD"],
                  host=os.environ["CLICKHOUSE_HOST"],
                  port=int(os.environ.get("CLICKHOUSE_PORT", "8123")),
              )
              parameters = {
                  "start_date": "2026-01-01",
                  "end_date": "2026-07-15",
                  "symbol_regex": DEFAULT_A_SHARE_SYMBOL_REGEX,
              }
              summary = client.query_df(
                  """
                  select
                      count() as rows,
                      uniqExact(TradingDay) as trading_days,
                      uniqExact(Symbol) as symbols,
                      min(TradingDay) as date_min,
                      max(TradingDay) as date_max
                  from stock.daily_bar_jy
                  where TradingDay >= {start_date:Date}
                    and TradingDay <= {end_date:Date}
                    and match(Symbol, {symbol_regex:String})
                  """,
                  parameters=parameters,
              )
              tail = client.query_df(
                  """
                  select
                      TradingDay as date,
                      count() as rows,
                      uniqExact(Symbol) as symbols
                  from stock.daily_bar_jy
                  where TradingDay >= {start_date:Date}
                    and TradingDay <= {end_date:Date}
                    and TradingDay >= toDate('2026-06-25')
                    and match(Symbol, {symbol_regex:String})
                  group by TradingDay
                  order by TradingDay
                  """,
                  parameters=parameters,
              )
              required = client.query_df(
                  """
                  select
                      TradingDay as date,
                      count() as rows,
                      uniqExact(Symbol) as symbols
                  from stock.daily_bar_jy
                  where TradingDay in [toDate('2026-06-30'), toDate('2026-07-01')]
                    and match(Symbol, {symbol_regex:String})
                  group by TradingDay
                  order by TradingDay
                  """,
                  parameters={"symbol_regex": DEFAULT_A_SHARE_SYMBOL_REGEX},
              )
              print("\nstock.daily_bar_jy summary")
              print(summary.to_string(index=False))
              print("\nstock.daily_bar_jy tail")
              print(tail.to_string(index=False))
              print("\nrequired month-end next-close sessions")
              print(required.to_string(index=False))
              PY
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
