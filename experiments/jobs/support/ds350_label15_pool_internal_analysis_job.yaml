apiVersion: batch/v1
kind: Job
metadata:
  name: os-analyze-ds350-label15-v1
  namespace: bizewu
  labels:
    app: os-analyze-ds350-label15-v1
    osf-matrix: ds350-label15-v1
spec:
  activeDeadlineSeconds: 86400
  backoffLimit: 1
  completionMode: Indexed
  completions: 15
  parallelism: 5
  ttlSecondsAfterFinished: 172800
  template:
    metadata:
      labels:
        app: os-analyze-ds350-label15-v1
        osf-matrix: ds350-label15-v1
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: highfort
      nodeSelector:
        has_gpu: "true"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - node6
                      - node7
                      - node8
                      - node12
                      - node17
                      - node19
                      - node20
                      - node22
                      - node24
                      - node25
                      - node26
                      - node27
                      - node28
      tolerations:
        - key: has_gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      volumes:
        - name: output
          persistentVolumeClaim:
            claimName: bizewu-private-data
      containers:
        - name: analyzer
          image: registry.corp.highfortfunds.com/bizewu/opening-strength-fit@sha256:1c35beb1275aca13e5a71fd03bc13ae703078b29b3e2a744c77e386a32c4917a
          imagePullPolicy: Always
          workingDir: /app/opening_strength_fit
          envFrom:
            - secretRef:
                name: opening-strength-clickhouse
            - secretRef:
                name: xy-fit-ceph-credentials
          env:
            - name: JOB_COMPLETION_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: "metadata.annotations['batch.kubernetes.io/job-completion-index']"
          command:
            - /bin/bash
            - -lc
          args:
            - |
              set -euo pipefail
              CASES=(
                w0931_0940_h1m
                w0931_0940_h3m
                w0931_0940_h5m
                w0931_0940_h10m
                w0931_0940_h1h
                w0931_0940_hclose
                w1001_1010_h1m
                w1001_1010_h3m
                w1001_1010_h5m
                w1001_1010_h10m
                w1001_1010_h1h
                w1001_1010_hclose
                w1401_1410_h1m
                w1401_1410_h3m
                w1401_1410_h5m
              )
              INDEX="${JOB_COMPLETION_INDEX:?missing JOB_COMPLETION_INDEX}"
              CASE="${CASES[${INDEX}]}"
              case "${CASE}" in
                w0931_0940_*) WINDOW=0931_0940 ;;
                w1001_1010_*) WINDOW=1001_1010 ;;
                w1401_1410_*) WINDOW=1401_1410 ;;
                *) echo "unsupported CASE=${CASE}" >&2; exit 2 ;;
              esac

              ROOT=/mnt/output/opening_strength_fit/nn/nn_ds350_label12_36m_grouped_gated_v2_mse_v1
              PREDICTIONS="${ROOT}/${CASE}"
              NEXT_LABELS="/mnt/output/opening_strength_fit/cache/opening_2019_2025_next_close_decision_clock_state_clock6_${WINDOW}"
              OUT="${PREDICTIONS}/analysis/pool_internal_top100_horizon_v1"
              RUN_ID="nn_ds350_${CASE}_36m_grouped_gated_v2_mse_v1"

              for TEST_START in 2022-01 2022-07 2023-01 2023-07 2024-01 2024-07 2025-01 2025-07; do
                test -f "${PREDICTIONS}/month_${TEST_START}/predictions.parquet"
              done

              mkdir -p "${OUT}"
              if [ ! -f "${OUT}/_SUCCESS" ]; then
                osf-analyze-pool-internal-top100 \
                  --predictions "${PREDICTIONS}" \
                  --next-close-label-input "${NEXT_LABELS}" \
                  --run-id "${RUN_ID}" \
                  --variant "${CASE}" \
                  --output-dir "${OUT}" \
                  --top-n 100 \
                  --pool-date-lag-sessions 0 \
                  --pool universe \
                  --pool L
                touch "${OUT}/_SUCCESS"
              else
                echo "analysis output already complete, reusing ${OUT}"
              fi

              python - "${CASE}" "${OUT}" <<'PY'
              import sys
              from pathlib import Path

              import pandas as pd

              case = sys.argv[1]
              output_dir = Path(sys.argv[2])
              overall = pd.read_csv(output_dir / "pool_internal_summary.csv")
              quarterly = pd.read_csv(output_dir / "pool_internal_quarter_summary.csv")
              metrics = [
                  "pool_short_mean_bps",
                  "selected_short_mean_bps",
                  "short_internal_excess_bps",
                  "short_rank_ic",
                  "pool_next_mean_bps",
                  "selected_next_mean_bps",
                  "next_internal_excess_bps",
                  "next_rank_ic",
              ]
              quarter_mean = quarterly.groupby("pool", as_index=False)[metrics].mean()
              print(f"CASE_SUMMARY_BEGIN={case}")
              print("QUARTER_MEAN_CSV")
              print(quarter_mean.to_csv(index=False).strip())
              print("OVERALL_CSV")
              print(overall.to_csv(index=False).strip())
              print(f"CASE_SUMMARY_END={case}")
              PY
          volumeMounts:
            - name: output
              mountPath: /mnt/output
          resources:
            requests:
              cpu: "8"
              memory: 256Gi
            limits:
              cpu: "16"
              memory: 384Gi
