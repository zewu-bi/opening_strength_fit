apiVersion: batch/v1
kind: Job
metadata:
  name: os-raw-source-w0931-0940-2026-v1
  namespace: bizewu
  labels: {app: os-raw-source-w0931-0940-2026-v1}
spec:
  activeDeadlineSeconds: 259200
  backoffLimit: 2
  ttlSecondsAfterFinished: 172800
  template:
    metadata:
      labels: {app: os-raw-source-w0931-0940-2026-v1}
    spec:
      restartPolicy: Never
      imagePullSecrets: [{name: highfort}]
      volumes:
        - name: output
          persistentVolumeClaim: {claimName: bizewu-private-data}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: kubernetes.io/hostname, operator: NotIn, values: [node7, node8]}
      containers:
        - name: builder
          image: registry.corp.highfortfunds.com/bizewu/opening-strength-fit:20260731-raw-source-42ec6bdd
          imagePullPolicy: Always
          workingDir: /app/opening_strength_fit
          envFrom:
            - secretRef: {name: opening-strength-clickhouse}
          command: [/bin/bash, -lc]
          args:
            - |
              set -euo pipefail
              CONFIG=/tmp/opening_0931_0940_raw_source_2026.toml
              cp experiments/runs/opening_0931_0940_raw_source.toml "${CONFIG}"
              sed -E -i 's/^years = \[.*\]/years = [2026]/' "${CONFIG}"
              exec osf-build-raw-source-cache --config "${CONFIG}" --year 2026 --overwrite
          volumeMounts: [{name: output, mountPath: /mnt/output}]
          resources:
            requests: {cpu: "2", memory: 8Gi}
            limits: {cpu: "8", memory: 24Gi}
---
