apiVersion: batch/v1
kind: Job
metadata:
  name: os-audit-ds350-long-align-v2
  namespace: bizewu
  labels:
    app: os-audit-ds350-long-align-v2
spec:
  activeDeadlineSeconds: 21600
  backoffLimit: 1
  completionMode: Indexed
  completions: 4
  parallelism: 4
  ttlSecondsAfterFinished: 172800
  template:
    metadata:
      labels:
        app: os-audit-ds350-long-align-v2
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: highfort
      nodeSelector:
        has_gpu: "true"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: [node6, node7, node8, node12, node17, node19, node20, node22, node24, node25, node26, node27, node28]
      tolerations:
        - key: has_gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      volumes:
        - name: output
          persistentVolumeClaim:
            claimName: bizewu-private-data
      containers:
        - name: audit
          image: registry.corp.highfortfunds.com/bizewu/opening-strength-fit@sha256:1c35beb1275aca13e5a71fd03bc13ae703078b29b3e2a744c77e386a32c4917a
          imagePullPolicy: Always
          workingDir: /app/opening_strength_fit
          env:
            - name: JOB_COMPLETION_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: "metadata.annotations['batch.kubernetes.io/job-completion-index']"
          command: [/bin/bash, -lc]
          args:
            - |
              set -euo pipefail
              CASES=(w0931_0940_h1h w0931_0940_hclose w1001_1010_h1h w1001_1010_hclose)
              CASE="${CASES[${JOB_COMPLETION_INDEX:?missing index}]}"
              python - "${CASE}" <<'PY'
              import sys
              from pathlib import Path

              import numpy as np
              import pandas as pd

              case = sys.argv[1]
              if case.startswith("w0931_0940"):
                  window = "0931_0940"
              elif case.startswith("w1001_1010"):
                  window = "1001_1010"
              else:
                  raise SystemExit(case)
              if case.endswith("h1h"):
                  horizon = "1h"
                  source_column = "label_hold_1h"
              elif case.endswith("hclose"):
                  horizon = "close"
                  source_column = "label_same_day_close"
              else:
                  raise SystemExit(case)

              keys = ["date", "symbol", "decision_target_timestamp"]
              dataset_root = Path("/mnt/output/opening_strength_fit/datasets")
              feature_root = dataset_root / f"opening_{window}_features_350"
              label_root = dataset_root / f"opening_{window}_labels_h{horizon}_v1"
              source_root = dataset_root / f"opening_{window}_labels_10m_1h_close_next"
              prediction_root = (
                  Path("/mnt/output/opening_strength_fit/nn/nn_ds350_label15_36m_grouped_gated_v2_mse_max30_v1")
                  / case
              )

              key_records = []
              source_records = []
              label_parts = []
              for year in range(2019, 2026):
                  feature_path = feature_root / f"year={year}" / "features.parquet"
                  label_path = label_root / f"year={year}" / "labels.parquet"
                  source_path = source_root / f"year={year}" / "labels.parquet"
                  feature_keys = pd.read_parquet(feature_path, columns=keys)
                  labels = pd.read_parquet(label_path, columns=[*keys, "label_short"])
                  same_length = len(feature_keys) == len(labels)
                  mismatch = len(feature_keys) if not same_length else 0
                  if same_length:
                      mismatch_mask = np.zeros(len(labels), dtype=bool)
                      for key in keys:
                          left = feature_keys[key]
                          right = labels[key]
                          if key == "decision_target_timestamp":
                              left = pd.to_datetime(left, errors="coerce")
                              right = pd.to_datetime(right, errors="coerce")
                          else:
                              left = left.astype(str)
                              right = right.astype(str)
                          mismatch_mask |= left.to_numpy() != right.to_numpy()
                      mismatch = int(mismatch_mask.sum())
                  key_records.append(
                      {"year": year, "feature_rows": len(feature_keys), "label_rows": len(labels), "row_order_key_mismatches": mismatch}
                  )

                  source = pd.read_parquet(source_path, columns=[*keys, source_column])
                  joined = labels.merge(source, on=keys, how="outer", validate="one_to_one", indicator=True)
                  both = joined["_merge"].eq("both")
                  delta = (
                      pd.to_numeric(joined.loc[both, "label_short"], errors="coerce")
                      - pd.to_numeric(joined.loc[both, source_column], errors="coerce")
                  ).abs()
                  source_records.append(
                      {
                          "year": year,
                          "label_source_key_misses": int((~both).sum()),
                          "label_source_value_mismatches_gt_1e12": int(delta.gt(1e-12).sum()),
                          "label_source_max_abs_delta": float(delta.max()),
                      }
                  )
                  if year >= 2022:
                      label_parts.append(labels)

              authority = pd.concat(label_parts, ignore_index=True)
              prediction_files = sorted(prediction_root.glob("month_*/predictions.parquet"))
              predictions = pd.concat(
                  (pd.read_parquet(path, columns=[*keys, "label"]) for path in prediction_files),
                  ignore_index=True,
              )
              duplicate_prediction_keys = int(predictions.duplicated(keys, keep=False).sum())
              comparison = predictions.merge(
                  authority,
                  on=keys,
                  how="outer",
                  validate="one_to_one",
                  indicator=True,
              )
              both = comparison["_merge"].eq("both")
              delta = (
                  pd.to_numeric(comparison.loc[both, "label"], errors="coerce")
                  - pd.to_numeric(comparison.loc[both, "label_short"], errors="coerce")
              ).abs()

              print(f"ALIGN_AUDIT_BEGIN={case}")
              print("FEATURE_LABEL_ROW_ORDER")
              print(pd.DataFrame(key_records).to_csv(index=False))
              print("SPLIT_LABEL_VS_LONG_SOURCE")
              print(pd.DataFrame(source_records).to_csv(index=False))
              print("PREDICTION_LABEL_VS_AUTHORITY")
              print(
                  pd.DataFrame(
                      [
                          {
                              "prediction_rows": len(predictions),
                              "duplicate_prediction_keys": duplicate_prediction_keys,
                              "prediction_authority_key_misses": int((~both).sum()),
                              "prediction_label_mismatches_gt_1e12": int(delta.gt(1e-12).sum()),
                              "prediction_label_max_abs_delta": float(delta.max()),
                          }
                      ]
                  ).to_csv(index=False)
              )
              print(f"ALIGN_AUDIT_END={case}")
              PY
          volumeMounts:
            - name: output
              mountPath: /mnt/output
          resources:
            requests:
              cpu: "6"
              memory: 64Gi
            limits:
              cpu: "12"
              memory: 128Gi
