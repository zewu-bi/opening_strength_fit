apiVersion: batch/v1
kind: Job
metadata:
  name: os-leak-cutoff-1m-nn-v1
  namespace: bizewu
  labels: {app: os-leak-cutoff-1m-nn-v1}
spec:
  activeDeadlineSeconds: 1209600
  backoffLimit: 3
  completionMode: Indexed
  completions: 4
  parallelism: 2
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels: {app: os-leak-cutoff-1m-nn-v1}
    spec:
      restartPolicy: Never
      imagePullSecrets: [{name: highfort}]
      nodeSelector: {has_gpu: "true"}
      tolerations:
        - {key: has_gpu, operator: Equal, value: "true", effect: NoSchedule}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: gpu_model, operator: In, values: [A100-80, H100-80, H20]}
                  - {key: kubernetes.io/hostname, operator: NotIn, values: [node6, node7, node8, node12, node17, node19, node20, node22, node24, node25, node26, node27, node28]}
      volumes:
        - name: output
          persistentVolumeClaim: {claimName: bizewu-private-data}
      containers:
        - name: trainer
          image: registry.corp.highfortfunds.com/bizewu/opening-strength-fit@sha256:8eb66ef731709af980fa7e047ccb59748c0ed8f4ed36aa3460ee9b1f4a9fe0b6
          imagePullPolicy: Always
          workingDir: /app/opening_strength_fit
          env:
            - name: JOB_COMPLETION_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: "metadata.annotations['batch.kubernetes.io/job-completion-index']"
          command: [/bin/bash, -lc]
          args:
            - |
              set -euo pipefail
              CUTOFFS=(2 10 30 60)
              INDEX="${JOB_COMPLETION_INDEX:?missing completion index}"
              CUTOFF="${CUTOFFS[${INDEX}]}"
              FEATURE_ROOT="/mnt/output/opening_strength_fit/leakage_audit/features_cutoff_${CUTOFF}s"
              LABEL_ROOT=/mnt/output/opening_strength_fit/datasets/opening_0931_0940_labels_h1m_v2
              RUN_ID="leak_cutoff_${CUTOFF}s_1m_nn_v1"
              OUTPUT_ROOT="/mnt/output/opening_strength_fit/leakage_audit/nn/${RUN_ID}"
              exec osf-train \
                --config experiments/runs/nn_ds350_label15_36m_grouped_gated_v2_mse_max30_v1.toml \
                --feature-input "${FEATURE_ROOT}" \
                --label-input "${LABEL_ROOT}" \
                --run-id "${RUN_ID}" \
                --output-dir "${OUTPUT_ROOT}"
          volumeMounts: [{name: output, mountPath: /mnt/output}]
          resources:
            requests: {cpu: "8", memory: 256Gi, nvidia.com/gpu: "1"}
            limits: {cpu: "16", memory: 384Gi, nvidia.com/gpu: "1"}
