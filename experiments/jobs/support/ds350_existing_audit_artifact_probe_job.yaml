apiVersion: batch/v1
kind: Job
metadata:
  name: os-ds350-existing-audit-artifact-probe-v3
  namespace: bizewu
spec:
  activeDeadlineSeconds: 1800
  backoffLimit: 0
  ttlSecondsAfterFinished: 172800
  template:
    metadata:
      labels: {app: os-ds350-existing-audit-artifact-probe-v3}
    spec:
      restartPolicy: Never
      imagePullSecrets: [{name: highfort}]
      volumes:
        - name: output
          persistentVolumeClaim: {claimName: bizewu-private-data}
      containers:
        - name: probe
          image: registry.corp.highfortfunds.com/bizewu/opening-strength-fit@sha256:8eb66ef731709af980fa7e047ccb59748c0ed8f4ed36aa3460ee9b1f4a9fe0b6
          imagePullPolicy: Always
          command: [/bin/bash, -lc]
          args:
            - |
              set -euo pipefail
              ROOT=/mnt/output/opening_strength_fit
              for path in \
                "${ROOT}/audits/ds350_h1m_top1000_limit_decomposition_v1/trace.json" \
                "${ROOT}/audits/ds350_close_model_next_session_by_limit_v1/overall_summary.csv"; do
                echo "FILE=${path}"
                if test -f "${path}"; then
                  sed -n '1,220p' "${path}"
                else
                  echo MISSING
                fi
              done
          volumeMounts:
            - {name: output, mountPath: /mnt/output}
          resources:
            requests: {cpu: "1", memory: 2Gi}
            limits: {cpu: "2", memory: 4Gi}
