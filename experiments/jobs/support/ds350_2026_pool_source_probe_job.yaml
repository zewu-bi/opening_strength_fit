apiVersion: batch/v1
kind: Job
metadata:
  name: os-ds350-2026-pool-source-probe-v1
  namespace: bizewu
spec:
  activeDeadlineSeconds: 1800
  backoffLimit: 0
  ttlSecondsAfterFinished: 172800
  template:
    metadata:
      labels: {app: os-ds350-2026-pool-source-probe-v1}
    spec:
      restartPolicy: Never
      imagePullSecrets: [{name: highfort}]
      containers:
        - name: probe
          image: registry.corp.highfortfunds.com/bizewu/opening-strength-fit:20260731-raw-source-42ec6bdd
          imagePullPolicy: Always
          workingDir: /app/opening_strength_fit
          envFrom:
            - secretRef: {name: opening-strength-clickhouse}
          command: [/bin/bash, -lc]
          args:
            - |
              set -euo pipefail
              python - <<'PY'
              import os
              from opening_strength_fit.clickhouse_ticks import get_tick_client

              client = get_tick_client(
                  username=os.environ["CLICKHOUSE_USER"],
                  password=os.environ["CLICKHOUSE_PASSWORD"],
                  host=os.environ["CLICKHOUSE_HOST"],
                  port=int(os.environ.get("CLICKHOUSE_PORT", "8123")),
              )
              tables = client.query_df(
                  """
                  select database, name, engine, total_rows
                  from system.tables
                  where database not in ('system', 'information_schema', 'INFORMATION_SCHEMA')
                    and match(lower(name), 'pool|universe|member|constitu|index|stock')
                  order by database, name
                  """
              )
              columns = client.query_df(
                  """
                  select database, table, name, type
                  from system.columns
                  where database not in ('system', 'information_schema', 'INFORMATION_SCHEMA')
                    and match(lower(name), 'pool|universe|member|constitu')
                  order by database, table, position
                  """
              )
              daily_columns = client.query_df(
                  """
                  select name, type
                  from system.columns
                  where database = 'stock' and table = 'daily_bar_jy'
                  order by position
                  """
              )
              print('TABLES')
              print(tables.to_string(index=False))
              print('\nMEMBERSHIP_LIKE_COLUMNS')
              print(columns.to_string(index=False))
              print('\nDAILY_BAR_JY_COLUMNS')
              print(daily_columns.to_string(index=False))
              PY
          resources:
            requests: {cpu: "1", memory: 2Gi}
            limits: {cpu: "2", memory: 4Gi}
