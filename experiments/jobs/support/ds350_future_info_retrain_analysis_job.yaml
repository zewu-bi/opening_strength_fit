apiVersion: batch/v1
kind: Job
metadata:
  name: os-ds350-future-analysis-v2
  namespace: bizewu
  labels:
    app: os-ds350-future-analysis-v2
spec:
  activeDeadlineSeconds: 1209600
  backoffLimit: 1
  ttlSecondsAfterFinished: 172800
  template:
    metadata:
      labels:
        app: os-ds350-future-analysis-v2
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: highfort
      nodeSelector:
        has_gpu: "true"
      tolerations:
        - key: has_gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      volumes:
        - name: output
          persistentVolumeClaim:
            claimName: bizewu-private-data
        - name: analysis-script
          configMap:
            name: os-ds350-future-analysis-code-v1
      initContainers:
        - name: wait-for-retrain
          image: registry.corp.highfortfunds.com/bizewu/opening-strength-fit@sha256:1c35beb1275aca13e5a71fd03bc13ae703078b29b3e2a744c77e386a32c4917a
          imagePullPolicy: Always
          command: [/bin/bash, -lc]
          args:
            - |
              set -euo pipefail
              ROOT=/mnt/output/opening_strength_fit/nn/audits/ds350_future_info_v1
              FOLDS=(2022-01 2022-07 2023-01 2023-07 2024-01 2024-07 2025-01 2025-07)
              while true; do
                missing=0
                for case in w0931_0940_h1m w0931_0940_hclose; do
                  for purge in 0 1; do
                    for fold in "${FOLDS[@]}"; do
                      test -f "${ROOT}/${case}/purge${purge}/month_${fold}/_SUCCESS" || missing=$((missing + 1))
                      test -f "${ROOT}/${case}/purge${purge}/month_${fold}/predictions_unfiltered.parquet" || missing=$((missing + 1))
                    done
                  done
                done
                if [ "${missing}" -eq 0 ]; then
                  break
                fi
                echo "waiting for future-info retrains: missing_artifacts=${missing}"
                sleep 30
              done
          volumeMounts:
            - name: output
              mountPath: /mnt/output
          resources:
            requests:
              cpu: "100m"
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      containers:
        - name: analysis
          image: registry.corp.highfortfunds.com/bizewu/opening-strength-fit@sha256:1c35beb1275aca13e5a71fd03bc13ae703078b29b3e2a744c77e386a32c4917a
          imagePullPolicy: Always
          workingDir: /app/opening_strength_fit
          envFrom:
            - secretRef:
                name: xy-fit-ceph-credentials
          command: [/bin/bash, -lc]
          args:
            - |
              set -euo pipefail
              python /opt/analysis/analyze_ds350_future_info_retrain.py \
                --output-dir /mnt/output/opening_strength_fit/runs/analyses/ds350_future_info_v1/retrain_comparison
          volumeMounts:
            - name: output
              mountPath: /mnt/output
            - name: analysis-script
              mountPath: /opt/analysis
          resources:
            requests:
              cpu: "8"
              memory: 192Gi
            limits:
              cpu: "16"
              memory: 320Gi
