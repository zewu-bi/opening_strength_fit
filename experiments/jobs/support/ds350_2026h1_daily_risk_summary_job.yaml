apiVersion: batch/v1
kind: Job
metadata:
  name: os-ds350-2026h1-daily-risk-summary-v1
  namespace: bizewu
spec:
  activeDeadlineSeconds: 1800
  backoffLimit: 0
  ttlSecondsAfterFinished: 172800
  template:
    metadata:
      labels: {app: os-ds350-2026h1-daily-risk-summary-v1}
    spec:
      restartPolicy: Never
      imagePullSecrets: [{name: highfort}]
      volumes:
        - name: output
          persistentVolumeClaim: {claimName: bizewu-private-data}
      containers:
        - name: analysis
          image: registry.corp.highfortfunds.com/bizewu/opening-strength-fit@sha256:8eb66ef731709af980fa7e047ccb59748c0ed8f4ed36aa3460ee9b1f4a9fe0b6
          imagePullPolicy: Always
          command: [/bin/bash, -lc]
          args:
            - |
              set -euo pipefail
              python - <<'PY'
              import json
              import numpy as np
              import pandas as pd

              path = "/mnt/output/opening_strength_fit/audits/ds350_2026h1_holdout_return_scope_v3/group_metrics.parquet"
              frame = pd.read_parquet(path)
              frame = frame.loc[frame["scope"].eq("all_a")].copy()
              columns = [
                  "entry_to_same_day_close_pool_raw_bps",
                  "entry_to_same_day_close_selected_raw_bps",
                  "entry_to_same_day_close_excess_bps",
                  "entry_to_same_day_close_limit_excess_contribution_bps",
                  "entry_to_same_day_close_nonlimit_excess_contribution_bps",
                  "entry_to_same_day_close_reselected_no_limit_excess_bps",
                  "selected_limit_share_pct",
                  "candidate_limit_share_pct",
              ]
              daily = frame.groupby("date", sort=True)[columns].mean()
              def stats(values):
                  values = values.dropna()
                  n = len(values)
                  std = values.std(ddof=1)
                  return {
                      "days": n,
                      "mean": float(values.mean()),
                      "std": float(std),
                      "t_stat": float(values.mean() / (std / np.sqrt(n))),
                      "positive_day_pct": float(values.gt(0).mean() * 100),
                      "p05": float(values.quantile(0.05)),
                      "median": float(values.median()),
                      "p95": float(values.quantile(0.95)),
                  }
              result = {column: stats(daily[column]) for column in columns}
              result["correlations"] = {
                  "excess_vs_all_a_background": float(daily[
                      "entry_to_same_day_close_excess_bps"
                  ].corr(daily["entry_to_same_day_close_pool_raw_bps"])),
                  "excess_vs_candidate_limit_share": float(daily[
                      "entry_to_same_day_close_excess_bps"
                  ].corr(daily["candidate_limit_share_pct"])),
                  "excess_vs_selected_limit_share": float(daily[
                      "entry_to_same_day_close_excess_bps"
                  ].corr(daily["selected_limit_share_pct"])),
              }
              result["best_days"] = daily.nlargest(
                  5, "entry_to_same_day_close_excess_bps"
              )["entry_to_same_day_close_excess_bps"].to_dict()
              result["worst_days"] = daily.nsmallest(
                  5, "entry_to_same_day_close_excess_bps"
              )["entry_to_same_day_close_excess_bps"].to_dict()
              print(json.dumps(result, ensure_ascii=False, indent=2))
              PY
          volumeMounts:
            - {name: output, mountPath: /mnt/output}
          resources:
            requests: {cpu: "1", memory: 4Gi}
            limits: {cpu: "2", memory: 8Gi}
