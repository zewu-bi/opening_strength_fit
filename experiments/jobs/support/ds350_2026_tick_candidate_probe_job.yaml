apiVersion: batch/v1
kind: Job
metadata:
  name: os-ds350-2026-tick-candidate-probe-v1
  namespace: bizewu
  labels: {app: os-ds350-2026-tick-candidate-probe-v1}
spec:
  activeDeadlineSeconds: 7200
  backoffLimit: 1
  ttlSecondsAfterFinished: 172800
  template:
    metadata:
      labels: {app: os-ds350-2026-tick-candidate-probe-v1}
    spec:
      restartPolicy: Never
      imagePullSecrets: [{name: highfort}]
      containers:
        - name: probe
          image: registry.corp.highfortfunds.com/bizewu/opening-strength-fit:20260731-raw-source-42ec6bdd
          imagePullPolicy: Always
          workingDir: /app/opening_strength_fit
          envFrom:
            - secretRef: {name: opening-strength-clickhouse}
          command: [/bin/bash, -lc]
          args:
            - |
              set -euo pipefail
              python - <<'PY'
              import os

              from opening_strength_fit.clickhouse_ticks import get_tick_client

              client = get_tick_client(
                  username=os.environ["CLICKHOUSE_USER"],
                  password=os.environ["CLICKHOUSE_PASSWORD"],
                  host=os.environ["CLICKHOUSE_HOST"],
                  port=int(os.environ.get("CLICKHOUSE_PORT", "8123")),
              )
              candidates = [
                  "tick",
                  "tick_buff",
                  "tick_lv1",
                  "tick_realtime",
                  "tick_test",
                  "tick_withdraw_stage",
              ]
              required = {"TradingDay", "Symbol", "ExchTimeOffsetUs"}
              for name in candidates:
                  columns = client.query_df(
                      """
                      select name, type
                      from system.columns
                      where database = 'stock' and table = {table:String}
                      order by position
                      """,
                      parameters={"table": name},
                  )
                  column_set = set(columns["name"].astype(str))
                  print(f"\nstock.{name}: columns={len(columns)} required={required <= column_set}")
                  if not required <= column_set:
                      continue
                  frame = client.query_df(
                      f"""
                      select
                          TradingDay as date,
                          count() as rows,
                          uniqExact(Symbol) as symbols,
                          min(ExchTimeOffsetUs) as min_offset,
                          max(ExchTimeOffsetUs) as max_offset
                      from stock.{name}
                      where TradingDay in [
                          toDate('2026-03-19'),
                          toDate('2026-04-23'),
                          toDate('2026-05-07')
                      ]
                      group by TradingDay
                      order by TradingDay
                      """
                  )
                  print(frame.to_string(index=False))
              PY
          resources:
            requests: {cpu: "1", memory: 2Gi}
            limits: {cpu: "2", memory: 4Gi}
