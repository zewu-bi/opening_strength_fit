apiVersion: batch/v1
kind: Job
metadata:
  name: os-ds350-future-retrain-v1
  namespace: bizewu
  labels:
    app: os-ds350-future-retrain-v1
spec:
  activeDeadlineSeconds: 1209600
  backoffLimit: 2
  completionMode: Indexed
  completions: 32
  parallelism: 16
  ttlSecondsAfterFinished: 172800
  template:
    metadata:
      labels:
        app: os-ds350-future-retrain-v1
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: highfort
      nodeSelector:
        has_gpu: "true"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: [node6, node7, node8, node12, node17, node19, node20, node22, node24, node25, node26, node27, node28]
                  - key: gpu_model
                    operator: In
                    values: [A100-80, H100-80, H20]
      tolerations:
        - key: has_gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      volumes:
        - name: output
          persistentVolumeClaim:
            claimName: bizewu-private-data
        - name: audit-code
          configMap:
            name: os-ds350-future-info-audit-code-v1
      containers:
        - name: trainer
          image: registry.corp.highfortfunds.com/bizewu/opening-strength-fit@sha256:8eb66ef731709af980fa7e047ccb59748c0ed8f4ed36aa3460ee9b1f4a9fe0b6
          imagePullPolicy: Always
          workingDir: /app/opening_strength_fit
          env:
            - name: JOB_COMPLETION_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: "metadata.annotations['batch.kubernetes.io/job-completion-index']"
          command: [/bin/bash, -lc]
          args:
            - |
              set -euo pipefail
              INDEX="${JOB_COMPLETION_INDEX:?missing JOB_COMPLETION_INDEX}"
              FOLD=$((INDEX % 8))
              CASE_INDEX=$(((INDEX / 8) % 2))
              PURGE=$((INDEX / 16))
              CASES=(w0931_0940_h1m w0931_0940_hclose)
              TEST_STARTS=(2022-01 2022-07 2023-01 2023-07 2024-01 2024-07 2025-01 2025-07)
              TEST_ENDS=(2022-06 2022-12 2023-06 2023-12 2024-06 2024-12 2025-06 2025-12)
              CASE="${CASES[${CASE_INDEX}]}"
              TEST_START="${TEST_STARTS[${FOLD}]}"
              TEST_END="${TEST_ENDS[${FOLD}]}"
              if [ "${CASE}" = "w0931_0940_h1m" ]; then
                LABEL_SUFFIX=h1m_v2
              else
                LABEL_SUFFIX=hclose_v1
              fi
              FEATURE_ROOT=/mnt/output/opening_strength_fit/datasets/opening_0931_0940_features_350
              LABEL_ROOT="/mnt/output/opening_strength_fit/datasets/opening_0931_0940_labels_${LABEL_SUFFIX}"
              OUT="/mnt/output/opening_strength_fit/nn/audits/ds350_future_info_v1/${CASE}/purge${PURGE}/month_${TEST_START}"
              CONFIG=/tmp/ds350_future_info_audit.toml

              cp experiments/runs/nn_ds350_label15_36m_grouped_gated_v2_mse_max30_v1.toml "${CONFIG}"
              sed -i "/^\[window\]$/a purge_train_sessions = ${PURGE}" "${CONFIG}"
              sed -i "/^\[output\]$/a write_unfiltered_predictions = true" "${CONFIG}"
              if [ -f "${OUT}/_SUCCESS" ] && [ -f "${OUT}/predictions.parquet" ] && [ -f "${OUT}/predictions_unfiltered.parquet" ]; then
                echo "output already complete, skipping ${OUT}"
                exit 0
              fi

              exec osf-train \
                --config "${CONFIG}" \
                --feature-input "${FEATURE_ROOT}" \
                --label-input "${LABEL_ROOT}" \
                --run-id "future_info_audit_${CASE}_purge${PURGE}" \
                --rolling-monthly \
                --train-months 36 \
                --test-months 6 \
                --test-stride-months 6 \
                --test-start-month "${TEST_START}" \
                --test-end-month "${TEST_END}" \
                --output-dir "${OUT}"
          volumeMounts:
            - name: output
              mountPath: /mnt/output
            - name: audit-code
              mountPath: /usr/local/lib/python3.12/site-packages/opening_strength_fit/training_modeling.py
              subPath: training_modeling.py
          resources:
            requests:
              cpu: "8"
              memory: 256Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "16"
              memory: 384Gi
              nvidia.com/gpu: "1"
