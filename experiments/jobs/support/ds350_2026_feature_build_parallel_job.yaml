apiVersion: batch/v1
kind: Job
metadata:
  name: os-ds-feat350-w0931-0940-2026-v2
  namespace: bizewu
  labels: {app: os-ds-feat350-w0931-0940-2026-v2}
spec:
  activeDeadlineSeconds: 432000
  backoffLimit: 2
  ttlSecondsAfterFinished: 172800
  template:
    metadata:
      labels: {app: os-ds-feat350-w0931-0940-2026-v2}
    spec:
      restartPolicy: Never
      imagePullSecrets: [{name: highfort}]
      volumes:
        - name: output
          persistentVolumeClaim: {claimName: bizewu-private-data}
        - name: build-code
          configMap:
            name: os-ds350-2026-feature-build-code-v1
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: kubernetes.io/hostname, operator: NotIn, values: [node7, node8]}
      containers:
        - name: builder
          image: registry.corp.highfortfunds.com/bizewu/opening-strength-fit:20260804-training-datasets-v2
          imagePullPolicy: Always
          workingDir: /app/opening_strength_fit
          command: [/bin/bash, -lc]
          args:
            - |
              set -euo pipefail
              CONFIG=/tmp/opening_0931_0940_features_350_2026.toml
              cp experiments/runs/opening_0931_0940_features_350.toml "${CONFIG}"
              sed -E -i 's/^years = \[.*\]/years = [2025, 2026]/' "${CONFIG}"
              exec osf-build-training-datasets \
                --config "${CONFIG}" \
                --kind features \
                --year 2026 \
                --date-start 2026-01-01 \
                --date-end 2026-06-30 \
                --workers 6 \
                --overwrite
          volumeMounts:
            - {name: output, mountPath: /mnt/output}
            - {name: build-code, mountPath: /usr/local/lib/python3.12/site-packages/opening_strength_fit/commands/training_dataset_build.py, subPath: training_dataset_build.py}
          resources:
            requests: {cpu: "8", memory: 128Gi}
            limits: {cpu: "24", memory: 384Gi}
