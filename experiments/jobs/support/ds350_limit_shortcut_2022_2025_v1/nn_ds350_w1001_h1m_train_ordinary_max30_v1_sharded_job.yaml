apiVersion: batch/v1
kind: Job
metadata:
  name: os-nn-ds350-ordtrain-w1001-h1m-v1
  namespace: bizewu
  labels: {app: os-nn-ds350-ordtrain-w1001-h1m-v1, osf-exp: ds350-w1001-h1m-train-ordinary-v1, osf-case: w1001_1010_h1m}
spec:
  activeDeadlineSeconds: 1209600
  backoffLimit: 8
  completionMode: Indexed
  completions: 8
  parallelism: 8
  suspend: true
  ttlSecondsAfterFinished: 172800
  template:
    metadata:
      labels: {app: os-nn-ds350-ordtrain-w1001-h1m-v1, osf-exp: ds350-w1001-h1m-train-ordinary-v1, osf-case: w1001_1010_h1m}
    spec:
      restartPolicy: Never
      imagePullSecrets: [{name: highfort}]
      volumes:
        - name: output
          persistentVolumeClaim: {claimName: bizewu-private-data}
        - name: code
          configMap: {name: os-ds350-1m-experiment-code-v1}
      nodeSelector: {has_gpu: "true"}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: [node6, node7, node8, node12, node16, node17, node19, node20, node22, node24, node25, node26, node27, node28]
                  - key: gpu_model
                    operator: In
                    values: [A100-80, H100-80, H20]
      tolerations:
        - {key: has_gpu, operator: Equal, value: "true", effect: NoSchedule}
      containers:
        - name: trainer
          image: registry.corp.highfortfunds.com/bizewu/opening-strength-fit@sha256:8eb66ef731709af980fa7e047ccb59748c0ed8f4ed36aa3460ee9b1f4a9fe0b6
          imagePullPolicy: Always
          workingDir: /app/opening_strength_fit
          env:
            - name: JOB_COMPLETION_INDEX
              valueFrom:
                fieldRef: {fieldPath: "metadata.annotations['batch.kubernetes.io/job-completion-index']"}
          command: [/bin/bash, -lc]
          args:
            - |
              set -euo pipefail
              FEATURE_ROOT="/mnt/output/opening_strength_fit/datasets/opening_1001_1010_features_350"
              LABEL_ROOT="/mnt/output/opening_strength_fit/datasets/opening_1001_1010_labels_h1m_v2"
              RAW_ROOT="/mnt/output/opening_strength_fit/cache/opening_1001_1010_raw_source"
              TEST_STARTS=(2022-01 2022-07 2023-01 2023-07 2024-01 2024-07 2025-01 2025-07)
              TEST_ENDS=(2022-06 2022-12 2023-06 2023-12 2024-06 2024-12 2025-06 2025-12)
              INDEX="${JOB_COMPLETION_INDEX:?missing JOB_COMPLETION_INDEX}"
              TEST_START="${TEST_STARTS[${INDEX}]}"
              TEST_END="${TEST_ENDS[${INDEX}]}"
              RUN_ID="nn_ds350_w1001_1010_h1m_train_ordinary_36m_grouped_gated_v2_mse_max30_v1"
              ROOT="/mnt/output/opening_strength_fit/nn/nn_ds350_w1001_h1m_train_ordinary_36m_grouped_gated_v2_mse_max30_v1"
              OUT="${ROOT}/w1001_1010_h1m/month_${TEST_START}"
              CONFIG="/tmp/${RUN_ID}.toml"

              for YEAR in 2019 2020 2021 2022 2023 2024 2025; do
                test -f "${FEATURE_ROOT}/year=${YEAR}/_SUCCESS"
                test -f "${LABEL_ROOT}/year=${YEAR}/_SUCCESS"
                test -f "${RAW_ROOT}/year=${YEAR}/daily_reference.parquet"
              done
              if [ -f "${OUT}/_SUCCESS" ] && [ -f "${OUT}/metrics_by_year.csv" ] && [ -f "${OUT}/predictions.parquet" ]; then
                echo "output already complete, skipping ${OUT}"
                exit 0
              fi

              cp experiments/runs/nn_ds350_label15_36m_grouped_gated_v2_mse_max30_v1.toml "${CONFIG}"
              {
                printf '\n[training_filter]\n'
                printf 'enabled = true\n'
                printf 'mode = "ordinary_daily_limit"\n'
                printf 'daily_reference_root = "%s"\n' "${RAW_ROOT}"
              } >> "${CONFIG}"

              exec osf-train \
                --config "${CONFIG}" \
                --feature-input "${FEATURE_ROOT}" \
                --label-input "${LABEL_ROOT}" \
                --run-id "${RUN_ID}" \
                --rolling-monthly \
                --train-months 36 \
                --test-months 6 \
                --test-stride-months 6 \
                --test-start-month "${TEST_START}" \
                --test-end-month "${TEST_END}" \
                --output-dir "${OUT}"
          volumeMounts:
            - {name: output, mountPath: /mnt/output}
            - name: code
              mountPath: /usr/local/lib/python3.12/site-packages/opening_strength_fit/training_modeling.py
              subPath: training_modeling.py
          resources:
            requests: {cpu: "8", memory: 256Gi, nvidia.com/gpu: "1"}
            limits: {cpu: "16", memory: 384Gi, nvidia.com/gpu: "1"}
