# osf-contract: mounted-script-entrypoint
apiVersion: batch/v1
kind: Job
metadata:
  name: os-ds350-label-extremes-w0931-v1
  namespace: bizewu
  labels: {app: os-ds350-label-extremes-w0931-v1}
spec:
  activeDeadlineSeconds: 86400
  backoffLimit: 1
  ttlSecondsAfterFinished: 172800
  template:
    metadata:
      labels: {app: os-ds350-label-extremes-w0931-v1}
    spec:
      restartPolicy: Never
      imagePullSecrets: [{name: highfort}]
      nodeSelector: {has_gpu: "true"}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: [node6, node7, node8, node12, node16, node17, node19, node20, node22, node24, node25, node26, node27, node28]
      tolerations:
        - {key: has_gpu, operator: Equal, value: "true", effect: NoSchedule}
      volumes:
        - name: output
          persistentVolumeClaim: {claimName: bizewu-private-data}
        - name: script
          configMap: {name: os-ds350-label-extremes-code-v1}
      containers:
        - name: analyzer
          image: registry.corp.highfortfunds.com/bizewu/opening-strength-fit@sha256:8eb66ef731709af980fa7e047ccb59748c0ed8f4ed36aa3460ee9b1f4a9fe0b6
          imagePullPolicy: Always
          workingDir: /app/opening_strength_fit
          command: [/bin/bash, -lc]
          args:
            - |
              set -euo pipefail
              exec python /opt/analysis/analyze_ds350_label_extremes.py \
                --h1m-root /mnt/output/opening_strength_fit/datasets/opening_0931_0940_labels_h1m_v2 \
                --h1m-clip3-root /mnt/output/opening_strength_fit/datasets/opening_0931_0940_labels_h1m_clip3_v1 \
                --h1m-pure-root /mnt/output/opening_strength_fit/datasets/opening_0931_0940_labels_h1m_pure_short_v1 \
                --hclose-root /mnt/output/opening_strength_fit/datasets/opening_0931_0940_labels_hclose_v1 \
                --hclose-clip3-root /mnt/output/opening_strength_fit/datasets/opening_0931_0940_labels_hclose_clip3_v1 \
                --hclose-pure-root /mnt/output/opening_strength_fit/datasets/opening_0931_0940_labels_hclose_pure_short_v1 \
                --raw-root /mnt/output/opening_strength_fit/cache/opening_0931_0940_raw_source \
                --output-dir /mnt/output/opening_strength_fit/analysis/ds350_w0931_label_extremes_v1 \
                --year-start 2022 \
                --year-end 2025
          volumeMounts:
            - {name: output, mountPath: /mnt/output}
            - {name: script, mountPath: /opt/analysis/analyze_ds350_label_extremes.py, subPath: analyze_ds350_label_extremes.py}
          resources:
            requests: {cpu: "8", memory: 64Gi}
            limits: {cpu: "16", memory: 192Gi}
