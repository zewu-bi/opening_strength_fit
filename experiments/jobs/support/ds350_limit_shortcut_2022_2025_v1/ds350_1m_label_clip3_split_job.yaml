# osf-contract: archived-legacy-job
apiVersion: v1
kind: List
items:
  - &split-job
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: os-ds350-clip3-labelsplit-w0931-v1
      namespace: bizewu
      labels: {app: os-ds350-clip3-labelsplit-w0931-v1, osf-exp: ds350-1m-label-clip3-v1, osf-window: "0931_0940"}
    spec: &split-spec
      activeDeadlineSeconds: 86400
      backoffLimit: 2
      completionMode: Indexed
      completions: 7
      parallelism: 2
      ttlSecondsAfterFinished: 172800
      template: &split-template
        metadata:
          labels: {app: os-ds350-clip3-labelsplit-w0931-v1, osf-exp: ds350-1m-label-clip3-v1, osf-window: "0931_0940"}
        spec:
          restartPolicy: Never
          imagePullSecrets: [{name: highfort}]
          volumes:
            - name: output
              persistentVolumeClaim: {claimName: bizewu-private-data}
            - name: code
              configMap: {name: os-ds350-1m-experiment-code-v1}
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - {key: kubernetes.io/hostname, operator: NotIn, values: [node7, node8]}
          containers:
            - name: splitter
              image: registry.corp.highfortfunds.com/bizewu/opening-strength-fit@sha256:8eb66ef731709af980fa7e047ccb59748c0ed8f4ed36aa3460ee9b1f4a9fe0b6
              imagePullPolicy: Always
              workingDir: /app/opening_strength_fit
              env:
                - name: JOB_COMPLETION_INDEX
                  valueFrom:
                    fieldRef: {fieldPath: "metadata.annotations['batch.kubernetes.io/job-completion-index']"}
                - name: WINDOW
                  valueFrom:
                    fieldRef: {fieldPath: "metadata.labels['osf-window']"}
              command: [/bin/bash, -lc]
              args:
                - |
                  set -euo pipefail
                  YEARS=(2019 2020 2021 2022 2023 2024 2025)
                  YEAR="${YEARS[${JOB_COMPLETION_INDEX:?missing JOB_COMPLETION_INDEX}]}"
                  CONFIG="/tmp/opening_${WINDOW}_labels_horizon_split_clip3_v1.toml"
                  cp "experiments/runs/opening_${WINDOW}_labels_horizon_split.toml" "${CONFIG}"
                  sed -i 's#h{horizon_minutes}m_v2#h{horizon_minutes}m_clip3_v1#g' "${CONFIG}"
                  printf '\nmixed_clip_std_multiple = 3.0\n' >> "${CONFIG}"
                  exec osf-split-horizon-labels --config "${CONFIG}" --year "${YEAR}" --overwrite
              volumeMounts:
                - {name: output, mountPath: /mnt/output}
                - name: code
                  mountPath: /usr/local/lib/python3.12/site-packages/opening_strength_fit/commands/horizon_label_split.py
                  subPath: horizon_label_split.py
              resources:
                requests: {cpu: "4", memory: 8Gi}
                limits: {cpu: "12", memory: 32Gi}
