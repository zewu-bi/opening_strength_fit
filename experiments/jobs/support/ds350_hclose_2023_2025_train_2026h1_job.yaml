apiVersion: batch/v1
kind: Job
metadata:
  name: os-nn-ds350-hclose-2026h1-v1
  namespace: bizewu
  labels: {app: os-nn-ds350-hclose-2026h1-v1}
spec:
  activeDeadlineSeconds: 604800
  backoffLimit: 2
  ttlSecondsAfterFinished: 172800
  template:
    metadata:
      labels: {app: os-nn-ds350-hclose-2026h1-v1}
    spec:
      restartPolicy: Never
      imagePullSecrets: [{name: highfort}]
      nodeSelector:
        has_gpu: "true"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: kubernetes.io/hostname, operator: NotIn, values: [node6, node7, node8, node12, node17, node19, node20, node22, node24, node25, node26, node27, node28]}
                  - {key: gpu_model, operator: In, values: [A100-80, H100-80, H20]}
      tolerations:
        - key: has_gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      volumes:
        - name: output
          persistentVolumeClaim: {claimName: bizewu-private-data}
        - name: training-code
          configMap:
            name: os-ds350-hclose-2026h1-training-code-v1
      containers:
        - name: trainer
          image: registry.corp.highfortfunds.com/bizewu/opening-strength-fit@sha256:8eb66ef731709af980fa7e047ccb59748c0ed8f4ed36aa3460ee9b1f4a9fe0b6
          imagePullPolicy: Always
          workingDir: /app/opening_strength_fit
          command: [/bin/bash, -lc]
          args:
            - |
              set -euo pipefail
              FEATURE_ROOT=/mnt/output/opening_strength_fit/datasets/opening_0931_0940_features_350
              LABEL_ROOT=/mnt/output/opening_strength_fit/datasets/opening_0931_0940_labels_hclose_v1
              OUT=/mnt/output/opening_strength_fit/nn/holdout/nn_ds350_w0931_hclose_train2023_2025_test2026h1_purge1_v1
              CONFIG=/tmp/nn_ds350_hclose_2026h1.toml

              cp experiments/runs/nn_ds350_label15_36m_grouped_gated_v2_mse_max30_v1.toml "${CONFIG}"
              sed -i '/^\[window\]$/a purge_train_sessions = 1' "${CONFIG}"
              sed -i '/^\[output\]$/a write_unfiltered_predictions = true' "${CONFIG}"

              exec osf-train \
                --config "${CONFIG}" \
                --feature-input "${FEATURE_ROOT}" \
                --label-input "${LABEL_ROOT}" \
                --run-id nn_ds350_w0931_hclose_train2023_2025_test2026h1_purge1_v1 \
                --rolling-monthly \
                --train-months 36 \
                --test-months 6 \
                --test-stride-months 6 \
                --test-start-month 2026-01 \
                --test-end-month 2026-06 \
                --output-dir "${OUT}"
          volumeMounts:
            - name: output
              mountPath: /mnt/output
            - name: training-code
              mountPath: /usr/local/lib/python3.12/site-packages/opening_strength_fit/training_modeling.py
              subPath: training_modeling.py
          resources:
            requests: {cpu: "8", memory: 256Gi, nvidia.com/gpu: "1"}
            limits: {cpu: "16", memory: 384Gi, nvidia.com/gpu: "1"}
