apiVersion: batch/v1
kind: Job
metadata:
  name: os-long-label-raw-w0931-1010-v1
  namespace: bizewu
  labels: {app: os-long-label-raw-w0931-1010-v1}
spec:
  activeDeadlineSeconds: 259200
  backoffLimit: 2
  completionMode: Indexed
  completions: 7
  parallelism: 7
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {app: os-long-label-raw-w0931-1010-v1}
    spec:
      restartPolicy: Never
      imagePullSecrets: [{name: highfort}]
      volumes:
        - name: output
          persistentVolumeClaim: {claimName: bizewu-private-data}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: kubernetes.io/hostname, operator: NotIn, values: [node7, node8]}
      containers:
        - name: builder
          image: registry.corp.highfortfunds.com/bizewu/opening-strength-fit@sha256:f04ef3ab7372000162e1b92bf86e96f5f6e0e36f15c163d75c9a3c1cc554ab09
          imagePullPolicy: Always
          workingDir: /app/opening_strength_fit
          envFrom:
            - secretRef: {name: opening-strength-clickhouse}
          env:
            - name: JOB_COMPLETION_INDEX
              valueFrom:
                fieldRef: {fieldPath: "metadata.annotations['batch.kubernetes.io/job-completion-index']"}
          command: [/bin/bash, -lc]
          args:
            - |
              set -euo pipefail
              YEARS=(2019 2020 2021 2022 2023 2024 2025)
              YEAR="${YEARS[${JOB_COMPLETION_INDEX}]}"
              exec osf-build-long-label-raw-source --config experiments/runs/opening_0931_1010_long_label_raw_source_v1.toml --year "${YEAR}" --overwrite
          volumeMounts: [{name: output, mountPath: /mnt/output}]
          resources:
            requests: {cpu: "2", memory: 8Gi}
            limits: {cpu: "8", memory: 24Gi}
