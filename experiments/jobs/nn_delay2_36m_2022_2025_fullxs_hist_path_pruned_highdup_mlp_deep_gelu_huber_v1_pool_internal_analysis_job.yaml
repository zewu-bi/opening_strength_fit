apiVersion: batch/v1
kind: Job
metadata:
  name: os-analyze-nn-deep-gelu
  namespace: bizewu
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: highfort
      volumes:
        - name: opening-strength-output
          persistentVolumeClaim:
            claimName: bizewu-private-data
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: NotIn
                  values:
                    - node7
                    - node8
                    - node20
                    - node21
      containers:
        - name: opening-strength-fit
          image: registry.corp.highfortfunds.com/bizewu/opening-strength-fit:20260626-nn-scan-v1
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: opening-strength-clickhouse
            - secretRef:
                name: xy-fit-ceph-credentials
          workingDir: /app/opening_strength_fit
          command:
            - /bin/bash
            - -lc
            - |
              set -euo pipefail
              WAIT_PATH_TIMEOUT_SECONDS=86400
              WAIT_PATH_INTERVAL_SECONDS=120
              WAIT_PATH_STARTED=${SECONDS}
              WAIT_PATHS=("/mnt/output/opening_strength_fit/runs/models/nn/nn_delay2_36m_2022_2025_fullxs_hist_path_pruned_highdup_mlp_deep_gelu_huber_v1/month_2022-01/metrics_by_year.csv" "/mnt/output/opening_strength_fit/runs/models/nn/nn_delay2_36m_2022_2025_fullxs_hist_path_pruned_highdup_mlp_deep_gelu_huber_v1/month_2022-07/metrics_by_year.csv" "/mnt/output/opening_strength_fit/runs/models/nn/nn_delay2_36m_2022_2025_fullxs_hist_path_pruned_highdup_mlp_deep_gelu_huber_v1/month_2023-01/metrics_by_year.csv" "/mnt/output/opening_strength_fit/runs/models/nn/nn_delay2_36m_2022_2025_fullxs_hist_path_pruned_highdup_mlp_deep_gelu_huber_v1/month_2023-07/metrics_by_year.csv" "/mnt/output/opening_strength_fit/runs/models/nn/nn_delay2_36m_2022_2025_fullxs_hist_path_pruned_highdup_mlp_deep_gelu_huber_v1/month_2024-01/metrics_by_year.csv" "/mnt/output/opening_strength_fit/runs/models/nn/nn_delay2_36m_2022_2025_fullxs_hist_path_pruned_highdup_mlp_deep_gelu_huber_v1/month_2024-07/metrics_by_year.csv" "/mnt/output/opening_strength_fit/runs/models/nn/nn_delay2_36m_2022_2025_fullxs_hist_path_pruned_highdup_mlp_deep_gelu_huber_v1/month_2025-01/metrics_by_year.csv" "/mnt/output/opening_strength_fit/runs/models/nn/nn_delay2_36m_2022_2025_fullxs_hist_path_pruned_highdup_mlp_deep_gelu_huber_v1/month_2025-07/metrics_by_year.csv")
              for WAIT_PATH in "${WAIT_PATHS[@]}"; do
                until [ -f "${WAIT_PATH}" ]; do
                  if [ $((SECONDS - WAIT_PATH_STARTED)) -ge "${WAIT_PATH_TIMEOUT_SECONDS}" ]; then
                    echo "timed out waiting for dependency file: ${WAIT_PATH}" >&2
                    exit 1
                  fi
                  echo "waiting for dependency file: ${WAIT_PATH}"
                  sleep "${WAIT_PATH_INTERVAL_SECONDS}"
                done
                echo "dependency file is ready: ${WAIT_PATH}"
              done
              rm -rf /mnt/output/opening_strength_fit/runs/models/nn/nn_delay2_36m_2022_2025_fullxs_hist_path_pruned_highdup_mlp_deep_gelu_huber_v1/analysis/pool_internal_top100
              mkdir -p /mnt/output/opening_strength_fit/runs/models/nn/nn_delay2_36m_2022_2025_fullxs_hist_path_pruned_highdup_mlp_deep_gelu_huber_v1/analysis/pool_internal_top100
              mkdir -p /mnt/output/opening_strength_fit/runs/models/nn/nn_delay2_36m_2022_2025_fullxs_hist_path_pruned_highdup_mlp_deep_gelu_huber_v1/analysis/pool_internal_top100/reports
              osf-analyze-pool-internal-top100 \
                --predictions \
                /mnt/output/opening_strength_fit/runs/models/nn/nn_delay2_36m_2022_2025_fullxs_hist_path_pruned_highdup_mlp_deep_gelu_huber_v1 \
                --next-close-label-input \
                /mnt/output/opening_strength_fit/cache/opening_2013_2025_next_close_labels_v1 \
                --run-id \
                nn_delay2_36m_2022_2025_fullxs_hist_path_pruned_highdup_mlp_deep_gelu_huber_v1 \
                --variant \
                nn_deep_gelu_huber \
                --output-dir \
                /mnt/output/opening_strength_fit/runs/models/nn/nn_delay2_36m_2022_2025_fullxs_hist_path_pruned_highdup_mlp_deep_gelu_huber_v1/analysis/pool_internal_top100 \
                --report-dir \
                /mnt/output/opening_strength_fit/runs/models/nn/nn_delay2_36m_2022_2025_fullxs_hist_path_pruned_highdup_mlp_deep_gelu_huber_v1/analysis/pool_internal_top100/reports \
                --plot-prefix \
                nn_deep_gelu_huber \
                --plot-variant-label \
                '2022-2025 NN deep GELU Huber' \
                --plot-period \
                quarter \
                --top-n \
                100 \
                --pool-date-lag-sessions \
                0 \
                --pool \
                universe \
                --pool \
                L
          volumeMounts:
            - name: opening-strength-output
              mountPath: /mnt/output
          resources:
            requests:
              cpu: "8"
              memory: 256Gi
            limits:
              cpu: "16"
              memory: 384Gi
