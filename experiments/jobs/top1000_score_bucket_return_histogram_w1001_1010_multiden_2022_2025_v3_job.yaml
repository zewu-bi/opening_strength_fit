apiVersion: batch/v1
kind: Job
metadata:
  name: os-top1000-hist-w1001-multiden-v3
  namespace: bizewu
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: highfort
      nodeSelector:
        kubernetes.io/hostname: node15
      volumes:
        - name: opening-strength-output
          persistentVolumeClaim:
            claimName: bizewu-private-data
        - name: analysis-script
          configMap:
            name: os-top1000-rank-bucket-script-v3
      containers:
        - name: opening-strength-fit
          image: registry.corp.highfortfunds.com/bizewu/opening-strength-fit:20260721-clock6-multiden-v1
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: opening-strength-clickhouse
            - secretRef:
                name: xy-fit-ceph-credentials
          workingDir: /app/opening_strength_fit
          command:
            - /bin/bash
            - -lc
            - |
              set -euo pipefail
              COMPAT_LABEL_ROOT=/tmp/next-close-labels
              SOURCE_LABEL_ROOT=/mnt/output/opening_strength_fit/cache/opening_2019_2025_next_close_labels_clock6_1001_1010_v1
              mkdir -p "${COMPAT_LABEL_ROOT}"
              for YEAR in 2019 2020 2021 2022 2023 2024 2025; do
                ln -sf \
                  "${SOURCE_LABEL_ROOT}/opening_${YEAR}_next_close_labels_clock6_1001_1010_v1.parquet" \
                  "${COMPAT_LABEL_ROOT}/opening_${YEAR}_next_close_labels_v1.parquet"
              done
              python /opt/analysis/run_top1000_rank_bucket_diagnostics.py \
                --prediction-root /mnt/output/opening_strength_fit/nn \
                --next-label-root "${COMPAT_LABEL_ROOT}" \
                --pool-path lml.bzw@ssd/data/pool_L.parquet \
                --output-dir /mnt/output/opening_strength_fit/runs/analyses/rank-bucket/top1000_score_bucket_return_histogram_w1001_1010_multiden_2022_2025_v3 \
                --variant w1001_1010_multiden \
                --run-id nn_delay6_clock_state_36m_2022_2025_w1001_1010_auction_pruned_multi_denominator_grouped_gated_v2_mech_v3_gelu_mse_v1 \
                --top1000-bucket-return-histogram-only \
                --histogram-bin-width-bps 100
          volumeMounts:
            - name: opening-strength-output
              mountPath: /mnt/output
            - name: analysis-script
              mountPath: /opt/analysis
              readOnly: true
          resources:
            requests:
              cpu: "8"
              memory: 192Gi
            limits:
              cpu: "16"
              memory: 320Gi
