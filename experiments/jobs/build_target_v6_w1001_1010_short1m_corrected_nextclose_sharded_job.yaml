apiVersion: batch/v1
kind: Job
metadata:
  name: os-target-v6-1001-1010-short1m
  namespace: bizewu
  labels:
    app: os-target-v6-1001-1010-short1m
spec:
  backoffLimit: 0
  completionMode: Indexed
  completions: 7
  parallelism: 7
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: os-target-v6-1001-1010-short1m
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: highfort
      volumes:
        - name: opening-strength-output
          persistentVolumeClaim:
            claimName: bizewu-private-data
        - name: run-config
          configMap:
            name: os-target-v6-1001-1010-short1m-config
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - node7
                      - node8
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: os-target-v6-1001-1010-short1m
      containers:
        - name: opening-strength-fit
          image: registry.corp.highfortfunds.com/bizewu/opening-strength-fit:20260731-corrected-label-matrix
          imagePullPolicy: Always
          workingDir: /app/opening_strength_fit
          env:
            - name: JOB_COMPLETION_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: "metadata.annotations['batch.kubernetes.io/job-completion-index']"
          command:
            - /bin/bash
            - -lc
            - |
              set -euo pipefail
              YEARS=(2019 2020 2021 2022 2023 2024 2025)
              INDEX="${JOB_COMPLETION_INDEX:-}"
              if [ -z "${INDEX}" ] || [ "${INDEX}" -lt 0 ] || [ "${INDEX}" -ge "${#YEARS[@]}" ]; then
                echo "invalid JOB_COMPLETION_INDEX=${INDEX}" >&2
                exit 1
              fi
              YEAR="${YEARS[$INDEX]}"
              INPUT="/mnt/output/opening_strength_fit/cache/opening_2019_2025_label_v6_decision_clock_state_clock6_1001_1010_from_start_auction_reuse_mcap_lag1/opening_${YEAR}_label_v6_decision_clock_state_clock6_1001_1010_from_start_auction_reuse_mcap_lag1.parquet"
              OUTPUT="/mnt/output/opening_strength_fit/cache/opening_2019_2025_target_v6_w1001_1010_short1m_corrected_nextclose/opening_${YEAR}_target_v6_w1001_1010_short1m_corrected_nextclose.parquet"
              LONG_INPUT="/mnt/output/opening_strength_fit/cache/opening_2019_2025_next_close_decision_clock_state_clock6_1001_1010/opening_${YEAR}_next_close_decision_clock_state_clock6_1001_1010.parquet"
              TRACE_DIR="/mnt/output/opening_strength_fit/cache_builds/build_target_v6_w1001_1010_short1m_corrected_nextclose/year=${YEAR}"
              WAIT_STARTED=${SECONDS}
              for WAIT_PATH in "${INPUT}" "${INPUT}.manifest.json" "${INPUT}.lock.done" "${LONG_INPUT}"; do
                until [ -f "${WAIT_PATH}" ]; do
                  if [ $((SECONDS - WAIT_STARTED)) -ge 604800 ]; then
                    echo "timed out waiting for dependency file: ${WAIT_PATH}" >&2
                    exit 1
                  fi
                  echo "waiting for dependency file: ${WAIT_PATH}"
                  sleep 120
                done
                echo "dependency file is ready: ${WAIT_PATH}"
              done
              if [ -f "${OUTPUT}" ] && [ -f "${TRACE_DIR}/target_cache_trace.json" ] && [ -f "${TRACE_DIR}/_SUCCESS" ]; then
                echo "target shard already complete, skipping: ${OUTPUT}"
                exit 0
              fi
              mkdir -p "$(dirname "${OUTPUT}")" "${TRACE_DIR}"
              osf-build-target-label-cache \
                --config experiments/runs/build_target_v6_w1001_1010_short1m_corrected_nextclose.toml \
                --input "${INPUT}" \
                --output "${OUTPUT}" \
                --output-dir "${TRACE_DIR}" \
                --long-label-input "${LONG_INPUT}" \
                --overwrite
              touch "${TRACE_DIR}/_SUCCESS"
          volumeMounts:
            - name: opening-strength-output
              mountPath: /mnt/output
            - name: run-config
              mountPath: /app/opening_strength_fit/experiments/runs/build_target_v6_w1001_1010_short1m_corrected_nextclose.toml
              subPath: build_target_v6_w1001_1010_short1m_corrected_nextclose.toml
          resources:
            requests:
              cpu: "8"
              memory: 256Gi
            limits:
              cpu: "16"
              memory: 512Gi
