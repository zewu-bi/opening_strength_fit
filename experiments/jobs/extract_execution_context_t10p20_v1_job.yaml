apiVersion: batch/v1
kind: Job
metadata:
  name: os-execctx-t10p20-v1
  namespace: bizewu
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: highfort
      volumes:
        - name: opening-strength-output
          persistentVolumeClaim:
            claimName: bizewu-private-data

      containers:
        - name: opening-strength-fit
          image: registry.corp.highfortfunds.com/bizewu/opening-strength-fit:20260703-cap-t10p20-v1
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: xy-fit-ceph-credentials
          workingDir: /app/opening_strength_fit
          command:
            - /bin/bash
            - -lc
            - |
              set -euo pipefail
              WAIT_PATH_TIMEOUT_SECONDS=21600
              WAIT_PATH_INTERVAL_SECONDS=120
              WAIT_PATH_STARTED=${SECONDS}
              WAIT_PATHS=("/mnt/output/opening_strength_fit/capacity_audit_lgbm_delay2_36m_2022_2025_fullxs_hist_path_pruned_highdup_split20_t10p20_capacityonly_v1/capacity_audit_selected.csv" "/mnt/output/opening_strength_fit/capacity_audit_nn_delay2_36m_2022_2025_fullxs_hist_path_pruned_highdup_mlp_base_split20_t10p20_capacityonly_v1/capacity_audit_selected.csv")
              for WAIT_PATH in "${WAIT_PATHS[@]}"; do
                until [ -f "${WAIT_PATH}" ]; do
                  if [ $((SECONDS - WAIT_PATH_STARTED)) -ge "${WAIT_PATH_TIMEOUT_SECONDS}" ]; then
                    echo "timed out waiting for dependency file: ${WAIT_PATH}" >&2
                    exit 1
                  fi
                  echo "waiting for dependency file: ${WAIT_PATH}"
                  sleep "${WAIT_PATH_INTERVAL_SECONDS}"
                done
                echo "dependency file is ready: ${WAIT_PATH}"
              done
              exec osf-extract-execution-context \
                --config experiments/runs/extract_execution_context_t10p20_v1.toml \
                --output-dir /mnt/output/opening_strength_fit/extract_execution_context_t10p20_v1
          volumeMounts:
            - name: opening-strength-output
              mountPath: /mnt/output
          resources:
            requests:
              cpu: "8"
              memory: 128Gi

            limits:
              cpu: "16"
              memory: 256Gi
