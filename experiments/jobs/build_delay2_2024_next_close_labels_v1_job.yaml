apiVersion: batch/v1
kind: Job
metadata:
  name: opening-strength-build-delay2-2024-next-close-labels-v1
  namespace: bizewu
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: highfort
      volumes:
        - name: opening-strength-output
          persistentVolumeClaim:
            claimName: bizewu-private-data
      nodeSelector:
        kubernetes.io/hostname: "node8"
      containers:
        - name: opening-strength-fit
          image: registry.corp.highfortfunds.com/bizewu/opening-strength-fit:opening-strength-fit-20260604-next-close-v2
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: opening-strength-clickhouse
          workingDir: /app/opening_strength_fit
          command:
            - python
            - scripts/build_next_close_labels.py
            - --config
            - experiments/runs/build_delay2_2024_next_close_labels_v1.toml
            - --output-dir
            - /mnt/output/opening_strength_fit/cache_builds/build_delay2_2024_next_close_labels_v1
          volumeMounts:
            - name: opening-strength-output
              mountPath: /mnt/output
          resources:
            requests:
              cpu: "4"
              memory: 64Gi

            limits:
              cpu: "8"
              memory: 128Gi

