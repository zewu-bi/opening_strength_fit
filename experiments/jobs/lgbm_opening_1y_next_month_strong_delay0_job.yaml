apiVersion: batch/v1
kind: Job
metadata:
  name: opening-strength-lgbm-opening-1y-next-month-strong-delay0
  namespace: bizewu
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: highfort
      volumes:
        - name: opening-strength-output
          persistentVolumeClaim:
            claimName: bizewu-private-data

      containers:
        - name: opening-strength-fit
          image: registry.corp.highfortfunds.com/bizewu/opening-strength-fit:opening-strength-fit-20260522-lgbm-cpu-v7
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: opening-strength-clickhouse
          workingDir: /app/opening_strength_fit
          command:
            - osf-train
            - --config
            - experiments/runs/lgbm_opening_1y_next_month_strong_delay0.toml
            - --output-dir
            - /mnt/output/opening_strength_fit/lgbm_opening_1y_next_month_strong_delay0
          volumeMounts:
            - name: opening-strength-output
              mountPath: /mnt/output
          resources:
            requests:
              cpu: "8"
              memory: 48Gi

            limits:
              cpu: "16"
              memory: 96Gi

