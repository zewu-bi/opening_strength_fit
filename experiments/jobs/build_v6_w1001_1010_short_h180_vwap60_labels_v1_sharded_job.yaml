apiVersion: batch/v1
kind: Job
metadata:
  name: os-short3m-v6-w1001-1010-v1
  namespace: bizewu
  labels:
    app: os-short3m-v6-w1001-1010-v1
spec:
  backoffLimit: 1
  completionMode: Indexed
  completions: 7
  parallelism: 7
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: os-short3m-v6-w1001-1010-v1
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: highfort
      volumes:
        - name: opening-strength-output
          persistentVolumeClaim:
            claimName: bizewu-private-data
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - node7
                      - node8
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: os-short3m-v6-w1001-1010-v1
      containers:
        - name: opening-strength-fit
          image: registry.corp.highfortfunds.com/bizewu/opening-strength-fit:20260730-short3m-label-v1
          imagePullPolicy: Always
          workingDir: /app/opening_strength_fit
          envFrom:
            - secretRef:
                name: opening-strength-clickhouse
          env:
            - name: JOB_COMPLETION_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: "metadata.annotations['batch.kubernetes.io/job-completion-index']"
          command:
            - /bin/bash
            - -lc
            - |
              set -euo pipefail
              YEARS=(2019 2020 2021 2022 2023 2024 2025)
              INDEX="${JOB_COMPLETION_INDEX:-}"
              if [ -z "${INDEX}" ] || [ "${INDEX}" -lt 0 ] || [ "${INDEX}" -ge "${#YEARS[@]}" ]; then
                echo "invalid JOB_COMPLETION_INDEX=${INDEX}" >&2
                exit 1
              fi
              YEAR="${YEARS[$INDEX]}"
              INPUT_ROOT="/mnt/output/opening_strength_fit/cache/opening_2019_2025_label_v6_decision_clock_state_clock6_1001_1010_from_start_auction_reuse_mcap_lag1"
              OUTPUT_ROOT="/mnt/output/opening_strength_fit/cache/opening_2019_2025_short_label_v6_clock6_1001_1010_h180_vwap60_v1"
              INPUT="${INPUT_ROOT}/opening_${YEAR}_label_v6_decision_clock_state_clock6_1001_1010_from_start_auction_reuse_mcap_lag1.parquet"
              INPUT_MANIFEST="${INPUT}.manifest.json"
              OUTPUT="${OUTPUT_ROOT}/opening_${YEAR}_short_label_v6_clock6_1001_1010_h180_vwap60_v1.parquet"
              OUTPUT_MANIFEST="${OUTPUT}.manifest.json"
              TRACE_DIR="/mnt/output/opening_strength_fit/cache_builds/build_v6_w1001_1010_short_h180_vwap60_labels_v1/year=${YEAR}"
              WAIT_STARTED=${SECONDS}
              for WAIT_PATH in "${INPUT}" "${INPUT_MANIFEST}"; do
                until [ -f "${WAIT_PATH}" ]; do
                  if [ $((SECONDS - WAIT_STARTED)) -ge 259200 ]; then
                    echo "timed out waiting for dependency file: ${WAIT_PATH}" >&2
                    exit 1
                  fi
                  echo "waiting for v6 dependency: ${WAIT_PATH}"
                  sleep 120
                done
              done
              if [ -f "${OUTPUT}" ] && [ -f "${OUTPUT_MANIFEST}" ] && [ -f "${TRACE_DIR}/_SUCCESS" ]; then
                echo "short-label shard already complete, skipping: ${OUTPUT}"
                exit 0
              fi
              exec osf-build-short-labels \
                --config experiments/runs/build_v6_w1001_1010_short_h180_vwap60_labels_v1.toml \
                --input "${INPUT}" \
                --output "${OUTPUT}" \
                --output-dir "${TRACE_DIR}" \
                --overwrite
          volumeMounts:
            - name: opening-strength-output
              mountPath: /mnt/output
          resources:
            requests:
              cpu: "2"
              memory: 16Gi
            limits:
              cpu: "8"
              memory: 96Gi
