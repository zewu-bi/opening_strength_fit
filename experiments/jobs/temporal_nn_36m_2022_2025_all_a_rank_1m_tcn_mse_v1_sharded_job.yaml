apiVersion: batch/v1
kind: Job
metadata:
  name: os-temporal-all-a-1m-tcn-mse-v1
  namespace: bizewu
spec:
  backoffLimitPerIndex: 0
  completionMode: Indexed
  completions: 8
  parallelism: 4
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: highfort
      volumes:
        - name: opening-strength-output
          persistentVolumeClaim:
            claimName: bizewu-private-data
        - name: experiment-config
          configMap:
            name: os-temporal-all-a-1m-tcn-mse-v1-config
      nodeSelector:
        has_gpu: "true"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - node7
                      - node8
      tolerations:
        - key: has_gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: opening-strength-fit
          image: registry.corp.highfortfunds.com/bizewu/opening-strength-fit@sha256:8a16ba894e9b9a6496ad487313116770e3bd3ae5357bb1258d1a80da5974bc91
          imagePullPolicy: IfNotPresent
          workingDir: /app/opening_strength_fit
          env:
            - name: JOB_COMPLETION_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: "metadata.annotations['batch.kubernetes.io/job-completion-index']"
          command:
            - /bin/bash
            - -lc
            - |
              set -euo pipefail
              mkdir -p /etc/OpenCL/vendors
              echo libnvidia-opencl.so.1 > /etc/OpenCL/vendors/nvidia.icd
              WAIT_PATH=/mnt/output/opening_strength_fit/cache/full_day_return_paths_sequence_v1/_SUCCESS
              WAIT_PATH_TIMEOUT_SECONDS=21600
              WAIT_PATH_INTERVAL_SECONDS=60
              WAIT_PATH_STARTED=${SECONDS}
              until [ -f "${WAIT_PATH}" ]; do
                if [ $((SECONDS - WAIT_PATH_STARTED)) -ge "${WAIT_PATH_TIMEOUT_SECONDS}" ]; then
                  echo "timed out waiting for dependency file: ${WAIT_PATH}" >&2
                  exit 1
                fi
                echo "waiting for dependency file: ${WAIT_PATH}"
                sleep "${WAIT_PATH_INTERVAL_SECONDS}"
              done
              echo "dependency file is ready: ${WAIT_PATH}"

              ROOT=/mnt/output/opening_strength_fit/runs/models/temporal-nn/temporal_nn_36m_2022_2025_all_a_rank_1m_tcn_mse_v1
              mkdir -p "${ROOT}"
              TEST_STARTS=(2022-01 2022-07 2023-01 2023-07 2024-01 2024-07 2025-01 2025-07)
              TEST_ENDS=(2022-06 2022-12 2023-06 2023-12 2024-06 2024-12 2025-06 2025-12)
              INDEX="${JOB_COMPLETION_INDEX:-}"
              if [ -z "${INDEX}" ]; then
                echo "missing JOB_COMPLETION_INDEX for indexed shard job" >&2
                exit 1
              fi
              if [ "${INDEX}" -lt 0 ] || [ "${INDEX}" -ge "${#TEST_STARTS[@]}" ]; then
                echo "JOB_COMPLETION_INDEX out of range: ${INDEX}" >&2
                exit 1
              fi

              TEST_START="${TEST_STARTS[${INDEX}]}"
              TEST_END="${TEST_ENDS[${INDEX}]}"
              OUT="${ROOT}/fold_${TEST_START}_${TEST_END}"
              if [ -f "${OUT}/_SUCCESS" ] && [ -f "${OUT}/metrics_by_year.csv" ] && [ -f "${OUT}/predictions.parquet" ]; then
                echo "test window ${TEST_START}..${TEST_END}: required outputs already exist, skipping ${OUT}"
                exit 0
              fi

              echo "running temporal_nn_36m_2022_2025_all_a_rank_1m_tcn_mse_v1 shard test=${TEST_START}..${TEST_END} index=${INDEX}"
              echo "output_dir=${OUT}"
              osf-train-temporal-nn \
                --config /etc/opening-strength-fit/run.toml \
                --rolling-monthly \
                --train-months 36 \
                --test-months 6 \
                --test-stride-months 6 \
                --test-start-month "${TEST_START}" \
                --test-end-month "${TEST_END}" \
                --output-dir "${OUT}"
          volumeMounts:
            - name: opening-strength-output
              mountPath: /mnt/output
            - name: experiment-config
              mountPath: /etc/opening-strength-fit
              readOnly: true
          resources:
            requests:
              cpu: "8"
              memory: 48Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "16"
              memory: 96Gi
              nvidia.com/gpu: "1"
