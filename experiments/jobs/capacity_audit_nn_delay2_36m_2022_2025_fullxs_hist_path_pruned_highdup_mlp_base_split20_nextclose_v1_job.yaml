apiVersion: batch/v1
kind: Job
metadata:
  name: os-cap-2225-nn-mlp-nc20
  namespace: bizewu
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: highfort
      volumes:
        - name: opening-strength-output
          persistentVolumeClaim:
            claimName: bizewu-private-data
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: NotIn
                  values:
                    - node7
                    - node8
      containers:
        - name: opening-strength-fit
          image: registry.corp.highfortfunds.com/bizewu/opening-strength-fit:20260625-capacity-audit-v6
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: xy-fit-ceph-credentials
          workingDir: /app/opening_strength_fit
          command:
            - /bin/bash
            - -lc
            - |
              set -euo pipefail
              WAIT_PATH_TIMEOUT_SECONDS=21600
              WAIT_PATH_INTERVAL_SECONDS=120
              WAIT_PATH_STARTED=${SECONDS}
              WAIT_PATHS=("/mnt/output/opening_strength_fit/runs/models/nn/nn_delay2_36m_2022_2025_fullxs_hist_path_pruned_highdup_mlp_base_v1/month_2025-07/_SUCCESS" "/mnt/output/opening_strength_fit/cache/opening_13y_201301_202512_delay2_next_close_labels_v1/opening_2025_next_close_labels_v1.parquet")
              for WAIT_PATH in "${WAIT_PATHS[@]}"; do
                until [ -f "${WAIT_PATH}" ]; do
                  if [ $((SECONDS - WAIT_PATH_STARTED)) -ge "${WAIT_PATH_TIMEOUT_SECONDS}" ]; then
                    echo "timed out waiting for dependency file: ${WAIT_PATH}" >&2
                    exit 1
                  fi
                  echo "waiting for dependency file: ${WAIT_PATH}"
                  sleep "${WAIT_PATH_INTERVAL_SECONDS}"
                done
                echo "dependency file is ready: ${WAIT_PATH}"
              done
              exec osf-audit-capacity \
                --predictions /mnt/output/opening_strength_fit/runs/models/nn/nn_delay2_36m_2022_2025_fullxs_hist_path_pruned_highdup_mlp_base_v1 \
                --label-input /mnt/output/opening_strength_fit/cache/opening_13y_201301_202512_delay2_next_close_labels_v1 \
                --run-id capacity_audit_nn_delay2_36m_2022_2025_fullxs_hist_path_pruned_highdup_mlp_base_split20_nextclose_v1 \
                --variant 'Capacity-only audit for the 2022-2025 NN MLP base experiment, using pool_L, next-close returns, and a 1bn total strategy capital split across 20 slices, so each decision group targets 50m CNY notional.' \
                --pool L \
                --pool-date-lag-sessions 0 \
                --score-col prediction \
                --label-col alpha_return_next_close \
                --target-notional 50000000 \
                --capacity-notional-col turnover_diff_30t \
                --capacity-price-col ask_price_1 \
                --max-participation-rate 0.10 \
                --max-symbol-weight 0.01 \
                --min-trade-notional 0 \
                --max-names 0 \
                --ask-depth-levels 0 \
                --ask-depth-participation-rate 0.25 \
                --max-industry-weight 0 \
                --fee-bps 0 \
                --slippage-bps 0 \
                --selected-output-limit 200000 \
                --output-dir /mnt/output/opening_strength_fit/runs/analyses/capacity-audit/capacity_audit_nn_delay2_36m_2022_2025_fullxs_hist_path_pruned_highdup_mlp_base_split20_nextclose_v1
          volumeMounts:
            - name: opening-strength-output
              mountPath: /mnt/output
          resources:
            requests:
              cpu: "8"
              memory: 256Gi

            limits:
              cpu: "16"
              memory: 512Gi
