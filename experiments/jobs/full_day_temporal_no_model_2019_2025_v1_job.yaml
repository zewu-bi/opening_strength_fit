apiVersion: batch/v1
kind: Job
metadata:
  name: os-full-day-temporal-no-model-v1
  namespace: bizewu
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: highfort
      volumes:
        - name: opening-strength-output
          persistentVolumeClaim:
            claimName: bizewu-private-data
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: NotIn
                  values:
                    - node7
                    - node8
      containers:
        - name: opening-strength-fit
          image: registry.corp.highfortfunds.com/bizewu/opening-strength-fit:20260724-temporal-analysis-v4
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: xy-fit-ceph-credentials
          workingDir: /app/opening_strength_fit
          command:
            - /bin/bash
            - -lc
            - |
              set -euo pipefail
              WAIT_PATH_TIMEOUT_SECONDS=21600
              WAIT_PATH_INTERVAL_SECONDS=60
              WAIT_PATH_STARTED=${SECONDS}
              WAIT_PATHS=("/mnt/output/opening_strength_fit/cache/full_day_clock6_narrow_1m_10m_60m_v1/year=2019/_SUCCESS" "/mnt/output/opening_strength_fit/cache/full_day_clock6_narrow_1m_10m_60m_v1/year=2020/_SUCCESS" "/mnt/output/opening_strength_fit/cache/full_day_clock6_narrow_1m_10m_60m_v1/year=2021/_SUCCESS" "/mnt/output/opening_strength_fit/cache/full_day_clock6_narrow_1m_10m_60m_v1/year=2022/_SUCCESS" "/mnt/output/opening_strength_fit/cache/full_day_clock6_narrow_1m_10m_60m_v1/year=2023/_SUCCESS" "/mnt/output/opening_strength_fit/cache/full_day_clock6_narrow_1m_10m_60m_v1/year=2024/_SUCCESS" "/mnt/output/opening_strength_fit/cache/full_day_clock6_narrow_1m_10m_60m_v1/year=2025/_SUCCESS" "/mnt/output/opening_strength_fit/cache/daily_close_to_next_close_labels_v1/_SUCCESS")
              for WAIT_PATH in "${WAIT_PATHS[@]}"; do
                until [ -f "${WAIT_PATH}" ]; do
                  if [ $((SECONDS - WAIT_PATH_STARTED)) -ge "${WAIT_PATH_TIMEOUT_SECONDS}" ]; then
                    echo "timed out waiting for dependency file: ${WAIT_PATH}" >&2
                    exit 1
                  fi
                  echo "waiting for dependency file: ${WAIT_PATH}"
                  sleep "${WAIT_PATH_INTERVAL_SECONDS}"
                done
                echo "dependency file is ready: ${WAIT_PATH}"
              done
              exec osf-analyze-full-day-temporal \
                --config experiments/runs/full_day_temporal_no_model_2019_2025_v1.toml \
                --output-dir /mnt/output/opening_strength_fit/runs/analyses/temporal-no-model-analysis/full_day_temporal_no_model_2019_2025_v1
          volumeMounts:
            - name: opening-strength-output
              mountPath: /mnt/output
          resources:
            requests:
              cpu: "16"
              memory: 96Gi

            limits:
              cpu: "32"
              memory: 192Gi
