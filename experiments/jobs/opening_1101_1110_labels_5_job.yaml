apiVersion: batch/v1
kind: Job
metadata:
  name: os-ds-label5-w1101-1110-v1
  namespace: bizewu
  labels: {app: os-ds-label5-w1101-1110-v1}
spec:
  activeDeadlineSeconds: 259200
  backoffLimit: 2
  completionMode: Indexed
  completions: 7
  parallelism: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {app: os-ds-label5-w1101-1110-v1}
    spec:
      restartPolicy: Never
      imagePullSecrets: [{name: highfort}]
      volumes:
        - name: output
          persistentVolumeClaim: {claimName: bizewu-private-data}
        - name: config
          configMap: {name: os-ds350-w1101-config-v1}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: kubernetes.io/hostname, operator: NotIn, values: [node7, node8]}
      containers:
        - name: builder
          image: registry.corp.highfortfunds.com/bizewu/opening-strength-fit:20260804-training-datasets-v2
          imagePullPolicy: Always
          workingDir: /app/opening_strength_fit
          env:
            - name: JOB_COMPLETION_INDEX
              valueFrom:
                fieldRef: {fieldPath: "metadata.annotations['batch.kubernetes.io/job-completion-index']"}
          command: [/bin/bash, -lc]
          args:
            - |
              set -euo pipefail
              YEARS=(2019 2020 2021 2022 2023 2024 2025)
              YEAR="${YEARS[${JOB_COMPLETION_INDEX}]}"
              exec osf-build-training-datasets --config /mnt/window-config/opening_1101_1110_labels_5.toml --kind labels --year "${YEAR}" --overwrite
          volumeMounts:
            - {name: output, mountPath: /mnt/output}
            - {name: config, mountPath: /mnt/window-config, readOnly: true}
          resources:
            requests: {cpu: "4", memory: 8Gi}
            limits: {cpu: "12", memory: 32Gi}
