apiVersion: batch/v1
kind: Job
metadata:
  name: os-audit-36m-2225-pooll-hygiene
  namespace: bizewu
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: highfort
      volumes:
        - name: opening-strength-output
          persistentVolumeClaim:
            claimName: bizewu-private-data
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: NotIn
                  values:
                    - node7
      containers:
        - name: opening-strength-fit
          image: registry.corp.highfortfunds.com/bizewu/opening-strength-fit:20260618-feature-hygiene-v1
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: opening-strength-clickhouse
            - secretRef:
                name: xy-fit-ceph-credentials
          workingDir: /app/opening_strength_fit
          command:
            - /bin/bash
            - -lc
            - |
              set -euo pipefail
              WAIT_PATH_TIMEOUT_SECONDS=43200
              WAIT_PATH_INTERVAL_SECONDS=120
              WAIT_PATH_STARTED=${SECONDS}
              WAIT_PATHS=("/mnt/output/opening_strength_fit/cache/opening_2013_2025_label_v1_tick2_physical_mixed_w030/opening_2019_label_v1_tick2_physical_mixed_w030.parquet" "/mnt/output/opening_strength_fit/cache/opening_2013_2025_label_v1_tick2_physical_mixed_w030/opening_2020_label_v1_tick2_physical_mixed_w030.parquet" "/mnt/output/opening_strength_fit/cache/opening_2013_2025_label_v1_tick2_physical_mixed_w030/opening_2021_label_v1_tick2_physical_mixed_w030.parquet" "/mnt/output/opening_strength_fit/cache/opening_2013_2025_label_v1_tick2_physical_mixed_w030/opening_2022_label_v1_tick2_physical_mixed_w030.parquet" "/mnt/output/opening_strength_fit/cache/opening_2013_2025_label_v1_tick2_physical_mixed_w030/opening_2023_label_v1_tick2_physical_mixed_w030.parquet" "/mnt/output/opening_strength_fit/cache/opening_2013_2025_label_v1_tick2_physical_mixed_w030/opening_2024_label_v1_tick2_physical_mixed_w030.parquet" "/mnt/output/opening_strength_fit/cache/opening_2013_2025_label_v1_tick2_physical_mixed_w030/opening_2025_label_v1_tick2_physical_mixed_w030.parquet" "/mnt/output/opening_strength_fit/runs/analyses/feature-audit/lgbm_delay2_36m_2022_2025_pool_l_feature_audit_v1/feature_importance.csv")
              for WAIT_PATH in "${WAIT_PATHS[@]}"; do
                until [ -f "${WAIT_PATH}" ]; do
                  if [ $((SECONDS - WAIT_PATH_STARTED)) -ge "${WAIT_PATH_TIMEOUT_SECONDS}" ]; then
                    echo "timed out waiting for dependency file: ${WAIT_PATH}" >&2
                    exit 1
                  fi
                  echo "waiting for dependency file: ${WAIT_PATH}"
                  sleep "${WAIT_PATH_INTERVAL_SECONDS}"
                done
                echo "dependency file is ready: ${WAIT_PATH}"
              done
              exec osf-audit-feature-hygiene \
                --config experiments/runs/lgbm_delay2_36m_2022_2025_pool_l_feature_hygiene_v1.toml \
                --output-dir /mnt/output/opening_strength_fit/runs/analyses/feature-hygiene/lgbm_delay2_36m_2022_2025_pool_l_feature_hygiene_v1
          volumeMounts:
            - name: opening-strength-output
              mountPath: /mnt/output
          resources:
            requests:
              cpu: "4"
              memory: 64Gi

            limits:
              cpu: "8"
              memory: 128Gi
