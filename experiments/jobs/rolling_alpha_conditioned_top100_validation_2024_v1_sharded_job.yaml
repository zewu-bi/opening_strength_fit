apiVersion: batch/v1
kind: Job
metadata:
  name: opening-strength-rolling-alpha-conditioned-sharded-0caf7a4e
  namespace: bizewu
spec:
  backoffLimit: 0
  completionMode: Indexed
  completions: 12
  parallelism: 1
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: highfort
      volumes:
        - name: opening-strength-output
          persistentVolumeClaim:
            claimName: bizewu-private-data
      nodeSelector:
        kubernetes.io/hostname: "node9"
      containers:
        - name: opening-strength-fit
          image: registry.corp.highfortfunds.com/bizewu/opening-strength-fit:opening-strength-fit-20260529-next-close-finite-v2
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: opening-strength-clickhouse
          workingDir: /app/opening_strength_fit
          env:
            - name: JOB_COMPLETION_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: "metadata.annotations['batch.kubernetes.io/job-completion-index']"
          command:
            - /bin/bash
            - -lc
            - |
              set -euo pipefail

              ROOT=/mnt/output/opening_strength_fit/rolling_alpha_conditioned_top100_validation_2024_v1
              mkdir -p "${ROOT}"
              MONTHS=(2024-01 2024-02 2024-03 2024-04 2024-05 2024-06 2024-07 2024-08 2024-09 2024-10 2024-11 2024-12)
              INDEX="${JOB_COMPLETION_INDEX:-}"
              if [ -z "${INDEX}" ]; then
                echo "missing JOB_COMPLETION_INDEX for indexed shard job" >&2
                exit 1
              fi
              if [ "${INDEX}" -lt 0 ] || [ "${INDEX}" -ge "${#MONTHS[@]}" ]; then
                echo "JOB_COMPLETION_INDEX out of range: ${INDEX}" >&2
                exit 1
              fi

              MONTH="${MONTHS[${INDEX}]}"
              OUT="${ROOT}/month_${MONTH}"
              if [ -f "${OUT}/rolling_summary.csv" ]; then
                echo "month ${MONTH}: metrics already exist, skipping ${OUT}"
                exit 0
              fi

              echo
              echo "running rolling_alpha_conditioned_top100_validation_2024_v1 shard month=${MONTH} index=${INDEX}"
              echo "output_dir=${OUT}"

              python scripts/run_alpha_conditioned_rolling_validation.py \
                --config experiments/runs/rolling_alpha_conditioned_top100_validation_2024_v1.toml \
                --rolling-monthly \
                --train-months 12 \
                --test-start-month "${MONTH}" \
                --test-end-month "${MONTH}" \
                --output-dir "${OUT}"
          volumeMounts:
            - name: opening-strength-output
              mountPath: /mnt/output
          resources:
            requests:
              cpu: "8"
              memory: 192Gi

            limits:
              cpu: "16"
              memory: 256Gi

