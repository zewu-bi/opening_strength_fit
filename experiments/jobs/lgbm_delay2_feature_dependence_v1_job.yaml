apiVersion: batch/v1
kind: Job
metadata:
  name: opening-strength-lgbm-delay2-feature-dependence-v1
  namespace: bizewu
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: highfort
      volumes:
        - name: opening-strength-output
          persistentVolumeClaim:
            claimName: bizewu-private-data
      nodeSelector:
        kubernetes.io/hostname: "node8"
      containers:
        - name: opening-strength-fit
          image: registry.corp.highfortfunds.com/bizewu/opening-strength-fit:20260527-feature-audit-fix
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: opening-strength-clickhouse
          workingDir: /app/opening_strength_fit
          command:
            - osf-audit-feature-dependence
            - --config
            - experiments/runs/lgbm_delay2_feature_dependence_v1.toml
            - --output-dir
            - /mnt/output/opening_strength_fit/runs/analyses/feature-audit/lgbm_delay2_feature_dependence_v1
            - --skip-ablation
          volumeMounts:
            - name: opening-strength-output
              mountPath: /mnt/output
          resources:
            requests:
              cpu: "8"
              memory: 192Gi

            limits:
              cpu: "16"
              memory: 256Gi

