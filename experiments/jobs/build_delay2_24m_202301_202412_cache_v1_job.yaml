apiVersion: batch/v1
kind: Job
metadata:
  name: opening-strength-build-delay2-24m-202301-202412-cache-v1
  namespace: bizewu
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: highfort
      volumes:
        - name: opening-strength-output
          persistentVolumeClaim:
            claimName: bizewu-private-data
      nodeSelector:
        kubernetes.io/hostname: "node9"
      containers:
        - name: opening-strength-fit
          image: registry.corp.highfortfunds.com/bizewu/opening-strength-fit:opening-strength-fit-20260529-next-close-finite-v2
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: opening-strength-clickhouse
          workingDir: /app/opening_strength_fit
          command:
            - python
            - scripts/build_labeled_cache.py
            - --config
            - experiments/runs/build_delay2_24m_202301_202412_cache_v1.toml
            - --output-dir
            - /mnt/output/opening_strength_fit/build_delay2_24m_202301_202412_cache_v1
          volumeMounts:
            - name: opening-strength-output
              mountPath: /mnt/output
          resources:
            requests:
              cpu: "8"
              memory: 256Gi

            limits:
              cpu: "16"
              memory: 512Gi

