apiVersion: batch/v1
kind: Job
metadata:
  name: os-analyze-nn-v6-1001-1010-short1m
  namespace: bizewu
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: highfort
      nodeSelector:
        kubernetes.io/hostname: node14
      tolerations:
        - key: has_gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      volumes:
        - name: opening-strength-output
          persistentVolumeClaim:
            claimName: bizewu-private-data
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: NotIn
                  values:
                    - node6
                    - node7
                    - node8
                    - node12
                    - node17
                    - node19
                    - node20
                    - node22
                    - node24
                    - node25
                    - node26
                    - node27
                    - node28
      containers:
        - name: opening-strength-fit
          image: registry.corp.highfortfunds.com/bizewu/opening-strength-fit:20260731-corrected-label-matrix
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: opening-strength-clickhouse
            - secretRef:
                name: xy-fit-ceph-credentials
          workingDir: /app/opening_strength_fit
          command:
            - /bin/bash
            - -lc
            - |
              set -euo pipefail
              WAIT_PATH_TIMEOUT_SECONDS=86400
              WAIT_PATH_INTERVAL_SECONDS=120
              WAIT_PATH_STARTED=${SECONDS}
              WAIT_PATHS=("/mnt/output/opening_strength_fit/nn/nn_v6_w1001_1010_short1m_corrected_nextclose_36m_grouped_gated_v2_mse/month_2022-01/metrics_by_year.csv" "/mnt/output/opening_strength_fit/nn/nn_v6_w1001_1010_short1m_corrected_nextclose_36m_grouped_gated_v2_mse/month_2022-07/metrics_by_year.csv" "/mnt/output/opening_strength_fit/nn/nn_v6_w1001_1010_short1m_corrected_nextclose_36m_grouped_gated_v2_mse/month_2023-01/metrics_by_year.csv" "/mnt/output/opening_strength_fit/nn/nn_v6_w1001_1010_short1m_corrected_nextclose_36m_grouped_gated_v2_mse/month_2023-07/metrics_by_year.csv" "/mnt/output/opening_strength_fit/nn/nn_v6_w1001_1010_short1m_corrected_nextclose_36m_grouped_gated_v2_mse/month_2024-01/metrics_by_year.csv" "/mnt/output/opening_strength_fit/nn/nn_v6_w1001_1010_short1m_corrected_nextclose_36m_grouped_gated_v2_mse/month_2024-07/metrics_by_year.csv" "/mnt/output/opening_strength_fit/nn/nn_v6_w1001_1010_short1m_corrected_nextclose_36m_grouped_gated_v2_mse/month_2025-01/metrics_by_year.csv" "/mnt/output/opening_strength_fit/nn/nn_v6_w1001_1010_short1m_corrected_nextclose_36m_grouped_gated_v2_mse/month_2025-07/metrics_by_year.csv")
              for WAIT_PATH in "${WAIT_PATHS[@]}"; do
                until [ -f "${WAIT_PATH}" ]; do
                  if [ $((SECONDS - WAIT_PATH_STARTED)) -ge "${WAIT_PATH_TIMEOUT_SECONDS}" ]; then
                    echo "timed out waiting for dependency file: ${WAIT_PATH}" >&2
                    exit 1
                  fi
                  echo "waiting for dependency file: ${WAIT_PATH}"
                  sleep "${WAIT_PATH_INTERVAL_SECONDS}"
                done
                echo "dependency file is ready: ${WAIT_PATH}"
              done
              rm -rf /mnt/output/opening_strength_fit/nn/nn_v6_w1001_1010_short1m_corrected_nextclose_36m_grouped_gated_v2_mse/analysis/pool_internal_top100
              mkdir -p /mnt/output/opening_strength_fit/nn/nn_v6_w1001_1010_short1m_corrected_nextclose_36m_grouped_gated_v2_mse/analysis/pool_internal_top100
              mkdir -p /mnt/output/opening_strength_fit/nn/nn_v6_w1001_1010_short1m_corrected_nextclose_36m_grouped_gated_v2_mse/analysis/pool_internal_top100/reports
              osf-analyze-pool-internal-top100 \
                --predictions \
                /mnt/output/opening_strength_fit/nn/nn_v6_w1001_1010_short1m_corrected_nextclose_36m_grouped_gated_v2_mse \
                --next-close-label-input \
                /mnt/output/opening_strength_fit/cache/opening_2019_2025_next_close_decision_clock_state_clock6_1001_1010 \
                --run-id \
                nn_v6_w1001_1010_short1m_corrected_nextclose_36m_grouped_gated_v2_mse \
                --variant \
                nn_v6_w1001_1010_short1m_corrected_nextclose_grouped_gated_v2_mech_v3_gelu_mse \
                --output-dir \
                /mnt/output/opening_strength_fit/nn/nn_v6_w1001_1010_short1m_corrected_nextclose_36m_grouped_gated_v2_mse/analysis/pool_internal_top100 \
                --report-dir \
                /mnt/output/opening_strength_fit/nn/nn_v6_w1001_1010_short1m_corrected_nextclose_36m_grouped_gated_v2_mse/analysis/pool_internal_top100/reports \
                --plot-prefix \
                nn_v6_w1001_1010_short1m_corrected_nextclose_grouped_gated_v2_mech_v3_gelu_mse \
                --plot-variant-label \
                'v6 decision-state 10:01:00-10:10:00 short1m + corrected next-close' \
                --plot-period \
                quarter \
                --top-n \
                100 \
                --pool-date-lag-sessions \
                0 \
                --pool \
                universe \
                --pool \
                L
          volumeMounts:
            - name: opening-strength-output
              mountPath: /mnt/output
          resources:
            requests:
              cpu: "8"
              memory: 256Gi
            limits:
              cpu: "16"
              memory: 384Gi
