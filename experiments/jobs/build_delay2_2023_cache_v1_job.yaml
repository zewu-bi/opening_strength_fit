apiVersion: batch/v1
kind: Job
metadata:
  name: opening-strength-build-delay2-2023-cache-v1
  namespace: bizewu
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: highfort
      volumes:
        - name: opening-strength-output
          persistentVolumeClaim:
            claimName: bizewu-private-data
        - name: opening-strength-config
          configMap:
            name: opening-strength-2024-cache-config-v1
      nodeSelector:
        kubernetes.io/hostname: "node9"
      containers:
        - name: opening-strength-fit
          image: registry.corp.highfortfunds.com/bizewu/opening-strength-fit:opening-strength-fit-20260529-next-close-finite-v2
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: opening-strength-clickhouse
          workingDir: /app/opening_strength_fit
          command:
            - osf-build-labeled-cache
            - --config
            - /mnt/config/build_delay2_2023_cache_v1.toml
            - --output-dir
            - /mnt/output/opening_strength_fit/build_delay2_2023_cache_v1
          volumeMounts:
            - name: opening-strength-output
              mountPath: /mnt/output
            - name: opening-strength-config
              mountPath: /mnt/config
              readOnly: true
          resources:
            requests:
              cpu: "8"
              memory: 256Gi

            limits:
              cpu: "16"
              memory: 512Gi
