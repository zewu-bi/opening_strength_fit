apiVersion: v1
kind: ConfigMap
metadata:
  name: os-nextclose-corrected-w0931-0940-config
  namespace: bizewu
data:
  opening_0931_0940_next_close_clock6_rebuild.toml: |
    [run]
    id = "opening_0931_0940_next_close_clock6_rebuild"
    kind = "next_close_label_cache"

    [next_close_labels]
    buy_price_col = "buy_price"
    decision_times = ["09:31:00", "09:32:00", "09:33:00", "09:34:00", "09:35:00", "09:36:00", "09:37:00", "09:38:00", "09:39:00", "09:40:00"]
    close_offset_us = 54000000000
    close_lookback_seconds = 1800
    calendar_days_after = 14
    fee_bps = 0.0

    [clickhouse]
    host = "ch.db.prod.highfortfunds.com"
    port = 8123
    table = "stock.tick"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: os-nextclose-corrected-w0931-0940
  namespace: bizewu
  labels:
    app: os-nextclose-corrected-w0931-0940
spec:
  backoffLimit: 1
  completionMode: Indexed
  completions: 7
  parallelism: 7
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: os-nextclose-corrected-w0931-0940
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: highfort
      volumes:
        - name: opening-strength-output
          persistentVolumeClaim:
            claimName: bizewu-private-data
        - name: run-config
          configMap:
            name: os-nextclose-corrected-w0931-0940-config
      nodeSelector:
        kubernetes.io/hostname: node15
      containers:
        - name: opening-strength-fit
          image: registry.corp.highfortfunds.com/bizewu/opening-strength-fit:20260730-short3m-label-v1
          imagePullPolicy: Always
          workingDir: /app/opening_strength_fit
          envFrom:
            - secretRef:
                name: opening-strength-clickhouse
          env:
            - name: JOB_COMPLETION_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: "metadata.annotations['batch.kubernetes.io/job-completion-index']"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          command:
            - /bin/bash
            - -lc
            - |
              set -euo pipefail
              YEARS=(2019 2020 2021 2022 2023 2024 2025)
              INDEX="${JOB_COMPLETION_INDEX:-}"
              if [ -z "${INDEX}" ] || [ "${INDEX}" -lt 0 ] || [ "${INDEX}" -ge "${#YEARS[@]}" ]; then
                echo "invalid JOB_COMPLETION_INDEX=${INDEX}" >&2
                exit 1
              fi
              YEAR="${YEARS[$INDEX]}"
              INPUT_ROOT="/mnt/output/opening_strength_fit/cache/opening_2019_2025_label_v6_decision_clock_state_clock6_unique_base_mcap_lag1"
              OUTPUT_ROOT="/mnt/output/opening_strength_fit/cache/opening_2019_2025_next_close_decision_clock_state_clock6_0931_0940"
              INPUT="${INPUT_ROOT}/opening_${YEAR}_label_v6_decision_clock_state_clock6_unique_base_mcap_lag1.parquet"
              INPUT_MANIFEST="${INPUT}.manifest.json"
              OUTPUT="${OUTPUT_ROOT}/opening_${YEAR}_next_close_decision_clock_state_clock6_0931_0940.parquet"
              PARTIAL="${OUTPUT}.partial.${POD_NAME}.parquet"
              TRACE_DIR="/mnt/output/opening_strength_fit/cache_builds/opening_0931_0940_next_close_clock6_rebuild/year=${YEAR}"
              WAIT_STARTED=${SECONDS}
              for WAIT_PATH in "${INPUT}" "${INPUT_MANIFEST}"; do
                until [ -f "${WAIT_PATH}" ]; do
                  if [ $((SECONDS - WAIT_STARTED)) -ge 259200 ]; then
                    echo "timed out waiting for dependency file: ${WAIT_PATH}" >&2
                    exit 1
                  fi
                  echo "waiting for corrected v6 dependency: ${WAIT_PATH}"
                  sleep 120
                done
              done
              if [ -f "${OUTPUT}" ] && [ -f "${TRACE_DIR}/next_close_label_cache_trace.json" ] && [ -f "${TRACE_DIR}/_SUCCESS" ]; then
                echo "next-close shard already complete, skipping: ${OUTPUT}"
                exit 0
              fi
              osf-build-next-close-labels \
                --config /mnt/run-config/opening_0931_0940_next_close_clock6_rebuild.toml \
                --input "${INPUT}" \
                --output "${PARTIAL}" \
                --output-dir "${TRACE_DIR}"
              mv -f "${PARTIAL}" "${OUTPUT}"
              touch "${TRACE_DIR}/_SUCCESS"
          volumeMounts:
            - name: opening-strength-output
              mountPath: /mnt/output
            - name: run-config
              mountPath: /mnt/run-config
              readOnly: true
          resources:
            requests:
              cpu: "4"
              memory: 64Gi
            limits:
              cpu: "8"
              memory: 128Gi
