[run]
id = "build_daily_close_to_next_close_labels_2019_2025_v1"
kind = "daily_return_label_cache"
description = "Build adjusted D-close to D+1-close daily labels for the pre-close temporal-feature overlay."
status = "completed"

[daily_return_labels]
label_kind = "close_to_next_close"
output_root = "/mnt/output/opening_strength_fit/cache/daily_close_to_next_close_labels_v1"
feature_start_date = "2019-01-02"
feature_end_date = "2025-12-31"
calendar_days_after = 14
fee_bps = 0.0

[clickhouse]
host = "ch.db.prod.highfortfunds.com"
port = 8123
table = "stock.daily_bar_jy"

[universe]
symbol_regex = "^(?:(?:00|30)\\d{4}\\.SZ|(?:60|68)\\d{4}\\.SH)$"

[output]
local_dir = "output/artifacts/cache_builds/build_daily_close_to_next_close_labels_2019_2025_v1"
k8s_dir = "/mnt/output/opening_strength_fit/cache_builds/build_daily_close_to_next_close_labels_2019_2025_v1"

[k8s]
namespace = "bizewu"
job_name = "os-daily-cc-labels-2019-2025-v1"
image_pull_secret = "highfort"
pvc = "bizewu-private-data"
mount_path = "/mnt/output"
clickhouse_secret = "opening-strength-clickhouse"
helper_image = "registry.corp.highfortfunds.com/bizewu/opening-strength-fit:20260724-daily-cc-label-v2"
avoid_nodes = ["node7", "node8"]

[k8s.resources]
cpu_request = "4"
cpu_limit = "8"
memory_request = "16Gi"
memory_limit = "32Gi"
