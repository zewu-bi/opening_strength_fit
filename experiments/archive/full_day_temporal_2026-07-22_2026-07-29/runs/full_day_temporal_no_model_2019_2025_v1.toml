[run]
id = "full_day_temporal_no_model_2019_2025_v1"
kind = "temporal_no_model_analysis"
description = "No-model clock-by-horizon diagnostics of realized intraday paths against adjusted D-close to D+1-close returns; also materialize reusable day-level sequence shards."
status = "completed"

[temporal_analysis]
feature_root = "/mnt/output/opening_strength_fit/cache/full_day_clock6_narrow_1m_10m_60m_v1"
label_root = "/mnt/output/opening_strength_fit/cache/daily_close_to_next_close_labels_v1"
sequence_root = "/mnt/output/opening_strength_fit/cache/full_day_return_paths_sequence_v1"
start_date = "2019-01-02"
end_date = "2025-12-31"
decision_ranges = ["09:30:00..11:29:00", "13:00:00..14:59:00"]
workers = 8
top_n = 100
tail_fraction = 0.10

[stock_pool]
enabled = true
name = "pool_L"
path = "lml.bzw@ssd/data/pool_L.parquet"
date_lag_sessions = 0

[output]
layout = "v2"

[k8s]
namespace = "bizewu"
job_name = "os-full-day-temporal-no-model-v1"
image_pull_secret = "highfort"
pvc = "bizewu-private-data"
mount_path = "/mnt/output"
env_secrets = ["xy-fit-ceph-credentials"]
wait_for_paths = [
  "/mnt/output/opening_strength_fit/cache/full_day_clock6_narrow_1m_10m_60m_v1/year=2019/_SUCCESS",
  "/mnt/output/opening_strength_fit/cache/full_day_clock6_narrow_1m_10m_60m_v1/year=2020/_SUCCESS",
  "/mnt/output/opening_strength_fit/cache/full_day_clock6_narrow_1m_10m_60m_v1/year=2021/_SUCCESS",
  "/mnt/output/opening_strength_fit/cache/full_day_clock6_narrow_1m_10m_60m_v1/year=2022/_SUCCESS",
  "/mnt/output/opening_strength_fit/cache/full_day_clock6_narrow_1m_10m_60m_v1/year=2023/_SUCCESS",
  "/mnt/output/opening_strength_fit/cache/full_day_clock6_narrow_1m_10m_60m_v1/year=2024/_SUCCESS",
  "/mnt/output/opening_strength_fit/cache/full_day_clock6_narrow_1m_10m_60m_v1/year=2025/_SUCCESS",
  "/mnt/output/opening_strength_fit/cache/daily_close_to_next_close_labels_v1/_SUCCESS",
]
avoid_nodes = ["node7", "node8"]

[k8s.resources]
cpu_request = "16"
cpu_limit = "32"
memory_request = "96Gi"
memory_limit = "192Gi"
