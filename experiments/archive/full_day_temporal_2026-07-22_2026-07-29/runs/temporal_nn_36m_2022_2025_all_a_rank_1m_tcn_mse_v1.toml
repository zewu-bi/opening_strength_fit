[run]
id = "temporal_nn_36m_2022_2025_all_a_rank_1m_tcn_mse_v1"
kind = "temporal_nn"
description = "Single-horizon 1m return-path residual TCN baseline trained and evaluated across all A shares; 10m and 60m channels are fully masked."
status = "completed"

[temporal_data]
sequence_root = "/mnt/output/opening_strength_fit/cache/full_day_return_paths_sequence_v1"

[temporal_features]
value_mode = "cross_section_rank"
raw_scale = 0.02

[temporal_features.latest_clocks]
"1m" = "14:47"
"10m" = "00:00"
"60m" = "00:00"

[model]
name = "temporal_nn"
architecture = "tcn"
hidden_width = 64
dropout = 0.10

[training]
device = "cuda"
train_universe = "all_a"
evaluation_universe = "all_a"
batch_size = 1024
epochs = 6
learning_rate = 0.001
weight_decay = 0.0001
loss = "mse"
head_fraction = 0.10
selection_metric = "top_n_excess"
patience = 2
seed = 20260724

[evaluation]
selection_mode = "cross_section"
ic_mode = "cross_section"
top_n = 100

[window]
mode = "rolling_monthly"
train_months = 36
validation_months = 3
test_months = 6
test_stride_months = 6
test_start_month = "2022-01"
test_end_month = "2025-12"

[output]
layout = "v2"

[k8s]
namespace = "bizewu"
job_name = "os-temporal-all-a-1m-tcn-mse-v1"
image_pull_secret = "highfort"
pvc = "bizewu-private-data"
mount_path = "/mnt/output"
shard_job_mode = "indexed"
shard_parallelism = 4
backoff_limit_per_index = 0
wait_for_paths = [
  "/mnt/output/opening_strength_fit/cache/full_day_return_paths_sequence_v1/_SUCCESS",
]
avoid_nodes = ["node7", "node8"]

[k8s.node_selector]
has_gpu = "true"

[k8s.resources]
cpu_request = "8"
cpu_limit = "16"
memory_request = "48Gi"
memory_limit = "96Gi"
gpu_limit = "1"
