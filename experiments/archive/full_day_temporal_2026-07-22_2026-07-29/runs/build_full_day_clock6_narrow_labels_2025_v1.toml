[run]
id = "build_full_day_clock6_narrow_labels_2025_v1"
kind = "labeled_cache"
description = "Build the 2025 narrow full-session fixed-clock +6s labels for 1m, 10m, and 60m trading-time holds with 60s VWAP exits."
status = "running"

[data]
source = "clickhouse"
start_date = "2025-01-01"
end_date = "2025-12-31"
input_kind = "raw_ticks"
tick_timestamp_deduplication = "latest_local_timestamp"

[cache]
enabled = true
read = true
write = true
overwrite = false
schema_version = "full_day_clock6_narrow_1m_10m_60m_v1"
path = "/mnt/output/opening_strength_fit/cache/full_day_clock6_narrow_1m_10m_60m_v1/year=2025"

[clickhouse]
host = "ch.db.prod.highfortfunds.com"
port = 8123
table = "stock.tick"
start_offset_us = 34200000000
end_offset_us = 54000000000

[universe]
enabled = true
symbol_regex = "^(?:(?:00|30)\\d{4}\\.SZ|(?:60|68)\\d{4}\\.SH)$"
symbols_file = ""

[sample]
decision_max_lag_seconds = 5

[full_day_labels]
enabled = true
output_mode = "labels_only"
decision_ranges = ["09:30:00..11:29:00", "13:00:00..14:59:00"]
sessions = ["09:30:00-11:30:00", "13:00:00-15:00:00"]
horizons = ["1m", "10m", "60m"]

[labels]
buy_price_col = "ask_price_1"
volume_col = "volume"
turnover_col = "turnover"
sell_window_seconds = 60
volume_unit_multiplier = 1.0
fee_bps = 0.0
entry_tick_delay = 2
entry_alignment = "clock_state"
entry_clock_delay_seconds = 6
future_alignment = "clock_state"
require_entry_after_cross_section_ready = true

[features]
include_preopen = false

[filters]
tradable_statuses = ["T0", "20", "TRADE"]

[output]
local_dir = "output/artifacts/cache_builds/build_full_day_clock6_narrow_labels_2025_v1"
k8s_dir = "/mnt/output/opening_strength_fit/cache_builds/build_full_day_clock6_narrow_labels_2025_v1"

[k8s]
namespace = "bizewu"
job_name = "os-full-day-narrow-2025-v1"
image_pull_secret = "highfort"
pvc = "bizewu-private-data"
mount_path = "/mnt/output"
clickhouse_secret = "opening-strength-clickhouse"
helper_image = "registry.corp.highfortfunds.com/bizewu/opening-strength-fit:20260723-full-day-narrow-v4"
avoid_nodes = ["node7", "node8"]

[k8s.resources]
cpu_request = "8"
cpu_limit = "16"
memory_request = "32Gi"
memory_limit = "64Gi"
