name: ci

on:
  pull_request:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -c requirements.lock -e ".[dev]"
      - name: Check installed dependencies
        run: python -m pip check
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: python -m pytest -q --cov=opening_strength_fit --cov-report=term-missing --cov-fail-under=55
      - name: Public smoke example
        run: make smoke PYTHON=python
      - name: Contracts
        run: |
          python -m opening_strength_fit.commands.experiment_audit --summary-only
          python -m opening_strength_fit.commands.project_contracts
