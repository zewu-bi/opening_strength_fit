[run]
id = "public_ridge_smoke"
kind = "example"
description = "Deterministic local Ridge example over a tiny tracked labeled frame."
status = "completed"

[data]
source = "labeled_pvc"
labeled_path = "examples/smoke/labeled.csv"

[window]
mode = "chronological"
test_start_date = "2022-01-05"
test_end_date = "2022-01-06"

[model]
name = "ridge"
alpha = 1.0

[features]
include_feature_prefixes = ["feature_"]

[evaluation]
top_n = 1
score_bins = 3
bucket_mode = "daily"
selection_mode = "cross_section"
ic_mode = "cross_section"

[universe]
enabled = false
